#theme: jekyll-theme-cayman
# Pinned to a commit (the fork's HEAD on 2026-09-28): unpinned, every build fetched whatever HEAD was.
remote_theme: chris1111/cayman-dark@fe3525069a05f3ca4a012cfeccdcc8526c321044
title: go2cs
description: Golang to C# Converter
github:
  repository_name: ritchiecarroll/go2cs
  owner_url: https://github.com/ritchiecarroll
  owner_name: J. Ritchie Carroll
plugins:
  - jemoji
# Internal records stay in the repository and on GitHub but are not published on the site.
# Jekyll excludes every source path that STARTS WITH an entry, so name no file at the docs/ root
# with one of these prefixes. After the build, .github/site-outside-links.py reads this list,
# points links into it at GitHub, and fails the run if any of it was built.
exclude:
  - phase3
  - phase4
  - doctrine
