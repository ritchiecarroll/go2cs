# On-demand OS matrix — the fleet's missing platforms, and a native-Linux control.
#
# This workflow is NEVER a merge gate. The repository's authoritative instruments
# (check-no-regression.ps1, run-behavioral.ps1, run-validated-sweep.ps1) run on the fleet's own
# machines against measured budgets; this is a supplement that reaches hardware the fleet does not
# own — both macOS legs above all — and a native-Linux control for readings the WSL lane produced.
# It is never triggered by code: no push trigger and no pull_request trigger. It runs on
# workflow_dispatch, and on ONE daily schedule that runs the darwin census and nothing else.
#
# Why darwin has a schedule and the other flavors do not: windows and linux are each compiled by
# standing gates on the fleet's own machines, so a mechanical break in either surfaces the day it
# lands. NOTHING compiles the darwin flavor. On 2026-09-02 a one-line CS0266 -- `var` inferring
# `StandardBox<T>` where the base `ж<T>` was needed, left by the box-kind split's 754-site emitter
# flip (36b7e9d96) -- was found SEVEN DAYS after it landed, by the first darwin dispatch since. The
# alternative to a schedule is not "no cost", it is "however long until someone looks". A census is
# 10-17 runner minutes; seven days of a silently red platform is the price it replaces.
#
# The scheduled run is still NOT A MERGE GATE. It is a regression guard whose conclusion is read on
# the morning board: a red scheduled census is a regression attributable to the day's trains.
#
# Guide: docs/CIMatrix.md. Corpus mechanics, GoTargetOS flavors and the measured budget rows the
# timeouts below are scaled from: CLAUDE.md.

name: OS matrix (on demand)

on:
  # A scheduled event carries NO inputs -- `inputs.*` is empty for every one of them -- so the plan
  # job below resolves the effective goos/stage/filter/dotnet once and every consumer reads its
  # outputs rather than `inputs.*`. That is what keeps workflow_dispatch behaviour byte-identical
  # while giving the schedule somewhere to get its values from.
  #
  # 04:41 UTC: a quiet hour, and deliberately not on the hour -- every repository that asks for
  # "daily" gets `0 4`, and GitHub delays a congested cron rather than dropping it.
  schedule:
    - cron: '41 4 * * *'

  workflow_dispatch:
    inputs:
      goos:
        description: 'Corpus flavor to measure (darwin fans out to BOTH mac runners)'
        type: choice
        required: true
        default: linux
        options:
          - windows
          - linux
          - darwin
      stage:
        description: 'What to run: census (compile the corpus flavor), behavioral-smoke (harness proof), behavioral-full (the whole enumeration in slices), sweep-shard (filtered validated sweep), behavioral-stderr (run named projects directly and keep their WHOLE stderr — the runner quotes one line per death), release-smoke (pack every go.* package on windows, then consume that ONE feed on all four shipped RIDs; goos is ignored)'
        type: choice
        required: true
        default: census
        options:
          - census
          - behavioral-smoke
          - behavioral-full
          - behavioral-stderr
          - sweep-shard
          - release-smoke
      filter:
        description: 'Shard filter — comma-separated EXACT roster package names for sweep-shard ("sort" sweeps sort and never internal/fmtsort), project substring for behavioral-smoke. IGNORED by behavioral-full, which runs the whole enumeration in slices. Blank takes the stage default. Comma-separated project NAMES for behavioral-stderr.'
        type: string
        required: false
        default: ''
      dotnet:
        description: 'SDK channel for setup-dotnet. 10.0.x is the corpus TFM''s own runtime and the only channel master builds with; a 1.23.1.x anchor ships from its own tag''s workflow, which pins its SDK.'
        type: choice
        required: false
        default: 10.0.x
        options:
          - 10.0.x
      published_version:
        description: 'release-smoke only: a go.* version ALREADY on nuget.org (e.g. 1.24.13.4). Blank packs this tree and consumes that pack (the pre-publish gate). Set, it skips the pack and every leg restores that version from nuget.org: the post-publish smoke.'
        type: string
        required: false
        default: ''
      run_timeout:
        description: 'Per-program RUN budget in seconds for the behavioral stages (GO2CS_RUN_TIMEOUT), 1-1800. Blank takes 120, the budget every stage used before this input existed. Raise it to tell a slow program on the 3-core macos-15 runner from a real hang: a NOT MEASURED (timeout) row says only that the budget expired. A large value on behavioral-full can exceed that stage''s job budget.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

# Different flavors and different stages may run at once; two dispatches of the SAME pair queue
# rather than cancel, because a half-measured census is worth nothing and a killed sweep leaves
# regenerated artifacts behind.
concurrency:
  # github.event.inputs rather than the inputs context: this expression is evaluated before the
  # workflow's own contexts are in play, and the github context is the spelling guaranteed there.
  # A scheduled run has no `github.event.inputs`, so both halves fall back to the schedule's own
  # pair; without the fallback every scheduled run would share one empty group with any other
  # input-less event.
  group: os-matrix-${{ github.ref }}-${{ github.event.inputs.goos || 'darwin' }}-${{ github.event.inputs.stage || 'census' }}
  cancel-in-progress: false

env:
  # Back-to-back MSBuild invocations must not leave lock-holding worker nodes behind (CLAUDE.md's
  # MSB4166 / MSB3027 notes). Never `dotnet build-server shutdown` — machine-global, even here.
  MSBUILDDISABLENODEREUSE: '1'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ---------------------------------------------------------------------------------------------
  # plan — derive everything that must not be hardcoded, and fan darwin out to two runners.
  # ---------------------------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
      go-version: ${{ steps.derive.outputs.go-version }}
      # The EFFECTIVE dispatch parameters. Every consumer downstream reads these rather than
      # `inputs.*`, because `inputs.*` is empty on a schedule event.
      goos: ${{ steps.derive.outputs.goos }}
      stage: ${{ steps.derive.outputs.stage }}
      filter: ${{ steps.derive.outputs.filter }}
      dotnet: ${{ steps.derive.outputs.dotnet }}
      run-timeout: ${{ steps.derive.outputs.run-timeout }}
      published-version: ${{ steps.derive.outputs.published-version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Derive toolchain pin and target matrix
        id: derive
        shell: pwsh
        env:
          INPUT_GOOS: ${{ inputs.goos }}
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_FILTER: ${{ inputs.filter }}
          INPUT_DOTNET: ${{ inputs.dotnet }}
          INPUT_RUN_TIMEOUT: ${{ inputs.run_timeout }}
          INPUT_PUBLISHED_VERSION: ${{ inputs.published_version }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          # ---- effective parameters --------------------------------------------------------
          # A `schedule` event carries no inputs at all, so it gets the scheduled guard's fixed
          # pair. Resolving it HERE, once, is what lets the rest of the workflow stay written
          # against a single source; a dispatch is unchanged because its inputs are always present.
          if ($env:EVENT_NAME -eq 'schedule') {
              $goos = 'darwin'; $stage = 'census'; $filter = ''; $dotnet = '10.0.x'
              Write-Host "scheduled regression guard: goos=$goos stage=$stage (inputs are empty on a schedule event)"
          }
          else {
              $goos = $env:INPUT_GOOS; $stage = $env:INPUT_STAGE
              $filter = $env:INPUT_FILTER; $dotnet = $env:INPUT_DOTNET
          }

          # Defaulting rather than trusting: a `workflow_dispatch` through the REST API may omit an
          # input that the form would have filled, and an empty $stage would otherwise reach the
          # budget lookup below and throw "Unknown stage ''" instead of doing the obvious thing.
          if (-not $goos)   { $goos = 'linux' }
          if (-not $stage)  { $stage = 'census' }
          if (-not $dotnet) { $dotnet = '10.0.x' }
          if ($null -eq $filter) { $filter = '' }

          # The behavioral stages' per-program run budget. A schedule has no inputs and keeps 120, as
          # does a blank dispatch. A value that is not a whole number of seconds in 1..1800 FAILS the
          # plan by name rather than reaching the runner as a string it would misread.
          $runTimeout = if ($env:EVENT_NAME -eq 'schedule') { '' } else { "$env:INPUT_RUN_TIMEOUT".Trim() }
          if (-not $runTimeout) { $runTimeout = '120' }
          if ($runTimeout -notmatch '^[0-9]+$' -or [int]$runTimeout -lt 1 -or [int]$runTimeout -gt 1800) {
              throw "run_timeout must be a whole number of seconds from 1 to 1800; got '$runTimeout'."
          }
          Write-Host "behavioral run budget: $runTimeout s per program"

          # The post-publish smoke: a version nuget.org already serves. Only release-smoke reads it, and a malformed
          # value FAILS the plan by name rather than reaching a restore as a version nothing serves.
          $publishedVersion = if ($env:EVENT_NAME -eq 'schedule') { '' } else { "$env:INPUT_PUBLISHED_VERSION".Trim() }
          if ($publishedVersion) {
              if ($env:INPUT_STAGE -ne 'release-smoke') { throw "published_version applies to stage release-smoke only; got stage '$($env:INPUT_STAGE)'." }
              if ($publishedVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') { throw "published_version must be a four-part go.* version such as 1.24.13.4; got '$publishedVersion'." }
              Write-Host "release-smoke: post-publish, go.* $publishedVersion from nuget.org (no pack)"
          }

          $env:INPUT_GOOS = $goos
          $env:INPUT_STAGE = $stage

          # The Go release is READ FROM version.props, never written here. run-validated-sweep.ps1
          # and the converter both refuse a toolchain whose release differs from <GoStdLibVersion>
          # (NOT MEASURED, never a verdict), so a hardcoded version in CI would either duplicate
          # that pin or silently contradict it.
          $props = [System.IO.File]::ReadAllText((Join-Path $PWD 'src/version.props'))

          if ($props -notmatch '<GoStdLibVersion>\s*([^<\s]+)\s*</GoStdLibVersion>') {
              throw 'Could not read <GoStdLibVersion> from src/version.props -- the toolchain pin has no source.'
          }

          $goVersion = $Matches[1]
          Write-Host "corpus release pin: go$goVersion (from src/version.props)"

          # Runner + RID pairs. darwin is TWO legs on purpose: the corpus flavor has never been
          # built on Apple hardware at all, and arm64 vs x64 are different compilations of it.
          $targets = switch ($env:INPUT_GOOS) {
              'windows' { @(@{ goos = 'windows'; runner = 'windows-latest';  rid = 'win-x64'   }) }
              'linux'   { @(@{ goos = 'linux';   runner = 'ubuntu-latest';   rid = 'linux-x64' }) }
              'darwin'  { @(@{ goos = 'darwin';  runner = 'macos-15';        rid = 'osx-arm64' },
                            @{ goos = 'darwin';  runner = 'macos-15-intel';  rid = 'osx-x64'   }) }
              default   { throw "Unknown goos '$($env:INPUT_GOOS)'." }
          }

          # release-smoke runs EVERY shipped RID from ONE pack, whatever goos says: its question is whether
          # the packages a release would publish carry what this tree's converter emits, on every OS they
          # ship for (C2, ec147f1d7f: N's converter emits unsafe.ArrayPointer, which the published 1.24.13.3
          # lacks). Three dispatches would be three packs of the same tree; one pack feeds all four legs.
          if ($env:INPUT_STAGE -eq 'release-smoke') {
              $targets = @(
                  @{ goos = 'windows'; runner = 'windows-latest';  rid = 'win-x64'   },
                  @{ goos = 'linux';   runner = 'ubuntu-latest';   rid = 'linux-x64' },
                  @{ goos = 'darwin';  runner = 'macos-15';        rid = 'osx-arm64' },
                  @{ goos = 'darwin';  runner = 'macos-15-intel';  rid = 'osx-x64'   })
              Write-Host "release-smoke: all four shipped RIDs from one pack (goos '$($env:INPUT_GOOS)' does not narrow it)"
          }

          # Job budgets, in MINUTES, scaled from CLAUDE.md's measured rows for a ~4-core runner.
          # A timeout is a safety net against a hung child, never a performance assumption, so
          # these sit well ABOVE the top of each measured range. GitHub's own hard ceiling for a
          # hosted job is 360 minutes; every value below stays under it after the mac multiplier.
          $baseTimeout = @{
              'census'           = 150   # go2cs-stdlib.slnx --no-incremental: 516s on the i7-5820K
                                         # (healthy disk) + a COLD 307-project NuGet restore.
              'behavioral-smoke' = 90    # converter `go build` + a filtered 4-phase run whose
                                         # shared core closure is built from cold.
              'behavioral-stderr' = 60   # converter go build + transpile/compile of a handful of
                                         # NAMED projects (the first pulls the core closure from
                                         # cold) + one direct run per project under the runner's
                                         # own 120 s budget. PROVISIONAL until the first run.
              'behavioral-full'  = 150   # the WHOLE enumeration in slices with a purge between.
                                         # PROVISIONAL, and deliberately labelled so: the first
                                         # real run of this leg replaces it. What IS measured, on
                                         # a 4-core Linux host at GoTargetOS=linux: a 3-project
                                         # slice costs 274s COLD (bin/obj/Generated purged, so the
                                         # core closure is rebuilt) and 58s warm. Subtracting a
                                         # ~5.3 s/project marginal puts the cold fixed term near
                                         # 258s and the warm one near 42s.
                                         #
                                         # Do NOT read ~62 min off that. The fixed term is NOT a
                                         # constant: the runner pre-builds the UNION of a slice's
                                         # dependencies, which was 6 shared deps for those 3
                                         # projects and is ~31 for the whole corpus, so a
                                         # 164-project slice pays materially more than the numbers
                                         # above. src/core does stay warm across slices (the purge
                                         # never touches it), so slices 2..n pay the warm term --
                                         # but the extrapolation from 3 projects to 655 is an
                                         # extrapolation, not a measurement, and it is the one
                                         # thing here that has never been run end to end.
                                         # 150 is chosen to clear a pessimistic reading of it with
                                         # the headroom the table's own doctrine asks for.
              'sweep-shard'      = 210   # one -tests convert/build/run/compare cycle per matched
                                         # row; the sweep's own per-package floors reach 120m.
              'release-smoke'    = 90    # the LEG only (the pack job has its own budget): converter
                                         # go build + four small restore/build/run arms against the
                                         # feed, each restoring into a fresh cache. PROVISIONAL
                                         # until the first run.
          }

          $entries = foreach ($t in $targets) {
              $minutes = $baseTimeout[$env:INPUT_STAGE]

              if (-not $minutes) { throw "Unknown stage '$($env:INPUT_STAGE)'." }

              # The mac legs get 1.5x: macos-15 (arm64) is a 3-core runner, and every phase here
              # is parallel-MSBuild bound. Rounded to whole minutes; still under the 360 ceiling.
              if ($t.runner -like 'macos-*') { $minutes = [int][math]::Ceiling($minutes * 1.5) }

              [pscustomobject]@{
                  goos    = $t.goos
                  runner  = $t.runner
                  rid     = $t.rid
                  timeout = $minutes
              }
          }

          # -AsArray so a single-target dispatch still emits a JSON ARRAY: PowerShell unwraps a
          # one-element pipeline to a scalar, and fromJson() would then hand the matrix an object.
          $json = @($entries) | ConvertTo-Json -Compress -Depth 4 -AsArray

          Write-Host "matrix: $json"

          Add-Content -Path $env:GITHUB_OUTPUT -Value "matrix=$json" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "go-version=$goVersion" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "goos=$goos" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "stage=$stage" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "filter=$filter" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "dotnet=$dotnet" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "run-timeout=$runTimeout" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "published-version=$publishedVersion" -Encoding utf8

  # ---------------------------------------------------------------------------------------------
  # pack — release-smoke only: the release's own pack, as a rehearsal, on a hosted Windows runner.
  # ---------------------------------------------------------------------------------------------
  # push-nuget.ps1 -VersionSuffix is PACK-ONLY by construction: it bumps nothing, tags nothing, writes
  # nothing under docs/validation and pushes nothing (its own parameter contract). It builds and packs
  # one flavor per GoTargetOS and merges them, which is the only RELEASE-configuration build of the
  # darwin flavor anywhere (the census above compiles Debug). The merged feed is what the legs consume.
  # Windows PowerShell, as on the release machine: release-nuget.ps1 drives this script through
  # `powershell`, and the script declares 5.1.
  pack:
    needs: plan
    # The post-publish smoke (published_version set) restores from nuget.org and packs nothing.
    if: needs.plan.outputs.stage == 'release-smoke' && needs.plan.outputs.published-version == ''
    runs-on: windows-latest
    # PROVISIONAL: three Release build+pack passes of the whole stdlib solution on a 4-core runner
    # (the i7 measures ~17 min per pass); never yet run on a hosted runner.
    timeout-minutes: 240
    steps:
      - name: Checkout (full history and tags -- the pre-flight reads release tags and snapshots)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go (pinned to the corpus release)
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.plan.outputs.go-version }}
          check-latest: false
          cache-dependency-path: src/go2cs/go.sum

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.plan.outputs.dotnet }}

      - name: Pack every go.* package (rehearsal)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path 'artifacts' | Out-Null
          $feed = Join-Path $PWD 'feed'
          $log = Join-Path $PWD 'artifacts/pack.log'
          $suffix = "ci.${{ github.run_id }}"

          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & powershell -NoProfile -ExecutionPolicy Bypass -File src/push-nuget.ps1 -VersionSuffix $suffix -OutDir $feed *>&1 |
              Tee-Object -FilePath $log
          $packExit = $LASTEXITCODE
          $sw.Stop()

          $count = @(Get-ChildItem $feed -Filter *.nupkg -File -ErrorAction SilentlyContinue).Count
          $summary = @(
              '## Release-smoke pack (windows-latest)'
              ''
              "push-nuget.ps1 -VersionSuffix $suffix -- exit ``$packExit`` after $([int]$sw.Elapsed.TotalMinutes) min; $count merged package(s)"
              ''
              '```'
          ) + @(Get-Content -LiteralPath $log | Select-String -Pattern '==> (Layout L3|Flavor comparison|  of |Merged|Shipped shape|Packed|\[)' | ForEach-Object { $_.Line }) + @('```')
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          & ./.github/annotate-summary.ps1 -Title 'release-smoke pack' -Lines $summary

          if ($packExit -eq 0 -and $count -eq 0) { Write-Host '::error::the pack reported success and produced no package'; exit 1 }
          exit $packExit

      - name: Upload the feed
        uses: actions/upload-artifact@v6
        with:
          name: release-smoke-feed
          # The merged packages only; the per-flavor _flavors/ packs are inspection copies.
          path: feed/*.nupkg
          retention-days: 3
          if-no-files-found: error

      - name: Upload the pack log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-smoke-pack-log
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------------------
  # run — one leg per (goos, runner, rid).
  # ---------------------------------------------------------------------------------------------
  run:
    needs: [plan, pack]
    # pack runs for release-smoke only; every other stage sees it SKIPPED and must still run. A failed
    # pack leaves the smoke legs nothing to consume, so they do not start.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.pack.result == 'success' || needs.pack.result == 'skipped') }}
    name: ${{ needs.plan.outputs.stage }} (${{ matrix.goos }} / ${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # A darwin leg that walls must not cancel its sibling: the whole point is to see BOTH
      # architectures' walls in one dispatch.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      # The corpus flavor this leg binds, stated explicitly rather than inherited. Every L3 csproj
      # defaults $(GoTargetOS) to `windows` when the property is EMPTY, and MSBuild maps
      # environment variables onto properties -- so ONE variable is the entire binding for every
      # child `dotnet` invocation of every instrument (the mechanism src/_paths.ps1 documents).
      # On Windows this is the identity; on Linux it agrees with _paths.ps1's own pin; on macOS it
      # is new, and it is what makes a darwin run a DARWIN run instead of a windows-flavor one.
      GoTargetOS: ${{ matrix.goos }}
      GOOS_TARGET: ${{ matrix.goos }}
      RID: ${{ matrix.rid }}
      STAGE: ${{ needs.plan.outputs.stage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go (pinned to the corpus release)
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.plan.outputs.go-version }}
          check-latest: false
          cache-dependency-path: src/go2cs/go.sum

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          # Channel comes from the `dotnet` input: 10.0.x, the corpus TFM's own runtime since the
          # Stage-2 hop. An SDK cannot target a framework newer than itself, so an older channel
          # could only fail here with NETSDK1045; the 1.23.1.x anchors build from their own tag.
          dotnet-version: ${{ needs.plan.outputs.dotnet }}

      - name: Environment report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          New-Item -ItemType Directory -Force -Path 'artifacts' | Out-Null
          $report = Join-Path $PWD "artifacts/environment-$($env:GOOS_TARGET)-$($env:RID).txt"

          # A calibration record, not decoration: every budget in CLAUDE.md's table is anchored to
          # named hardware, and the first dispatches of this workflow are what anchor the runners.
          $lines = @(
              "stage           : $($env:STAGE)"
              "goos / rid      : $($env:GOOS_TARGET) / $($env:RID)"
              "GoTargetOS env  : $($env:GoTargetOS)"
              "runner os       : $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription.Trim())"
              "runner arch     : $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
              "logical cores   : $([Environment]::ProcessorCount)"
              "pwsh            : $($PSVersionTable.PSVersion)"
              "go              : $(& go version)"
              "go env GOVERSION: $(& go env GOVERSION)"
              "go env GOROOT   : $(& go env GOROOT)"
              "dotnet sdk      : $(& dotnet --version)"
          )

          # Free space on the repo drive. The harness scripts refuse below a 25 GB floor because a
          # mid-run write failure surfaces as a corpus FAILURE (three such incidents, 2026-08-13);
          # hosted runner images sit near or below that floor, which is why the stages below pass
          # -IgnoreDiskPreflight -- and why this number is recorded before anything else runs.
          $drive = [System.IO.DriveInfo]::new([System.IO.Path]::GetPathRoot($PWD.Path))
          $lines += "free space      : $([math]::Round($drive.AvailableFreeSpace / 1GB, 1)) GB on $($drive.Name)"

          $lines | Tee-Object -FilePath $report
          $lines | ForEach-Object { "    $_" } | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      # -------------------------------------------------------------------------------------
      # census — compile the corpus flavor and bucket the errors by CS code.
      # -------------------------------------------------------------------------------------
      - name: Census — build the corpus flavor
        if: needs.plan.outputs.stage == 'census'
        shell: pwsh
        run: |
          # 'Continue': the build's own diagnostics are the measurement, and a native command's
          # stderr under 'Stop' would abort the run before anything is bucketed.
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null
          $log = Join-Path $art "census-$goos-$rid.log"

          # --no-incremental is REQUIRED for any pass that changes target: what differs between
          # GoTargetOS values is the <Compile> ITEM SET, not any source timestamp, so an
          # incremental build silently validates the other target's assemblies (CLAUDE.md, L3 gate
          # lesson 2). A fresh checkout has no obj/ anyway; the flag makes the intent explicit.
          $buildArgs = @(
              'build', 'src/go2cs-stdlib.slnx',
              '-c', 'Debug', '-m', '--no-incremental',
              "-p:GoTargetOS=$goos",
              '-p:UseSharedCompilation=false',
              '-clp:ErrorsOnly'
          )

          Write-Host "==> dotnet $($buildArgs -join ' ')"

          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & dotnet @buildArgs | Tee-Object -FilePath $log
          $buildExit = $LASTEXITCODE
          $sw.Stop()

          $elapsed = [int]$sw.Elapsed.TotalSeconds
          Write-Host "==> build exit $buildExit after ${elapsed}s"

          # ---- bucket by diagnostic code ------------------------------------------------------
          # MSBuild error shape: `path(l,c): error CS0246: text [project.csproj]`. The code class
          # is deliberately broad (CS, MSB, NETSDK, ...) -- a platform census must not silently
          # drop an infrastructure error just because it is not a compiler one.
          $lines = @(Get-Content -LiteralPath $log -ErrorAction SilentlyContinue)
          $errorRegex = [regex]'(?:^|\s)error\s+([A-Za-z]+[0-9]+)\s*:'
          $projectRegex = [regex]'\[([^\]]+\.(?:csproj|slnx))\]\s*$'

          $records = foreach ($line in $lines) {
              $m = $errorRegex.Match($line)

              if (-not $m.Success) { continue }

              $pm = $projectRegex.Match($line.TrimEnd())

              [pscustomobject]@{
                  Code    = $m.Groups[1].Value
                  Project = if ($pm.Success) { Split-Path -Leaf $pm.Groups[1].Value } else { '(no project)' }
                  Text    = $line.Trim()
              }
          }

          $records = @($records)
          # MSBuild reprints one error once per referencing project, so both numbers are reported:
          # the raw count is what the build emitted, the distinct count is how many defects it is.
          $distinct = @($records | Sort-Object Text -Unique)

          # ---- assemblies produced ------------------------------------------------------------
          # The census metric that matters is packages-COMPILING, not raw error count: fixing a
          # file-inclusion defect RAISES the error count by surfacing latent ones behind it.
          $projects = @(Get-ChildItem -Path 'src/core' -Recurse -File -Filter '*.csproj' |
              Where-Object { $_.Name -notmatch '\.tests\.csproj$' })

          $built = New-Object System.Collections.Generic.List[string]
          $unbuilt = New-Object System.Collections.Generic.List[string]

          foreach ($project in $projects) {
              $text = [System.IO.File]::ReadAllText($project.FullName)

              $assembly = if ($text -match '<AssemblyName>\s*([^<]+?)\s*</AssemblyName>') {
                  $Matches[1]
              }
              else {
                  [System.IO.Path]::GetFileNameWithoutExtension($project.Name)
              }

              # OutDir is bin/$(Configuration)/$(TargetFramework)/ relative to the project. The TFM
              # folder is DERIVED, never spelled (CENSUS-tfm-inventory.md Class D): a hardcoded
              # name here reported "0 assemblies produced" on a green build after a TFM hop.
              $dll = Get-ChildItem -Path (Join-Path $project.DirectoryName 'bin/Debug') -Directory -ErrorAction SilentlyContinue |
                  ForEach-Object { Join-Path $_.FullName "$assembly.dll" } |
                  Where-Object { Test-Path -LiteralPath $_ } |
                  Select-Object -First 1
              $relative = $project.FullName.Substring($PWD.Path.Length).TrimStart('\', '/').Replace('\', '/')

              if ($dll) { $built.Add($relative) } else { $unbuilt.Add($relative) }
          }

          # ---- summary ------------------------------------------------------------------------
          $summary = New-Object System.Collections.Generic.List[string]
          $summary.Add("## Compile census -- GOOS=$goos ($rid)")
          $summary.Add('')
          $summary.Add("Command: ``dotnet $($buildArgs -join ' ')``")
          $summary.Add('')
          $summary.Add('| | |')
          $summary.Add('|:--|--:|')
          $summary.Add("| Projects under ``src/core`` | $($projects.Count) |")
          $summary.Add("| **Assemblies produced** | **$($built.Count)** |")
          $summary.Add("| Projects with no assembly | $($unbuilt.Count) |")
          $summary.Add("| Error lines (raw) | $($records.Count) |")
          $summary.Add("| Error lines (distinct) | $($distinct.Count) |")
          $summary.Add("| Build exit code | $buildExit |")
          $summary.Add("| Wall time | ${elapsed}s |")
          $summary.Add('')
          $summary.Add('A platform-exclusive package legitimately produces no assembly on the other')
          $summary.Add('flavors (``crypto/x509/internal/macos`` is darwin-exclusive), so "no assembly" is')
          $summary.Add('a starting point for reading the wall, never a defect count on its own.')
          $summary.Add('')

          if ($distinct.Count -gt 0) {
              $summary.Add('### Errors by code')
              $summary.Add('')
              $summary.Add('| Code | Distinct | Raw |')
              $summary.Add('|:--|--:|--:|')

              foreach ($group in ($distinct | Group-Object Code | Sort-Object Count -Descending)) {
                  $raw = @($records | Where-Object { $_.Code -eq $group.Name }).Count
                  $summary.Add("| ``$($group.Name)`` | $($group.Count) | $raw |")
              }

              $summary.Add('')
              $summary.Add('### Errors by project')
              $summary.Add('')
              $summary.Add('| Project | Distinct errors |')
              $summary.Add('|:--|--:|')

              foreach ($group in ($distinct | Group-Object Project | Sort-Object Count -Descending)) {
                  $summary.Add("| ``$($group.Name)`` | $($group.Count) |")
              }

              $summary.Add('')
              $summary.Add('### First 40 distinct errors')
              $summary.Add('')
              $summary.Add('```')
              foreach ($record in ($distinct | Select-Object -First 40)) { $summary.Add($record.Text) }
              $summary.Add('```')
          }
          else {
              $summary.Add('### No errors reported')
          }

          $summaryPath = Join-Path $art "census-$goos-$rid-summary.md"
          Set-Content -LiteralPath $summaryPath -Value $summary -Encoding utf8
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

          $built | Set-Content -LiteralPath (Join-Path $art "census-$goos-$rid-assemblies.txt") -Encoding utf8
          $unbuilt | Set-Content -LiteralPath (Join-Path $art "census-$goos-$rid-no-assembly.txt") -Encoding utf8
          $distinct | ForEach-Object { $_.Text } |
              Set-Content -LiteralPath (Join-Path $art "census-$goos-$rid-errors.txt") -Encoding utf8

          # The step carries the BUILD's verdict. For darwin a red run with a bucketed census IS
          # the successful outcome of the exercise -- read the summary, not the checkmark.
          # The summary is ALSO emitted as annotations. Both places a leg's evidence normally
          # lands -- the job summary and the uploaded artifact -- are served from Azure blob
          # storage, so a host whose egress allows api.github.com but denies that domain can read
          # every step's CONCLUSION and none of its content. Annotations come back from the
          # check-runs REST API itself, which keeps this leg readable from such a host (and puts
          # the headline on the run page besides). Nothing above is replaced.
          & ./.github/annotate-summary.ps1 -Title "census $goos/$rid" -Lines $summary

          exit $buildExit

      # -------------------------------------------------------------------------------------
      # behavioral-full — the NATIVE-HOST leg accumulator 180 turned into a concrete need.
      #
      # A platform-exclusive guard's golden and its MSTest entries are verified ONLY on a
      # native-host leg: a foreign host skips every phase by name (that is what the marker is
      # for), and CNR is transpile-only, so a missing golden is nobody's business there either.
      # ScmRightsSeam and SendtoSeam are linux-exclusive and RUN here; the six windows-exclusives
      # are SKIPPED by name, and that skip line is part of what this leg asserts.
      #
      # WHY SLICES. Every behavioral project copies the same 55-dll core closure into its own
      # bin, so the per-project cost is FLAT at ~29.7 MB regardless of the package's weight
      # (measured twice, agreeing: 29.8 and 29.7). At 655 measurable projects that is ~19.5 GB
      # against ~14 GB free on a hosted runner -- the enumeration does not fit as one batch, and
      # narrowing it is not an option because the guarantee is about EVERY package.
      #
      # The purge is what makes the slices cheap rather than merely possible: it takes
      # src/tests/Behavioral only, -mindepth 2, so src/core stays warm and the ~236 s fixed cost
      # is paid ONCE for the whole leg. It must never take the runner's own bin -- doing that
      # once cost a run that died `exit 127, No such file or directory`.
      # -------------------------------------------------------------------------------------
      - name: Behavioral full — every package, in slices, on its native host
        if: needs.plan.outputs.stage == 'behavioral-full'
        shell: pwsh
        env:
          # Same reasoning as behavioral-smoke: the runner's OWN budgets cannot be influenced by
          # the job timeout, so a generous job budget alone would be worthless.
          GO2CS_BUILD_TIMEOUT: '5400'
          GO2CS_BUILD_ONE_TIMEOUT: '1800'
          GO2CS_TRANSPILE_TIMEOUT: '300'
          GO2CS_RUN_TIMEOUT: ${{ needs.plan.outputs.run-timeout }}
          SLICES: '4'
        run: |
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null

          $exeName = if ($IsWindows) { 'go2cs.exe' } else { 'go2cs' }
          Push-Location 'src/go2cs'
          try { & go build -o "bin/$exeName" . ; $goExit = $LASTEXITCODE }
          finally { Pop-Location }
          if ($goExit -ne 0) { Write-Host "::error::converter go build failed with exit $goExit"; exit $goExit }

          $runner = if ($IsWindows) {
              './src/tests/Behavioral/BehavioralRunner/bin/Debug/net10.0/BehavioralRunner.exe'
          } else {
              './src/tests/Behavioral/BehavioralRunner/bin/Debug/net10.0/BehavioralRunner'
          }

          & dotnet build ./src/tests/Behavioral/BehavioralRunner/BehavioralRunner.csproj -c Debug `
              -p:go2csPath="$PWD/src/" -p:UseSharedCompilation=false

          # FALSE-GREEN route #6: an instrument that cannot find its own runner reports success
          # over a hole. Assert it exists before anything reads a verdict from it.
          if (-not (Test-Path $runner)) {
              Write-Host "::error::BehavioralRunner not found at $runner"
              exit 1
          }

          $n = [int]$env:SLICES
          $sizes = @()
          $totals = @()
          $failed = @()

          for ($i = 1; $i -le $n; $i++) {
              Write-Host "==> slice $i/$n"
              $log = Join-Path $art "behavioral-full-$goos-$rid-slice$i.log"

              & $runner --slice "$i/$n" *>&1 | Tee-Object -FilePath $log
              $rc = $LASTEXITCODE
              if ($rc -ne 0) { $failed += "slice $i/$n (exit $rc)" }

              # The header the runner prints for exactly this: both numbers, machine-readable.
              $hdr = Select-String -Path $log -Pattern '^SLICE (\d+)/(\d+): (\d+) of (\d+) measurable' |
                  Select-Object -First 1
              if (-not $hdr) {
                  Write-Host "::error::slice $i/$n printed no SLICE header -- the run did not reach the enumeration"
                  $failed += "slice $i/$n (no header)"
              }
              else {
                  $sizes += [int]$hdr.Matches[0].Groups[3].Value
                  $totals += [int]$hdr.Matches[0].Groups[4].Value
              }

              # PURGE between slices -- src/tests/Behavioral only, -mindepth 2, never the runner's
              # own bin and never src/core. Depth-UNLIMITED: a maxdepth purge misses most of the
              # output (measured elsewhere at 274 of 388 directories missed).
              Get-ChildItem -Path './src/tests/Behavioral' -Directory -Recurse -Force `
                      -Include 'bin','obj','Generated' -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -notmatch '[\\/](BehavioralRunner|BehavioralTests)[\\/]' } |
                  Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

          # THE COUNT ASSERTION. A partition bug that drops packages is FALSE-GREEN route #3's
          # shape through a new door -- every slice passes and the corpus is not covered -- so the
          # sizes must SUM to the measurable total and every slice must agree on what that total
          # is. Asserted, never trusted.
          $sum = ($sizes | Measure-Object -Sum).Sum
          $distinctTotals = $totals | Sort-Object -Unique

          if ($sizes.Count -ne $n) {
              Write-Host "::error::expected $n slice headers, saw $($sizes.Count)"
              $failed += 'missing slice headers'
          }
          elseif ($distinctTotals.Count -ne 1) {
              Write-Host "::error::slices disagree on the measurable total: $($distinctTotals -join ', ')"
              $failed += 'total disagreement'
          }
          elseif ($sum -ne $distinctTotals[0]) {
              Write-Host "::error::slice sizes sum to $sum but the measurable total is $($distinctTotals[0]) -- the partition dropped packages"
              $failed += 'partition short'
          }
          else {
              Write-Host "==> partition OK: $($sizes -join ' + ') = $sum of $($distinctTotals[0]) measurable"
          }

          $summary = @(
              "## Behavioral full -- GOOS=$goos ($rid)"
              ''
              "Slices ``$n`` -- sizes ``$($sizes -join ', ')`` -- sum ``$sum`` of ``$($distinctTotals -join ',')`` measurable"
              ''
              $(if ($failed.Count -gt 0) { "FAILED: $($failed -join '; ')" } else { 'All slices green and the partition covers the enumeration.' })
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          & ./.github/annotate-summary.ps1 -Title "behavioral-full $goos/$rid" -Lines $summary

          if ($failed.Count -gt 0) { exit 1 }
          exit 0

      # -------------------------------------------------------------------------------------
      # behavioral-smoke — prove the harness itself runs on this runner.
      # -------------------------------------------------------------------------------------
      - name: Behavioral smoke — converter build + filtered run
        if: needs.plan.outputs.stage == 'behavioral-smoke'
        shell: pwsh
        env:
          SMOKE_FILTER: ${{ needs.plan.outputs.filter }}
          # BehavioralRunner's OWN budgets, in seconds: no timeout the caller sets can influence
          # them, so a generous job budget alone would be worthless if the runner killed its child
          # first. Sized for a cold 4-core hosted runner, where the shared core closure is built
          # from nothing and the Transpile phase rewrites every .cs immediately before Compile (so
          # warm state can never make the batch an incremental no-op).
          GO2CS_BUILD_TIMEOUT: '5400'
          GO2CS_BUILD_ONE_TIMEOUT: '1800'
          GO2CS_TRANSPILE_TIMEOUT: '300'
          GO2CS_RUN_TIMEOUT: ${{ needs.plan.outputs.run-timeout }}
        run: |
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null

          # Pure-compute projects: `Defer` is a family of ~13 behavioral packages that exercise
          # defer/panic/recover ordering and print through fmt -- no clock, no filesystem, no
          # sockets, so a failure is the HARNESS or the corpus flavor, never platform semantics.
          $filter = $env:SMOKE_FILTER

          if ([string]::IsNullOrWhiteSpace($filter)) { $filter = 'Defer' }

          Write-Host "==> behavioral smoke: filter '$filter', GoTargetOS=$($env:GoTargetOS)"

          # Build the converter explicitly. A hosted runner has no go2cs binary at all, and every
          # harness rebuild predicate keys on a converter *.go being NEWER than the binary -- which
          # a toolchain change never touches (FALSE-GREEN route #4). Building it here first also
          # separates a Go-toolchain failure from a harness failure in the log.
          $exeName = if ($IsWindows) { 'go2cs.exe' } else { 'go2cs' }

          Push-Location 'src/go2cs'
          try {
              & go build -o "bin/$exeName" .
              $goExit = $LASTEXITCODE
          }
          finally { Pop-Location }

          if ($goExit -ne 0) {
              Write-Host "::error::converter go build failed with exit $goExit"
              exit $goExit
          }

          Write-Host '==> converter built'

          # *>&1 merges the INFORMATION stream: the repo scripts report through Write-Host, so a
          # bare 2>&1 would drop every `==>` status line and the log would read as a hung run.
          # -IgnoreDiskPreflight: hosted images sit near or under the harness's 25 GB floor; the
          # free-space number is recorded in the environment report above so a genuine
          # disk-exhaustion failure can still be recognized rather than guessed at.
          $log = Join-Path $art "behavioral-smoke-$goos-$rid.log"

          & ./src/tests/Behavioral/run-behavioral.ps1 -IgnoreDiskPreflight --filter $filter *>&1 |
              Tee-Object -FilePath $log

          $runExit = $LASTEXITCODE

          $summary = @(
              "## Behavioral smoke -- GOOS=$goos ($rid)"
              ''
              "Filter ``$filter`` -- exit ``$runExit``"
              ''
              'Tail of the run:'
              ''
              '```'
          ) + @(Get-Content -LiteralPath $log -Tail 40 -ErrorAction SilentlyContinue) + @('```')

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          Set-Content -LiteralPath (Join-Path $art "behavioral-smoke-$goos-$rid-summary.md") -Value $summary -Encoding utf8

          # The summary is ALSO emitted as annotations. Both places a leg's evidence normally
          # lands -- the job summary and the uploaded artifact -- are served from Azure blob
          # storage, so a host whose egress allows api.github.com but denies that domain can read
          # every step's CONCLUSION and none of its content. Annotations come back from the
          # check-runs REST API itself, which keeps this leg readable from such a host (and puts
          # the headline on the run page besides). Nothing above is replaced.
          & ./.github/annotate-summary.ps1 -Title "behavioral-smoke $goos/$rid" -Lines $summary

          exit $runExit

      - name: Behavioral stderr — run named projects directly and keep the WHOLE stderr
        if: needs.plan.outputs.stage == 'behavioral-stderr'
        # A STEP limit under the job's: a wedged timeout arm once held both mac runners to the job's
        # 1h30m (run 36957913093), and one runner lost communication. Forty minutes covers five
        # projects at run_timeout 300 with their builds (the slowest measured: osx-arm64, 28 min);
        # the artifact upload below still runs (if: always()).
        timeout-minutes: 40
        shell: pwsh
        env:
          STDERR_PROJECTS: ${{ needs.plan.outputs.filter }}
          GO2CS_BUILD_TIMEOUT: '5400'
          GO2CS_BUILD_ONE_TIMEOUT: '1800'
          GO2CS_TRANSPILE_TIMEOUT: '300'
          GO2CS_RUN_TIMEOUT: ${{ needs.plan.outputs.run-timeout }}
        run: |
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null

          $names = @($env:STDERR_PROJECTS -split '[,;\s]+' | Where-Object { $_ })

          if ($names.Count -eq 0) {
              Write-Host "::error::behavioral-stderr needs the filter input as comma-separated project names"
              exit 2
          }

          $behavioral = Join-Path $PWD 'src/tests/Behavioral'
          $exit = 0

          foreach ($p in $names) {
              $proj = Join-Path $behavioral $p

              if (-not (Test-Path -LiteralPath (Join-Path $proj "$p.csproj"))) {
                  Write-Host "::error::no behavioral project named '$p'"
                  $exit = 1
                  continue
              }

              # Build exactly as the runner does (converter go build, transpile, Release compile).
            # The phase list is QUOTED: a bare transpile,compile is a PowerShell ARRAY in argument
            # position and reaches the runner as two words (`Unknown phase: transpile compile`, run
            # 33804782714);
              # the filter is a substring, so a full project name matches itself and any project
              # that CONTAINS it -- harmless for the build, and the run below names the exe by path.
              Write-Host "==> ${p}: transpile + compile through the runner"
              & ./src/tests/Behavioral/run-behavioral.ps1 -IgnoreDiskPreflight --filter $p --phase 'transpile,compile' *>&1 |
                  Tee-Object -FilePath (Join-Path $art "stderr-build-$p-$goos-$rid.log")

              $exe = Join-Path $proj "bin/Release/net10.0/$p"
              if ($IsWindows) { $exe += '.exe' }

              if (-not (Test-Path -LiteralPath $exe)) {
                  Write-Host "::error::${p}: no apphost at $exe after the compile phase"
                  $exit = 1
                  continue
              }

              # The runner's launch, reproduced: the apphost, no arguments, cwd = src/tests/Behavioral
              # (Path.GetDirectoryName(projPath)), the job's own environment (GoTargetOS bound), and
              # the same 120 s budget -- so what this prints is what the Output phase saw, whole.
              $outFile = Join-Path $art "stderr-$p-$goos-$rid.stdout.txt"
              $errFile = Join-Path $art "stderr-$p-$goos-$rid.stderr.txt"
              # Stamped BEFORE the launch: a crash report is claimed only if it was written
              # after this moment, so a stale .ips from an earlier row cannot be read as this one's.
              $launched = Get-Date
              $proc = Start-Process -FilePath $exe -WorkingDirectory $behavioral -NoNewWindow -PassThru `
                  -RedirectStandardOutput $outFile -RedirectStandardError $errFile

              $finished = $proc.WaitForExit([int]$env:GO2CS_RUN_TIMEOUT * 1000)

              if (-not $finished) {
                  # Kill the TREE, never just the apphost, and never by name (CLAUDE.md floor 5). A program
                  # that spawns itself (StdoutCloseEofBarrier execs os.Args[0]) leaves its child alive past
                  # a parent-only kill: on arm64 that orphan outlived every later row of the job (run
                  # 36953433720, "Terminate orphan process: pid (6761) (StdoutCloseEofB)" at job end).
                  # The tree is collected by PARENT PID while the apphost is still alive (an orphan
                  # re-parents to launchd or init and no longer answers pgrep -P), then every descendant
                  # is killed, then the apphost.
                  #
                  # NOTHING IS STOPPED. The first version SIGSTOPped each member before reading the next
                  # level, and on BOTH mac legs the step then hung inside the walk with no further output
                  # until the job's limit: osx-x64 ran out its 1h30m with both StdoutCloseEofB processes
                  # still alive at cleanup, and osx-arm64's runner lost communication (run 36957913093).
                  # Every call here is a one-shot native command over a RUNNING process.
                  $tree = [System.Collections.Generic.List[string]]::new()

                  if ($IsWindows) {
                      & taskkill /PID $proc.Id /T /F 2>&1 | Out-Null
                  }
                  else {
                      $frontier = @($proc.Id)
                      $descendants = @()

                      while ($frontier.Count -gt 0) {
                          $next = @()

                          foreach ($parentPid in $frontier) {
                              $next += @(& pgrep -P $parentPid 2>$null | Where-Object { "$_" -match '^\s*\d+\s*$' } | ForEach-Object { [int]"$_".Trim() })
                          }

                          # Only real, new pids: never 0 or 1, never one already collected.
                          $next = @($next | Where-Object { $_ -gt 1 -and $_ -ne $proc.Id -and $descendants -notcontains $_ })
                          $descendants += $next
                          $frontier = $next
                      }

                      foreach ($child in $descendants) {
                          $tree.Add("$child ($(@(& ps -o comm= -p $child 2>$null) -join ''))")
                      }

                      foreach ($child in $descendants) { & kill -9 $child 2>$null }
                  }

                  Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 2

                  if ($tree.Count -gt 0) {
                      Write-Host "==> ${p}: the timeout kill took the apphost and $($tree.Count) descendant(s): $($tree -join ', ')"
                  }

                  # A survivor is a pid that still exists and is not a zombie awaiting its reaper.
                  foreach ($id in @($proc.Id) + @($tree | ForEach-Object { [int]($_ -split ' ')[0] })) {
                      if ($IsWindows) {
                          $alive = Get-Process -Id $id -ErrorAction SilentlyContinue
                          $survivor = if ($alive) { "$($alive.ProcessName)" } else { '' }
                      }
                      else {
                          $stat = "$(@(& ps -o stat= -p $id 2>$null) -join '')".Trim()
                          $survivor = if ($stat -and $stat -notmatch '^Z') { "$(@(& ps -o comm= -p $id 2>$null) -join '') [$stat]" } else { '' }
                      }

                      if ($survivor) {
                          Write-Host "::warning::${p}: pid $id ($survivor) SURVIVED the timeout kill"
                      }
                  }

                  $code = 'TIMEOUT'
              }
              else {
                  $code = $proc.ExitCode
              }

              $err = @(Get-Content -LiteralPath $errFile -ErrorAction SilentlyContinue)
              $out = @(Get-Content -LiteralPath $outFile -ErrorAction SilentlyContinue)

              Write-Host "==> ${p}: exit $code; stderr $($err.Count) lines; stdout $($out.Count) lines"
              # A SIGNAL death writes NOTHING to stderr -- the process is gone before any managed
              # writer runs -- so the exit code is all this stage could quote (SignalPrimitives on
              # osx-arm64 at train 24: exit 138, stderr 0 lines, stdout 2 lines). macOS records the
              # rest: ReportCrash writes a .ips naming the exception type, the signal, the faulting
              # address and every thread`s backtrace. Nothing in this repository collected them, so a
              # mute darwin death could only be read as ARITHMETIC (138 = 128 + 10 = SIGBUS) rather
              # than as evidence -- which is exactly what Q41 asks for.
              #
              # Scope: this diagnostic stage alone. behavioral-full runs hundreds of projects and is
              # a census, not a reading; a mute row found there is brought HERE by name.
              #
              # Best-effort and never fatal, deliberately: a stage whose own diagnostics can fail the
              # run is worse than one that reports less. And the NULL is REPORTED -- whether GitHub`s
              # macOS images run ReportCrash at all is not something this repository has ever
              # measured, so "no report" is a finding about the runner, not a silent empty artifact.
              $signalish = ($code -eq 'TIMEOUT') -or (($code -is [int]) -and (($code -gt 128) -or (($code -ne 0) -and ($err.Count -eq 0))))

              if ($IsMacOS -and $signalish) {
                  $reportDir = Join-Path $HOME 'Library/Logs/DiagnosticReports'
                  $ips = @()

                  # ReportCrash runs AFTER the process dies, so poll rather than assume it has
                  # finished; ~20 s is the whole budget and it is only spent on a death.
                  foreach ($attempt in 1..10) {
                      $ips = @(Get-ChildItem -LiteralPath $reportDir -Filter '*.ips' -ErrorAction SilentlyContinue |
                          Where-Object { $_.LastWriteTime -ge $launched })
                      if ($ips.Count -gt 0) { break }
                      Start-Sleep -Seconds 2
                  }

                  # Prefer a report whose name carries this project`s process name; fall back to any
                  # fresh one and SAY which arm answered, so the reading is never ambiguous.
                  $named = @($ips | Where-Object { $_.Name -like "$p*" })
                  $picked = if ($named.Count -gt 0) { $named } else { $ips }
                  $arm = if ($named.Count -gt 0) { 'name-matched' } else { 'fresh-but-unnamed' }

                  if ($picked.Count -eq 0) {
                      Write-Host "==> ${p}: exit $code looks like a signal death and NO crash report was written to $reportDir within 20s -- either this runner image does not run ReportCrash, or the death did not produce one"
                  }
                  else {
                      Write-Host "==> ${p}: $($picked.Count) crash report(s) collected ($arm)"

                      foreach ($rep in $picked) {
                          $dest = Join-Path $art "crash-$p-$goos-$rid-$($rep.Name)"
                          Copy-Item -LiteralPath $rep.FullName -Destination $dest -ErrorAction SilentlyContinue

                          # The .ips body is JSON on one line; quote the fields that name the death
                          # rather than parsing a format this repository has never read before.
                          $raw = Get-Content -LiteralPath $rep.FullName -Raw -ErrorAction SilentlyContinue
                          $facts = @()

                          foreach ($pat in @('"exception":\{[^}]*\}', '"termination":\{[^}]*\}', '"faultingThread":[0-9]+', '"signal":"[^"]*"', '"type":"[^"]*"', '"subtype":"[^"]*"')) {
                              foreach ($m in [regex]::Matches($raw, $pat)) {
                                  if ($facts -notcontains $m.Value) { $facts += $m.Value }
                              }
                          }

                          # The FRAMES are what PLACE a death; the fields above only name it (Q41 at train 26:
                          # SIGBUS / EXC_BAD_ACCESS / KERN_PROTECTION_FAILURE at 0x4200000000, and the artifact
                          # unreadable from a proxied lane). A .ips is a one-line JSON header followed by the
                          # report body (pretty JSON on macOS 13+): parse the body, print the faulting thread's
                          # frames against usedImages, and its register state -- pc/lr/sp, and on arm64 far/esr,
                          # which say whether the fault was an instruction fetch AT the address or a data access
                          # to it. Best-effort like the rest: a body that does not parse prints its raw head.
                          # -AsHashtable is load-bearing, not style: a real report carries BOTH `vmRegionInfo`
                          # and `vmregioninfo`, and pwsh's case-insensitive object reader refuses keys that
                          # differ only by case -- the first collection (run 33946376666) fell back for exactly
                          # that reason. Hashtables are case-sensitive and keep both.
                          $frameLines = @()
                          try {
                              $bodyText = ($raw -split "`n", 2)[1]
                              $body = $bodyText | ConvertFrom-Json -Depth 64 -AsHashtable
                              $ft = [int]$body['faultingThread']
                              $thread = $body['threads'][$ft]
                              $images = @($body['usedImages'])
                              $frameLines += "faulting thread $ft" + $(if ($thread['name']) { " ($($thread['name']))" } elseif ($thread['queue']) { " ($($thread['queue']))" } else { '' })
                              $i = 0
                              foreach ($f in @($thread['frames'] | Select-Object -First 40)) {
                                  $img = if ($null -ne $f['imageIndex'] -and $f['imageIndex'] -lt $images.Count) { $images[$f['imageIndex']]['name'] } else { '?' }
                                  $sym = if ($f['symbol']) { " $($f['symbol'])+$($f['symbolLocation'])" } else { '' }
                                  $frameLines += ('#{0,-3} {1} + 0x{2:x}{3}' -f $i, $img, [int64]$f['imageOffset'], $sym)
                                  $i++
                              }
                              $ts = $thread['threadState']
                              if ($ts) {
                                  $regs = @()
                                  foreach ($r in 'pc','lr','sp','far','esr') { if ($ts[$r]) { $regs += ('{0}=0x{1:x}' -f $r, [int64]$ts[$r]['value']) } }
                                  if ($ts['esr'] -and $ts['esr']['description']) { $regs += "esr:'$($ts['esr']['description'])'" }
                                  if ($regs.Count -gt 0) { $frameLines += ('threadState ' + ($regs -join ' ')) }
                              }
                          }
                          catch {
                              $frameLines += "frames: the report body did not parse ($($_.Exception.Message)); raw head follows"
                              $frameLines += @(($raw -split "`n") | Select-Object -First 60)
                          }

                          $lines = @("## crash $p -- GOOS=$goos ($rid) -- exit $code -- $($rep.Name) ($arm)", '', '```') +
                              @($facts | Select-Object -First 40) + $frameLines + @('```')

                          if ($facts.Count -eq 0) {
                              $lines = @("## crash $p -- GOOS=$goos ($rid) -- exit $code -- $($rep.Name) ($arm)", '',
                                  'The report was collected but none of the expected fields matched; the frames follow if the body parsed.', '```') + $frameLines + @('```')
                          }

                          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $lines
                          & ./.github/annotate-summary.ps1 -Title "crash $p $goos/$rid" -Lines $lines
                      }
                  }
              }


              # A stdout MISMATCH is the Output phase's other verdict, and the runner's log carries no
              # text for it. Run Go's own program the way that phase does (`go run .`, cwd = the
              # project, the pinned toolchain) and, when the row exits 0 with a differing stdout,
              # annotate the DIFF -- `<=` lines are the C# side, `=>` lines are Go's -- so the reading
              # is one job-log read (ReflectArrayOf on darwin, 2026-09-03: the only signal was the
              # word "mismatch").
              if ($code -eq 0) {
                  Push-Location $proj
                  $goOut = @(& go run . 2>$null)
                  Pop-Location
                  Set-Content -LiteralPath (Join-Path $art "stderr-$p-$goos-$rid.go-stdout.txt") -Value $goOut

                  if (($out -join "`n") -ne ($goOut -join "`n")) {
                      $diff = @(Compare-Object -ReferenceObject @($out + '') -DifferenceObject @($goOut + '') -SyncWindow 0 |
                          ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" })
                      $dl = @(
                          "## stdout diff $p -- GOOS=$goos ($rid) -- C# (<=) vs go run (=>): $($out.Count) vs $($goOut.Count) lines"
                          ''
                          '```'
                      ) + @($diff | Select-Object -First 120) + @('```')

                      Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $dl
                      & ./.github/annotate-summary.ps1 -Title "stdout diff $p $goos/$rid" -Lines $dl
                  }
              }

              $lines = @(
                  "## stderr $p -- GOOS=$goos ($rid) -- exit $code"
                  ''
                  '```'
              ) + $err + @('```')

              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $lines
              & ./.github/annotate-summary.ps1 -Title "stderr $p $goos/$rid" -Lines $lines
          }

          exit $exit

      # -------------------------------------------------------------------------------------
      # sweep-shard — a filtered validated sweep against `go test -json` on this platform.
      # -------------------------------------------------------------------------------------
      - name: Sweep shard — filtered validated sweep
        if: needs.plan.outputs.stage == 'sweep-shard'
        shell: pwsh
        env:
          SWEEP_FILTER: ${{ needs.plan.outputs.filter }}
          # Raises the sweep's 10m default for a 4-core hosted runner. The script's per-package
          # $longTimeouts entries are FLOORS, not overrides: a larger -TestTimeout raises them, a
          # smaller one still loses, so this value cannot under-budget the four long rows.
          SWEEP_TEST_TIMEOUT: '45m'
        run: |
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null

          # container/heap is the fleet's calibration row (LANES.md's provisioning baseline): small,
          # pure-compute, and already banked -- the right default for "does a sweep run here at all".
          $filter = $env:SWEEP_FILTER

          if ([string]::IsNullOrWhiteSpace($filter)) { $filter = 'container/heap' }

          # The filter is a comma-separated list of EXACT roster package names, each swept with
          # -Exact. The sweep's own -Filter is a substring, so "sort" alone swept internal/fmtsort
          # too and "path" swept path/filepath; and the concurrency group above holds one pending
          # run, so a row-by-row campaign could not be dispatched as separate runs either (the
          # darwin row pilot, 2026-10-03, had to group rows by shared prefix). Every name is
          # checked against the roster BEFORE anything builds: a typo refuses the run by name
          # instead of sweeping nothing.
          $names = [System.Collections.Generic.List[string]]::new()

          foreach ($part in ($filter -split ',')) {
              $name = $part.Trim()

              if ($name -and -not $names.Contains($name)) { $names.Add($name) }
          }

          . ./src/_roster.ps1
          $banked = @(Get-ValidatedRosterRows -Path ./docs/ValidatedTestPackages.md | ForEach-Object { $_.Package })
          $unknown = @($names | Where-Object { $banked -notcontains $_ })

          if ($unknown.Count -gt 0) {
              throw "sweep-shard: not a banked roster package (names are exact, not substrings): $($unknown -join ', ')"
          }

          Write-Host "==> sweep shard: $($names.Count) row(s) by exact name -- $($names -join ', ') -- GoTargetOS=$($env:GoTargetOS), timeout $($env:SWEEP_TEST_TIMEOUT)"

          # The sweep builds the converter itself and refuses a toolchain whose release differs
          # from version.props' pin -- which is exactly the version setup-go installed above. It
          # builds once: every later name reuses that converter (-SkipBuild). The step's exit is
          # the first non-zero row exit, so one failing row still reds the leg.
          $log = Join-Path $art "sweep-$goos-$rid.log"
          $sweepExit = 0
          $skipBuild = $false

          foreach ($name in $names) {
              & ./src/run-validated-sweep.ps1 -Filter $name -Exact -SkipBuild:$skipBuild -TestTimeout $env:SWEEP_TEST_TIMEOUT -IgnoreDiskPreflight *>&1 |
                  Tee-Object -FilePath $log -Append

              $rowExit = $LASTEXITCODE

              if ($rowExit -ne 0 -and $sweepExit -eq 0) { $sweepExit = $rowExit }

              $skipBuild = $true
          }

          # ---- per-row evidence ---------------------------------------------------------------
          # The pipeline writes each swept package's comparison record beside its converted code.
          # Those are the rows: verdict-for-verdict maps of `go test -json` against the C# host.
          $rowsRoot = Join-Path $art 'rows'
          $rowFiles = @('go2cs_test_comparison.json', 'results.json', 'results.xml')
          $evidence = @(Get-ChildItem -Path 'src/core' -Recurse -File -Include $rowFiles -ErrorAction SilentlyContinue)

          foreach ($file in $evidence) {
              $relative = $file.FullName.Substring($PWD.Path.Length).TrimStart('\', '/').Replace('\', '/')
              $destination = Join-Path $rowsRoot $relative

              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
              Copy-Item -LiteralPath $file.FullName -Destination $destination -Force
          }

          Write-Host "==> collected $($evidence.Count) per-row evidence file(s)"

          # A sweep regenerates committed test artifacts in place, so the tree is dirty afterwards
          # and it is (almost always) nothing -- CRLF phantoms and the -tests-closure class. The
          # sweep itself classifies them; this records the raw state alongside for the reader.
          & git -C $PWD status --porcelain -- src/core |
              Set-Content -LiteralPath (Join-Path $art "sweep-$goos-$rid-git-status.txt") -Encoding utf8

          # The CONTENT of those rewrites, not just their names: a non-windows leg's -tests emission
          # differs from the committed (windows) record, and the runner's tree is gone when the job
          # ends. The diff lets a lane read per-GOOS emission drift without a runner of that OS
          # (COORD ruling 2026-10-02, after the first darwin row drifted 15+1 lines unread).
          # WriteAllLines always creates the file, so a clean tree uploads an empty diff rather than none.
          $trackedDiff = Join-Path $art "sweep-$goos-$rid-tracked.diff"
          $diffLines = [string[]]@(& git -C $PWD -c core.quotePath=false diff --no-ext-diff --no-color -- src/core)
          [System.IO.File]::WriteAllLines($trackedDiff, $diffLines)
          Write-Host "==> tracked-rewrite diff: $((Get-Item -LiteralPath $trackedDiff).Length) bytes -> $(Split-Path -Leaf $trackedDiff)"

          $summary = @(
              "## Validated sweep shard -- GOOS=$goos ($rid)"
              ''
              "Rows (exact) ``$($names -join ', ')`` -- -TestTimeout ``$($env:SWEEP_TEST_TIMEOUT)`` -- exit ``$sweepExit``"
              ''
              'A non-Windows leg reports rows with no per-OS annotation as'
              '**comparison-validated-at-count** and exits non-zero by design: validated, but with'
              'nothing banked for this OS to bank against. That is a reading, not a regression.'
              ''
              'Tail of the run:'
              ''
              '```'
          ) + @(Get-Content -LiteralPath $log -Tail 60 -ErrorAction SilentlyContinue) + @('```')

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          Set-Content -LiteralPath (Join-Path $art "sweep-$goos-$rid-summary.md") -Value $summary -Encoding utf8

          # The summary is ALSO emitted as annotations. Both places a leg's evidence normally
          # lands -- the job summary and the uploaded artifact -- are served from Azure blob
          # storage, so a host whose egress allows api.github.com but denies that domain can read
          # every step's CONCLUSION and none of its content. Annotations come back from the
          # check-runs REST API itself, which keeps this leg readable from such a host (and puts
          # the headline on the run page besides). Nothing above is replaced.
          & ./.github/annotate-summary.ps1 -Title "sweep $goos/$rid" -Lines $summary

          exit $sweepExit

      # -------------------------------------------------------------------------------------
      # release-smoke — consume the pack job's feed the way a user does, on this leg's host.
      # -------------------------------------------------------------------------------------
      - name: Release smoke — download the feed
        if: needs.plan.outputs.stage == 'release-smoke' && needs.plan.outputs.published-version == ''
        uses: actions/download-artifact@v5
        with:
          name: release-smoke-feed
          path: feed

      - name: Release smoke — rid compile asset, sample, behavioral, walkthrough (measured)
        if: needs.plan.outputs.stage == 'release-smoke'
        shell: pwsh
        env:
          PUBLISHED_VERSION: ${{ needs.plan.outputs.published-version }}
        run: |
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null

          # The consumer projects are NOT corpus projects; the leg-wide GoTargetOS binding must not
          # reach their builds as a global property.
          Remove-Item Env:GoTargetOS -ErrorAction SilentlyContinue

          # The converter, built from this tree (the tree the feed was packed from).
          $exeName = if ($IsWindows) { 'go2cs.exe' } else { 'go2cs' }
          Push-Location 'src/go2cs'
          try { & go build -o "bin/$exeName" . ; $goExit = $LASTEXITCODE } finally { Pop-Location }
          if ($goExit -ne 0) { Write-Host "::error::converter go build failed with exit $goExit"; exit $goExit }

          $work = Join-Path $art "release-smoke-$goos-$rid"
          $log = Join-Path $art "release-smoke-$goos-$rid.log"
          # The README walkthrough GATES on every leg. darwin joined windows and linux once darwin-xsys-libc
          # (TRAIN O) made x/sys/unix reach libc on a Mac: release-smoke 37155599211 ran it byte-identical to
          # `go run` on both chips. A tree without that seat fails darwin's D, by design.
          $gateWalkthrough = $true
          # Pre-publish: this tree's pack. Post-publish (published_version): the version nuget.org serves.
          $published = $env:PUBLISHED_VERSION
          $feedArgs = if ($published) { @{ Feed = 'https://api.nuget.org/v3/index.json'; Version = $published } } else { @{ Feed = (Join-Path $PWD 'feed') } }
          & ./src/tests/PackageTests/release-smoke.ps1 @feedArgs -Converter (Join-Path $PWD "src/go2cs/bin/$exeName") -WorkRoot $work -GateWalkthrough:$gateWalkthrough *>&1 |
              Tee-Object -FilePath $log
          $smokeExit = $LASTEXITCODE

          $summary = @(
              "## Release smoke -- GOOS=$goos ($rid)"
              ''
              "exit ``$smokeExit`` (A, B and C gate; D $(if ($gateWalkthrough) { 'gates here' } else { 'is measured only here' }))"
              ''
              '```'
          ) + @(Get-Content -LiteralPath $log | Where-Object { $_ -match '^(release smoke:|PASS|FAIL|MEASURED)' }) + @('```')
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          & ./.github/annotate-summary.ps1 -Title "release-smoke $goos/$rid" -Lines $summary

          # The per-arm caches are large and say nothing the logs do not.
          Get-ChildItem $work -Recurse -Directory -Filter 'nuget-cache' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $work -Recurse -Directory -Filter '.artifacts' -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          exit $smokeExit

      # -------------------------------------------------------------------------------------
      # Artifacts — always, because a failed leg is the reading this workflow exists to produce.
      # -------------------------------------------------------------------------------------
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: os-matrix-${{ needs.plan.outputs.stage }}-${{ matrix.goos }}-${{ matrix.rid }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
