# On-demand OS matrix — the fleet's missing platforms, and a native-Linux control.
#
# This workflow is NEVER a merge gate. The repository's authoritative instruments
# (check-no-regression.ps1, run-behavioral.ps1, run-validated-sweep.ps1) run on the fleet's own
# machines against measured budgets; this is a supplement that reaches hardware the fleet does not
# own — both macOS legs above all — and a native-Linux control for readings the WSL lane produced.
# It is never triggered by code: no push trigger and no pull_request trigger. It runs on
# workflow_dispatch, and on ONE daily schedule that runs the darwin census and nothing else.
#
# Why darwin has a schedule and the other flavors do not: windows and linux are each compiled by
# standing gates on the fleet's own machines, so a mechanical break in either surfaces the day it
# lands. NOTHING compiles the darwin flavor. On 2026-09-02 a one-line CS0266 -- `var` inferring
# `StandardBox<T>` where the base `ж<T>` was needed, left by the box-kind split's 754-site emitter
# flip (36b7e9d96) -- was found SEVEN DAYS after it landed, by the first darwin dispatch since. The
# alternative to a schedule is not "no cost", it is "however long until someone looks". A census is
# 10-17 runner minutes; seven days of a silently red platform is the price it replaces.
#
# The scheduled run is still NOT A MERGE GATE. It is a regression guard whose conclusion is read on
# the morning board: a red scheduled census is a regression attributable to the day's trains.
#
# Guide: docs/CIMatrix.md. Corpus mechanics, GoTargetOS flavors and the measured budget rows the
# timeouts below are scaled from: CLAUDE.md.

name: OS matrix (on demand)

on:
  # A scheduled event carries NO inputs -- `inputs.*` is empty for every one of them -- so the plan
  # job below resolves the effective goos/stage/filter/dotnet once and every consumer reads its
  # outputs rather than `inputs.*`. That is what keeps workflow_dispatch behaviour byte-identical
  # while giving the schedule somewhere to get its values from.
  #
  # 04:41 UTC: a quiet hour, and deliberately not on the hour -- every repository that asks for
  # "daily" gets `0 4`, and GitHub delays a congested cron rather than dropping it.
  schedule:
    - cron: '41 4 * * *'

  workflow_dispatch:
    inputs:
      goos:
        description: 'Corpus flavor to measure (darwin fans out to BOTH mac runners)'
        type: choice
        required: true
        default: linux
        options:
          - windows
          - linux
          - darwin
      stage:
        description: 'What to run: census (compile the corpus flavor), behavioral-smoke (harness proof), behavioral-full (the whole enumeration in slices), sweep-shard (filtered validated sweep), behavioral-stderr (run named projects directly and keep their WHOLE stderr — the runner quotes one line per death), release-smoke (pack every go.* package on windows, then consume that ONE feed on all four shipped RIDs; goos is ignored), aot-smoke (the same pack, then ONE Native AOT publish and run of a hand-written package consumer on all four RIDs; long -- each publish compiles the whole go.* closure), nugetgo-behavior (one sample row per shipped RID for a nugetgo package, each run on its own OS: the sample program run with go, and converted against the package and run with dotnet. A module with no Go tests ships the rows as its proof; a module with Go tests, beside its test proof. goos is ignored), golib-tests (build and run src/tests/GolibTests for this GOOS on each of its runners; filter is an MSTest --filter expression, blank runs the whole suite, and may end ;jit=PATTERN), stack-probe (OPT-IN diagnostic: filter is ROW;test=REGEX[;at=S,S] -- one row swept with -TestFilter REGEX while dotnet-stack dumps its converted test host at the at= offsets; proves the instrument on a deliberately hung program first; never banks), converter-cgo (OPT-IN: go test of the converter in src/go2cs on each runner of this GOOS, where a C compiler lets go list run cmd/cgo; filter is a go test -run regex, blank runs ^Test.*Cgo|^TestRealLoad, and may end ;cc=zig|llvm-mingw[;sha=HEX], a pinned C toolchain the leg downloads, refuses unless its sha256 matches, and hands go as CC; the summary names the C compiler go would use. No other hosted stage gives the converter tests one: until this stage, TestRealLoadRefusesOnlyASelectedCgoFile had never run on a hosted runner, and cgo Phase 1 has its exit gate here)'
        type: choice
        required: true
        default: census
        options:
          - census
          - behavioral-smoke
          - behavioral-full
          - behavioral-stderr
          - sweep-shard
          - release-smoke
          - aot-smoke
          - nugetgo-behavior
          - golib-tests
          - stack-probe
          - converter-cgo
      filter:
        description: 'Shard filter — comma-separated EXACT roster package names for sweep-shard ("sort" sweeps sort and never internal/fmtsort), project substring for behavioral-smoke. IGNORED by behavioral-full, which runs the whole enumeration in slices. Blank takes the stage default. Comma-separated project NAMES for behavioral-stderr. golib-tests and stack-probe take options after the filter as ;key=value pairs (no ; inside a value): golib-tests ;jit=PATTERN (a DOTNET_JitDisasm pattern, e.g. p256Mul p384Mul; with tiering off, each matching method''s JIT listing is printed to the job log), stack-probe ROW;test=REGEX (required: the -TestFilter regex, both sides of the compare);at=S,S (seconds after the test host starts at which dotnet-stack dumps it; blank takes 120,870, the per-test deadline being 900 s). Options on any other stage are refused.'
        type: string
        required: false
        default: ''
      dotnet:
        description: 'SDK channel for setup-dotnet. 10.0.x is the corpus TFM''s own runtime and the only channel master builds with; a 1.23.1.x anchor ships from its own tag''s workflow, which pins its SDK.'
        type: choice
        required: false
        default: 10.0.x
        options:
          - 10.0.x
          - 10.0.402
      published_version:
        description: 'release-smoke only: a go.* version ALREADY on nuget.org (e.g. 1.24.13.4). Blank packs this tree and consumes that pack (the pre-publish gate). Set, it skips the pack and every leg restores that version from nuget.org: the post-publish smoke.'
        type: string
        required: false
        default: ''
      run_timeout:
        description: 'Per-program RUN budget in seconds for the behavioral stages (GO2CS_RUN_TIMEOUT), 1-1800. Blank takes 120, the budget every stage used before this input existed. Raise it to tell a slow program on the 3-core macos-15 runner from a real hang: a NOT MEASURED (timeout) row says only that the budget expired. A large value on behavioral-full can exceed that stage''s job budget.'
        type: string
        required: false
        default: ''
      nugetgo_module:
        description: 'nugetgo-behavior only: the module and its version, MODULE@VERSION (e.g. github.com/inconshreveable/mousetrap@v1.1.0). Its sample program and mappings row are read from src/tests/ModuleBehavior/MODULE@VERSION/ at the dispatched ref.'
        type: string
        required: false
        default: ''
      nugetgo_package:
        description: 'nugetgo-behavior only: the package version every row runs: the rehearsal package, whose assemblies are the release''s (e.g. 1.1.0-int.1). The package ID is the mappings row''s.'
        type: string
        required: false
        default: ''
      nugetgo_feed:
        description: 'nugetgo-behavior only: the feed that serves the package. A NuGet v3 feed URL ending in /index.json, or git:REF:FOLDER, a folder of nupkgs in this repository at a branch or commit (e.g. git:claude/kit:nupkg/int.1), which every leg uses as a local folder feed at the ONE commit the plan resolves. Blank takes int.nugettest.org (https://apiint.nugettest.org/v3/index.json), where the runbook rehearses.'
        type: string
        required: false
        default: ''
      nugetgo_feed_sha256:
        description: 'nugetgo-behavior with a git: feed only, and required there: the SHA-256 of the package''s nupkg in that folder. Each leg refuses a nupkg whose hash differs before anything reads it.'
        type: string
        required: false
        default: ''
      aot_bound_minutes:
        description: 'aot-smoke only: the AOT step''s own limit in minutes, 1-340. Blank takes 330 (5 h 30 m, under the 6-hour job ceiling). On osx-x64 an expired bound reads NOT MEASURED (timeout) and the leg ends green and readable; on linux-x64 and win-x64 it fails the leg. A small value is how the bound is made to fail on purpose.'
        type: string
        required: false
        default: ''
      arch:
        description: 'goos linux only: which linux legs run. x64 (the default) is the ubuntu-latest leg every linux dispatch ran before this input existed; arm64 runs the ubuntu-24.04-arm leg (rid linux-arm64) instead; both runs the two. Until the linux/arm64 flavour exists (no linux-arm64/ folder under src/core), the arm leg runs census and golib-tests only, against the linux/amd64 flavour, as a CALIBRATION reading that banks nothing (runner walls, and that flavour on the arm64 ABI); every other stage refuses it.'
        type: choice
        options:
          - x64
          - arm64
          - both
        default: x64

permissions:
  contents: read

# Different flavors and different stages may run at once; two dispatches of the SAME pair queue
# rather than cancel, because a half-measured census is worth nothing and a killed sweep leaves
# regenerated artifacts behind.
concurrency:
  # github.event.inputs rather than the inputs context: this expression is evaluated before the
  # workflow's own contexts are in play, and the github context is the spelling guaranteed there.
  # A scheduled run has no `github.event.inputs`, so both halves fall back to the schedule's own
  # pair; without the fallback every scheduled run would share one empty group with any other
  # input-less event.
  group: os-matrix-${{ github.ref }}-${{ github.event.inputs.goos || 'darwin' }}-${{ github.event.inputs.stage || 'census' }}
  cancel-in-progress: false

env:
  # Back-to-back MSBuild invocations must not leave lock-holding worker nodes behind (CLAUDE.md's
  # MSB4166 / MSB3027 notes). Never `dotnet build-server shutdown` — machine-global, even here.
  MSBUILDDISABLENODEREUSE: '1'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  # ---------------------------------------------------------------------------------------------
  # plan — derive everything that must not be hardcoded, and fan darwin out to two runners.
  # ---------------------------------------------------------------------------------------------
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.derive.outputs.matrix }}
      go-version: ${{ steps.derive.outputs.go-version }}
      # The EFFECTIVE dispatch parameters. Every consumer downstream reads these rather than
      # `inputs.*`, because `inputs.*` is empty on a schedule event.
      goos: ${{ steps.derive.outputs.goos }}
      stage: ${{ steps.derive.outputs.stage }}
      filter: ${{ steps.derive.outputs.filter }}
      dotnet: ${{ steps.derive.outputs.dotnet }}
      run-timeout: ${{ steps.derive.outputs.run-timeout }}
      aot-bound-minutes: ${{ steps.derive.outputs.aot-bound-minutes }}
      published-version: ${{ steps.derive.outputs.published-version }}
      nugetgo-module: ${{ steps.derive.outputs.nugetgo-module }}
      nugetgo-version: ${{ steps.derive.outputs.nugetgo-version }}
      nugetgo-package: ${{ steps.derive.outputs.nugetgo-package }}
      nugetgo-feed: ${{ steps.derive.outputs.nugetgo-feed }}
      nugetgo-feed-sha256: ${{ steps.derive.outputs.nugetgo-feed-sha256 }}
      probe-test: ${{ steps.derive.outputs.probe-test }}
      dns-servers: ${{ steps.derive.outputs.dns-servers }}
      dump-proof: ${{ steps.derive.outputs.dump-proof }}
      probe-at: ${{ steps.derive.outputs.probe-at }}
      jit-disasm: ${{ steps.derive.outputs.jit-disasm }}
      cgo-cc: ${{ steps.derive.outputs.cgo-cc }}
      cgo-cc-sha: ${{ steps.derive.outputs.cgo-cc-sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Derive toolchain pin and target matrix
        id: derive
        shell: pwsh
        env:
          INPUT_GOOS: ${{ inputs.goos }}
          INPUT_STAGE: ${{ inputs.stage }}
          INPUT_FILTER: ${{ inputs.filter }}
          INPUT_DOTNET: ${{ inputs.dotnet }}
          INPUT_RUN_TIMEOUT: ${{ inputs.run_timeout }}
          INPUT_AOT_BOUND_MINUTES: ${{ inputs.aot_bound_minutes }}
          INPUT_PUBLISHED_VERSION: ${{ inputs.published_version }}
          INPUT_NUGETGO_MODULE: ${{ inputs.nugetgo_module }}
          INPUT_NUGETGO_PACKAGE: ${{ inputs.nugetgo_package }}
          INPUT_NUGETGO_FEED: ${{ inputs.nugetgo_feed }}
          INPUT_NUGETGO_FEED_SHA256: ${{ inputs.nugetgo_feed_sha256 }}
          INPUT_ARCH: ${{ inputs.arch }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          $ErrorActionPreference = 'Stop'

          # ---- effective parameters --------------------------------------------------------
          # A `schedule` event carries no inputs at all, so it gets the scheduled guard's fixed
          # pair. Resolving it HERE, once, is what lets the rest of the workflow stay written
          # against a single source; a dispatch is unchanged because its inputs are always present.
          if ($env:EVENT_NAME -eq 'schedule') {
              $goos = 'darwin'; $stage = 'census'; $filter = ''; $dotnet = '10.0.x'
              Write-Host "scheduled regression guard: goos=$goos stage=$stage (inputs are empty on a schedule event)"
          }
          else {
              $goos = $env:INPUT_GOOS; $stage = $env:INPUT_STAGE
              $filter = $env:INPUT_FILTER; $dotnet = $env:INPUT_DOTNET
          }

          # Defaulting rather than trusting: a `workflow_dispatch` through the REST API may omit an
          # input that the form would have filled, and an empty $stage would otherwise reach the
          # budget lookup below and throw "Unknown stage ''" instead of doing the obvious thing.
          if (-not $goos)   { $goos = 'linux' }
          if (-not $stage)  { $stage = 'census' }
          if (-not $dotnet) { $dotnet = '10.0.x' }
          if ($null -eq $filter) { $filter = '' }

          # The diagnostic stages' options ride in `filter`, after the stage's own filter, as ;key=value pairs: the
          # dispatch form's input count is guarded (Test-NugetgoBehaviorProof.ps1), and these are options OF those two
          # stages. golib-tests: jit=PATTERN. stack-probe: test=REGEX (required), at=S,S. sweep-shard (darwin only):
          # dns=IP[,IP], the job's resolver (an opt-in for net's NXDOMAIN keys, which the hosted mac resolver answers late;
          # C1, 2026-11-08); sweep-shard (linux only): dumpproof=red, the dump-suppression proof's red arm, which runs the
          # proof's crash probe with suppression OFF so the proof fails by name and the sweep never starts (S7-b), or
          # dumpproof=red-space, the same arm with the file count not enforced, so the free-space check fails alone. converter-cgo: cc=zig|llvm-mingw, a pinned C toolchain the leg downloads, hash-checks and hands
          # go as CC (the cgo toolchain scout, H, 2026-11-10); sha=HEX replaces the pin's sha256, and exists so a wrong
          # hash can be shown to refuse before anything runs. An unknown or repeated key, an empty value, or any option on
          # any other stage FAILS the plan by name rather than being ignored.
          $probeTest = ''; $probeAt = ''; $jitDisasm = ''; $dnsServers = ''; $cgoCc = ''; $cgoCcSha = ''; $dumpProof = ''
          $optionKeys = @(switch ($stage) { 'golib-tests' { 'jit' } 'stack-probe' { 'test', 'at' } 'sweep-shard' { 'dns', 'dumpproof' } 'converter-cgo' { 'cc', 'sha' } })
          if ($optionKeys.Count) {
              $parts = @($filter -split ';')
              $filter = $parts[0].Trim()
              $seen = @{}
              foreach ($option in @($parts | Select-Object -Skip 1)) {
                  if ($option -notmatch '^\s*(?<key>[a-z]+)\s*=(?<value>.*)$') { throw "filter: '$option' is not a key=value option (stage $stage takes $($optionKeys -join ', '))." }
                  $key = $Matches['key']; $value = $Matches['value'].Trim()
                  if ($key -notin $optionKeys) { throw "filter: stage $stage takes options $($optionKeys -join ', '); got '$key'." }
                  if ($seen.ContainsKey($key)) { throw "filter: option '$key' is given twice." }
                  if (-not $value) { throw "filter: option '$key' has no value." }
                  $seen[$key] = $value
              }
              $jitDisasm = "$($seen['jit'])"
              if ($stage -eq 'stack-probe') {
                  if (-not $filter -or $filter.Contains(',')) { throw "stack-probe takes exactly ONE roster row before its options in filter; got '$filter'." }
                  $probeTest = "$($seen['test'])"
                  if (-not $probeTest) { throw 'stack-probe needs filter option test=REGEX, the -TestFilter regex (e.g. runtime/pprof;test=^TestGoroutineSwitch$).' }
                  $probeAt = if ($seen.ContainsKey('at')) { $seen['at'] -replace '\s', '' } else { '120,870' }
                  if ($probeAt -notmatch '^[0-9]+(,[0-9]+)*$') { throw "stack-probe filter option at= must be comma-separated whole seconds; got '$probeAt'." }
                  Write-Host "stack-probe: row $filter, -TestFilter $probeTest, dumps at $probeAt s"
              }
              if ($jitDisasm) { Write-Host "golib-tests: JIT listing for '$jitDisasm' (tiering off)" }
              if ($seen.ContainsKey('dns')) {
                  if ($goos -ne 'darwin') { throw "sweep-shard filter option dns= sets a mac runner's resolver and applies to goos darwin only; got goos '$goos'." }
                  $dnsServers = $seen['dns'] -replace '\s', ''
                  if ($dnsServers -notmatch '^\d{1,3}(\.\d{1,3}){3}(,\d{1,3}(\.\d{1,3}){3})*$') { throw "sweep-shard filter option dns= must be a comma-separated IPv4 list; got '$dnsServers'." }
                  Write-Host "sweep-shard: the job's resolver is set to $dnsServers before the sweep (opt-in; the effective resolver is logged)"
              }
              if ($seen.ContainsKey('dumpproof')) {
                  if ($goos -ne 'linux') { throw "sweep-shard filter option dumpproof= is the linux dump-suppression proof's red arm and applies to goos linux only; got goos '$goos'." }
                  $dumpProof = $seen['dumpproof']
                  if ($dumpProof -cnotin 'red', 'red-space') { throw "sweep-shard filter option dumpproof= takes red or red-space; got '$dumpProof'." }
                  Write-Host "sweep-shard: dumpproof=$dumpProof -- the proof runs its crash probe with suppression OFF and must FAIL by name; the sweep does not run"
              }
              if ($stage -eq 'converter-cgo') {
                  $cgoCc = "$($seen['cc'])"; $cgoCcSha = "$($seen['sha'])".ToLowerInvariant()
                  if ($cgoCc -and $cgoCc -notin @('zig', 'llvm-mingw')) { throw "converter-cgo filter option cc= names a pinned toolchain, zig or llvm-mingw; got '$cgoCc'." }
                  if ($cgoCcSha -and -not $cgoCc) { throw 'converter-cgo filter option sha= replaces a pinned toolchain''s hash, so it needs cc= beside it.' }
                  if ($cgoCcSha -and $cgoCcSha -notmatch '^[0-9a-f]{64}$') { throw "converter-cgo filter option sha= must be 64 hex digits; got '$cgoCcSha'." }
                  if ($cgoCc -eq 'llvm-mingw' -and $goos -ne 'windows') { throw "llvm-mingw's compilers target windows only, so cc=llvm-mingw applies to goos windows only; got goos '$goos'." }
                  if ($cgoCc) { Write-Host "converter-cgo: CC is the pinned $cgoCc$(if ($cgoCcSha) { ", its sha256 REPLACED by $cgoCcSha" })" }
              }
          }
          elseif ($filter -match '(^|;)\s*(jit|test|at|dns|dumpproof|cc|sha)\s*=') { throw "filter options (;key=value) apply to stages golib-tests, stack-probe, sweep-shard and converter-cgo only; got stage '$stage' and filter '$filter'." }

          # The behavioral stages' per-program run budget. A schedule has no inputs and keeps 120, as
          # does a blank dispatch. A value that is not a whole number of seconds in 1..1800 FAILS the
          # plan by name rather than reaching the runner as a string it would misread.
          $runTimeout = if ($env:EVENT_NAME -eq 'schedule') { '' } else { "$env:INPUT_RUN_TIMEOUT".Trim() }
          if (-not $runTimeout) { $runTimeout = '120' }
          if ($runTimeout -notmatch '^[0-9]+$' -or [int]$runTimeout -lt 1 -or [int]$runTimeout -gt 1800) {
              throw "run_timeout must be a whole number of seconds from 1 to 1800; got '$runTimeout'."
          }
          Write-Host "behavioral run budget: $runTimeout s per program"

          # aot-smoke's own step limit. The job ceiling is 360 min on a mac leg; the step stops at this bound so an
          # osx-x64 publish that overruns is read (NOT MEASURED) rather than cancelled with the run's conclusion.
          $aotBound = if ($env:EVENT_NAME -eq 'schedule') { '' } else { "$env:INPUT_AOT_BOUND_MINUTES".Trim() }
          if (-not $aotBound) { $aotBound = '330' }
          if ($aotBound -notmatch '^[0-9]+$' -or [int]$aotBound -lt 1 -or [int]$aotBound -gt 340) {
              throw "aot_bound_minutes must be a whole number of minutes from 1 to 340; got '$aotBound'."
          }

          # The post-publish smoke: a version nuget.org already serves. Only release-smoke reads it, and a malformed
          # value FAILS the plan by name rather than reaching a restore as a version nothing serves.
          $publishedVersion = if ($env:EVENT_NAME -eq 'schedule') { '' } else { "$env:INPUT_PUBLISHED_VERSION".Trim() }
          if ($publishedVersion) {
              if ($env:INPUT_STAGE -ne 'release-smoke') { throw "published_version applies to stage release-smoke only (aot-smoke reads this tree's pack; a published version is refused there); got stage '$($env:INPUT_STAGE)'." }
              if ($publishedVersion -notmatch '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$') { throw "published_version must be a four-part go.* version such as 1.24.13.4; got '$publishedVersion'." }
              Write-Host "release-smoke: post-publish, go.* $publishedVersion from nuget.org (no pack)"
          }

          $env:INPUT_GOOS = $goos
          $env:INPUT_STAGE = $stage

          # nugetgo-behavior: the module, the package version and the feed. Only that stage reads them, each is refused on
          # any other stage, and a malformed value FAILS the plan by name rather than reaching a leg. The sample program
          # must exist at the dispatched ref: a leg would otherwise discover its absence four times over.
          $nugetgoModule = ''; $nugetgoVersion = ''; $nugetgoPackage = ''; $nugetgoFeed = ''; $nugetgoFeedSha256 = ''
          $nugetgoGiven = if ($env:EVENT_NAME -eq 'schedule') { @() } else { @($env:INPUT_NUGETGO_MODULE, $env:INPUT_NUGETGO_PACKAGE, $env:INPUT_NUGETGO_FEED, $env:INPUT_NUGETGO_FEED_SHA256) | Where-Object { "$_".Trim() } }
          if ($stage -eq 'nugetgo-behavior') {
              $spec = "$env:INPUT_NUGETGO_MODULE".Trim()
              if ($spec -notmatch '^(?<module>[a-z0-9.-]+(/[A-Za-z0-9._~-]+)+)@(?<version>v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$') { throw "nugetgo_module must be MODULE@VERSION, such as github.com/inconshreveable/mousetrap@v1.1.0; got '$spec'." }
              $nugetgoModule = $Matches['module']; $nugetgoVersion = $Matches['version']
              if (-not (Test-Path -LiteralPath "src/tests/ModuleBehavior/$spec/main.go" -PathType Leaf)) { throw "nugetgo_module: no sample program at src/tests/ModuleBehavior/$spec/main.go on this ref." }
              $nugetgoPackage = "$env:INPUT_NUGETGO_PACKAGE".Trim()
              if ($nugetgoPackage -notmatch '^[0-9]+\.[0-9]+\.[0-9]+(\.[0-9]+)?(-[0-9A-Za-z.-]+)?$') { throw "nugetgo_package must be a NuGet package version such as 1.1.0-int.1; got '$nugetgoPackage'." }
              $nugetgoFeed = "$env:INPUT_NUGETGO_FEED".Trim()
              if (-not $nugetgoFeed) { $nugetgoFeed = 'https://apiint.nugettest.org/v3/index.json' }
              $nugetgoFeedSha256 = "$env:INPUT_NUGETGO_FEED_SHA256".Trim().ToLowerInvariant()
              # A git: feed is a folder of nupkgs in this repository (a kit ref), for a package no gallery serves. The
              # plan resolves the ref to ONE commit, so every leg reads the same bytes, and the nupkg's hash is pinned.
              if ($nugetgoFeed -match '^git:(?<ref>[^:\s]+):(?<folder>[^:\s]+)$') {
                  $feedRef = $Matches['ref']; $feedFolder = $Matches['folder'].Trim('/')
                  if ($feedFolder -match '(^|/)\.\.?(/|$)' -or $feedFolder.StartsWith('/')) { throw "nugetgo_feed: the folder must be a plain relative path in the repository; got '$feedFolder'." }
                  if ($nugetgoFeedSha256 -notmatch '^[0-9a-f]{64}$') { throw "nugetgo_feed_sha256 must be the 64-hex SHA-256 of the package's nupkg when nugetgo_feed is a git: folder; got '$nugetgoFeedSha256'." }
                  $feedCommit = if ($feedRef -match '^[0-9a-f]{40}$') { $feedRef } else {
                      $line = @(& git ls-remote origin "refs/heads/$feedRef") | Select-Object -First 1
                      if ($LASTEXITCODE -ne 0 -or -not $line) { throw "nugetgo_feed: no branch '$feedRef' on origin." }
                      ($line -split '\s+')[0]
                  }
                  $nugetgoFeed = "git:${feedCommit}:$feedFolder"
                  Write-Host "nugetgo_feed: git:${feedRef}:$feedFolder resolves to commit $feedCommit; the nupkg must hash $nugetgoFeedSha256"
              }
              elseif ($nugetgoFeed -notmatch '^https://[^\s]+/index\.json$') { throw "nugetgo_feed must be a NuGet v3 feed URL ending in /index.json, or git:REF:FOLDER; got '$nugetgoFeed'." }
              elseif ($nugetgoFeedSha256) { throw "nugetgo_feed_sha256 applies to a git: feed only; a gallery feed is not pinned here (got feed '$nugetgoFeed')." }
              Write-Host "nugetgo-behavior: $nugetgoModule $nugetgoVersion, package $nugetgoPackage from $nugetgoFeed"
          }
          elseif (@($nugetgoGiven).Count) { throw "nugetgo_module, nugetgo_package, nugetgo_feed and nugetgo_feed_sha256 apply to stage nugetgo-behavior only; got stage '$stage'." }

          # The Go release is READ FROM version.props, never written here. run-validated-sweep.ps1
          # and the converter both refuse a toolchain whose release differs from <GoStdLibVersion>
          # (NOT MEASURED, never a verdict), so a hardcoded version in CI would either duplicate
          # that pin or silently contradict it.
          $props = [System.IO.File]::ReadAllText((Join-Path $PWD 'src/version.props'))

          if ($props -notmatch '<GoStdLibVersion>\s*([^<\s]+)\s*</GoStdLibVersion>') {
              throw 'Could not read <GoStdLibVersion> from src/version.props -- the toolchain pin has no source.'
          }

          $goVersion = $Matches[1]
          Write-Host "corpus release pin: go$goVersion (from src/version.props)"

          # Runner + RID pairs. darwin is TWO legs on purpose: the corpus flavor has never been
          # built on Apple hardware at all, and arm64 vs x64 are different compilations of it.
          $targets = switch ($env:INPUT_GOOS) {
              'windows' { @(@{ goos = 'windows'; runner = 'windows-latest';  rid = 'win-x64'   }) }
              'linux'   { @(@{ goos = 'linux';   runner = 'ubuntu-latest';   rid = 'linux-x64' }) }
              'darwin'  { @(@{ goos = 'darwin';  runner = 'macos-15';        rid = 'osx-arm64' },
                            @{ goos = 'darwin';  runner = 'macos-15-intel';  rid = 'osx-x64'   }) }
              default   { throw "Unknown goos '$($env:INPUT_GOOS)'." }
          }

          # linux's ARCH legs (linux/arm64 seat S5a, DESIGN-linux-arm64-flavour.md section 6). `arch` is opt-in: x64, the
          # default, is the one ubuntu-latest leg every linux dispatch ran before the input existed, so an existing dispatch
          # (and a REST dispatch that omits the input, and a schedule) derives the same matrix as before. arm64 runs the
          # ubuntu-24.04-arm leg instead and both runs the two. The arm leg builds the corpus with GoTargetOS=linux, which is
          # the linux/AMD64 flavour until the linux/arm64 flavour exists, and that flavour makes amd64 system calls: on an
          # arm64 host its readings describe that mismatch, not the platform. So, until src/core holds a linux-arm64/ folder
          # (the flavour's own home, seat S2), the arm leg runs census and golib-tests ONLY, as a labelled calibration that
          # banks nothing, and every other stage refuses it by name. Once the folder exists (seat S5b) the arm leg is no
          # calibration: it carries arch = arm64, which the run job binds as GoTargetArch beside GoTargetOS, so it builds
          # the linux/ARM64 flavour. Without that binding every arch-split csproj defaults GoTargetArch to amd64, and the
          # leg would build the linux/amd64 flavour under the arm64 label; the run job's flavour probe refuses that.
          $arch = if ($env:EVENT_NAME -eq 'schedule' -or -not $env:INPUT_ARCH) { 'x64' } else { $env:INPUT_ARCH }
          if ($arch -notin 'x64', 'arm64', 'both') { throw "Unknown arch '$arch' (x64, arm64 or both)." }
          if ($arch -ne 'x64') {
              if ($env:INPUT_GOOS -ne 'linux') { throw "arch '$arch' applies to goos linux only; got goos '$($env:INPUT_GOOS)'." }
              if ($env:INPUT_STAGE -in 'release-smoke', 'aot-smoke', 'nugetgo-behavior') {
                  throw "arch '$arch' does not apply to $($env:INPUT_STAGE), which runs every SHIPPED RID from one pack; linux-arm64 joins it when the packages ship it (seat S5c)."
              }
              $armFlavour = @(Get-ChildItem -Path 'src/core' -Directory -Recurse -Filter 'linux-arm64' -ErrorAction SilentlyContinue).Count -gt 0
              $calibration = -not $armFlavour
              if ($calibration -and $env:INPUT_STAGE -notin 'census', 'golib-tests') {
                  throw "arch '$arch': the linux/arm64 flavour does not exist yet (no linux-arm64/ folder under src/core), so the arm leg runs census and golib-tests only, as a calibration; '$($env:INPUT_STAGE)' would read the linux/amd64 flavour on the arm64 ABI and must not be read as an arm64 result."
              }
              # Once the flavour exists, census and golib-tests are open on it, and every stage that RUNS converted programs
              # stays refused by name until the seat that lifts it lands (COORD, 2026-11-10): those programs reach the
              # linux hand-owns' runtime sites (syscall numbers, netpoll), which are DESIGN-linux-arm64-flavour.md's S3.
              # sweep-shard is lifted (S7-b, the linux/arm64 bank, docs/phase4/DATA-la64-s7-bank-plan.md): the arm leg binds
              # GoTargetArch=arm64, the flavour probe refuses any other flavour, and the dump-suppression proof runs on
              # both linux legs before the sweep.
              $armLiftedBy = [ordered]@{
                  'behavioral-smoke'  = 'S3 (the linux hand-owns at arm64)'
                  'behavioral-full'   = 'S3 (the linux hand-owns at arm64)'
                  'behavioral-stderr' = 'S3 (the linux hand-owns at arm64)'
                  'stack-probe'       = 'S3 (the linux hand-owns at arm64)'
              }
              if (-not $calibration -and $armLiftedBy.Contains($env:INPUT_STAGE)) {
                  throw "arch '$arch': '$($env:INPUT_STAGE)' runs converted programs on the linux/arm64 flavour, whose runtime sites are not yet arm64's; it is refused on the arm leg until seat $($armLiftedBy[$env:INPUT_STAGE]) lands. census and golib-tests run there."
              }
              $arm = @{ goos = 'linux'; runner = 'ubuntu-24.04-arm'; rid = 'linux-arm64'; calibration = $calibration; arch = $(if ($calibration) { '' } else { 'arm64' }) }
              $targets = if ($arch -eq 'arm64') { @($arm) } else { @($targets) + @($arm) }
              Write-Host "arch ${arch}: linux legs $(@($targets | ForEach-Object { $_.rid }) -join ', ')$(if ($calibration) { ' (linux-arm64 is a CALIBRATION leg: the linux/amd64 flavour on arm64)' })"
          }

          # release-smoke runs EVERY shipped RID from ONE pack, whatever goos says: its question is whether
          # the packages a release would publish carry what this tree's converter emits, on every OS they
          # ship for (C2, ec147f1d7f: N's converter emits unsafe.ArrayPointer, which the published 1.24.13.3
          # lacks). Three dispatches would be three packs of the same tree; one pack feeds all four legs.
          # aot-smoke reads the same pack, on all four RIDs (osx-arm64 since 2026-10-14, below).
          # nugetgo-behavior owes a row for EVERY shipped RID, each run on its own OS (COORD ruling 2026-10-12: no row is
          # inferred from another), so it takes the same four legs, with no pack.
          if ($env:INPUT_STAGE -in 'release-smoke', 'aot-smoke', 'nugetgo-behavior') {
              $targets = @(
                  @{ goos = 'windows'; runner = 'windows-latest';  rid = 'win-x64'   },
                  @{ goos = 'linux';   runner = 'ubuntu-latest';   rid = 'linux-x64' },
                  @{ goos = 'darwin';  runner = 'macos-15';        rid = 'osx-arm64' },
                  @{ goos = 'darwin';  runner = 'macos-15-intel';  rid = 'osx-x64'   })
              Write-Host "$($env:INPUT_STAGE): all four shipped RIDs (goos '$($env:INPUT_GOOS)' does not narrow it)"
          }

          # aot-smoke dropped osx-arm64 from 2026-10-07 (COORD ruling) to 2026-10-14: on a hosted macos-15 (3-core arm64) runner the
          # Native AOT publish of the consumer's 31-assembly closure did not finish inside the 6 hours a hosted job may run
          # (37523439849, cancelled at 6h00m; osx-x64 read 293 min). Those hours were ILC's generic cycle in golib (array/ж/slice);
          # with the cycle broken (e2move, merge b1ba1380b4) osx-arm64 published in 6 min (354 s, run 38587876788) and the filter was retired.

          # Job budgets, in MINUTES, scaled from CLAUDE.md's measured rows for a ~4-core runner.
          # A timeout is a safety net against a hung child, never a performance assumption, so
          # these sit well ABOVE the top of each measured range. GitHub's own hard ceiling for a
          # hosted job is 360 minutes; every value below stays under it after the mac multiplier.
          $baseTimeout = @{
              'census'           = 150   # go2cs-stdlib.slnx --no-incremental: 516s on the i7-5820K
                                         # (healthy disk) + a COLD 307-project NuGet restore.
              'behavioral-smoke' = 90    # converter `go build` + a filtered 4-phase run whose
                                         # shared core closure is built from cold.
              'behavioral-stderr' = 60   # converter go build + transpile/compile of a handful of
                                         # NAMED projects (the first pulls the core closure from
                                         # cold) + one direct run per project under the runner's
                                         # own 120 s budget. PROVISIONAL until the first run.
              'behavioral-full'  = 150   # the WHOLE enumeration in slices with a purge between.
                                         # PROVISIONAL, and deliberately labelled so: the first
                                         # real run of this leg replaces it. What IS measured, on
                                         # a 4-core Linux host at GoTargetOS=linux: a 3-project
                                         # slice costs 274s COLD (bin/obj/Generated purged, so the
                                         # core closure is rebuilt) and 58s warm. Subtracting a
                                         # ~5.3 s/project marginal puts the cold fixed term near
                                         # 258s and the warm one near 42s.
                                         #
                                         # Do NOT read ~62 min off that. The fixed term is NOT a
                                         # constant: the runner pre-builds the UNION of a slice's
                                         # dependencies, which was 6 shared deps for those 3
                                         # projects and is ~31 for the whole corpus, so a
                                         # 164-project slice pays materially more than the numbers
                                         # above. src/core does stay warm across slices (the purge
                                         # never touches it), so slices 2..n pay the warm term --
                                         # but the extrapolation from 3 projects to 655 is an
                                         # extrapolation, not a measurement, and it is the one
                                         # thing here that has never been run end to end.
                                         # 150 is chosen to clear a pessimistic reading of it with
                                         # the headroom the table's own doctrine asks for.
              'stack-probe'      = 90    # one row's -tests convert/build, the filtered compare, and up to the 900 s per-test
                                         # deadline while the probe waits. PROVISIONAL until the first run (C1, 2026-11-08).
              'converter-cgo'    = 15    # the converter's go test filtered to its cgo tests: one cold module download and
                                         # build, plus one converter go build for the driver-level arms. About 15 s of
                                         # tests on H with no compiler. PROVISIONAL until the first run (H, 2026-11-09).
              'golib-tests'      = 90    # one Release build of GolibTests and its core closure for this GOOS from
                                         # cold, then `dotnet test` (whole suite, or a --filter). PROVISIONAL until
                                         # the first run; added for the AES seat's osx-arm64 guard (C1, 2026-11-06).
              'sweep-shard'      = 210   # one -tests convert/build/run/compare cycle per matched
                                         # row; the sweep's own per-package floors reach 120m.
              'release-smoke'    = 90    # the LEG only (the pack job has its own budget): converter
                                         # go build + seven small restore/build/run arms (A-G in
                                         # src/tests/PackageTests/release-smoke.ps1) against the
                                         # feed, each restoring into a fresh cache. PROVISIONAL
                                         # until the first run.
              'aot-smoke'        = 240   # the LEG only (four RIDs): ONE Native AOT publish + run of PackageSymbols
                                         # under go.lib's TrimMode=partial, which compiles the whole
                                         # go.* closure (31 assemblies). Its measured wall times, before
                                         # and after golib's generic-cycle fix, are in docs/CIMatrix.md's
                                         # aot-smoke row. The pack's order, as ruled; the mac
                                         # multiplier takes it to 360, GitHub's ceiling.
              'nugetgo-behavior' = 90    # release-smoke's leg is the closest shape (C1, 2026-10-12): converter go build,
                                         # one `go run`, one conversion against the feed, and one restore, build and
                                         # run of the sample with its go.* closure restored cold. PROVISIONAL until
                                         # the first run.
          }

          $entries = foreach ($t in $targets) {
              $minutes = $baseTimeout[$env:INPUT_STAGE]

              if (-not $minutes) { throw "Unknown stage '$($env:INPUT_STAGE)'." }

              # The mac legs get 1.5x: macos-15 (arm64) is a 3-core runner, and every phase here
              # is parallel-MSBuild bound. Rounded to whole minutes; still under the 360 ceiling.
              if ($t.runner -like 'macos-*') { $minutes = [int][math]::Ceiling($minutes * 1.5) }
              # The arm leg takes the same 1.5x until its own calibration replaces it: ubuntu-24.04-arm has never run
              # these stages, and a timeout is a safety net, not an estimate.
              if ($t.runner -eq 'ubuntu-24.04-arm') { $minutes = [int][math]::Ceiling($minutes * 1.5) }

              $entry = [ordered]@{
                  goos    = $t.goos
                  runner  = $t.runner
                  rid     = $t.rid
                  timeout = $minutes
              }
              # Only a calibration leg carries the key, so every other dispatch derives the matrix it derived before.
              if ($t.calibration) { $entry.calibration = $true }
              # Likewise arch: only the linux-arm64 leg, once its flavour exists, carries one.
              if ($t.arch) { $entry.arch = $t.arch }
              [pscustomobject]$entry
          }

          # -AsArray so a single-target dispatch still emits a JSON ARRAY: PowerShell unwraps a
          # one-element pipeline to a scalar, and fromJson() would then hand the matrix an object.
          $json = @($entries) | ConvertTo-Json -Compress -Depth 4 -AsArray

          Write-Host "matrix: $json"

          Add-Content -Path $env:GITHUB_OUTPUT -Value "matrix=$json" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "go-version=$goVersion" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "goos=$goos" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "stage=$stage" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "filter=$filter" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "dotnet=$dotnet" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "run-timeout=$runTimeout" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "aot-bound-minutes=$aotBound" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "published-version=$publishedVersion" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "nugetgo-module=$nugetgoModule" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "nugetgo-version=$nugetgoVersion" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "nugetgo-package=$nugetgoPackage" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "nugetgo-feed=$nugetgoFeed" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "nugetgo-feed-sha256=$nugetgoFeedSha256" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "probe-test=$probeTest" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "probe-at=$probeAt" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "jit-disasm=$jitDisasm" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "dns-servers=$dnsServers" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "dump-proof=$dumpProof" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "cgo-cc=$cgoCc" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "cgo-cc-sha=$cgoCcSha" -Encoding utf8

  # ---------------------------------------------------------------------------------------------
  # pack — release-smoke only: the release's own pack, as a rehearsal, on a hosted Windows runner.
  # ---------------------------------------------------------------------------------------------
  # push-nuget.ps1 -VersionSuffix is PACK-ONLY by construction: it bumps nothing, tags nothing, writes
  # nothing under docs/validation and pushes nothing (its own parameter contract). It builds and packs
  # one flavor per GoTargetOS and merges them, which is the only RELEASE-configuration build of the
  # darwin flavor anywhere (the census above compiles Debug). The merged feed is what the legs consume.
  # Windows PowerShell, as on the release machine: release-nuget.ps1 drives this script through
  # `powershell`, and the script declares 5.1.
  pack:
    needs: plan
    # The post-publish smoke (published_version set) restores from nuget.org and packs nothing. aot-smoke always reads this
    # tree's pack: the plan refuses published_version on any stage but release-smoke.
    #   release-smoke, no published_version -> pack    release-smoke, published_version -> no pack (nuget.org)
    #   aot-smoke                           -> pack    every other stage                -> no pack
    if: (needs.plan.outputs.stage == 'release-smoke' || needs.plan.outputs.stage == 'aot-smoke') && needs.plan.outputs.published-version == ''
    runs-on: windows-latest
    # PROVISIONAL: three Release build+pack passes of the whole stdlib solution on a 4-core runner
    # (the i7 measures ~17 min per pass); never yet run on a hosted runner.
    timeout-minutes: 240
    steps:
      - name: Checkout (full history and tags -- the pre-flight reads release tags and snapshots)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go (pinned to the corpus release)
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.plan.outputs.go-version }}
          check-latest: false
          cache-dependency-path: src/go2cs/go.sum

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: ${{ needs.plan.outputs.dotnet }}

      # push-nuget builds one flavour per GOOS/GOARCH pair of its $ridFlavors map (seat S6), passing -p:GoTargetOS and
      # -p:GoTargetArch, so the job's environment no longer decides any flavour's architecture. A pair at the wrong
      # architecture would pack a wrong package that compiles; the guard reads the map and probes each pair.
      - name: Pack flavour guard — linux-arm64 packs at linux/arm64, every other RID at amd64
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          & ./.github/pack-flavour-guard.ps1

      - name: Pack every go.* package (rehearsal)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path 'artifacts' | Out-Null
          $feed = Join-Path $PWD 'feed'
          $log = Join-Path $PWD 'artifacts/pack.log'
          $suffix = "ci.${{ github.run_id }}"

          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & powershell -NoProfile -ExecutionPolicy Bypass -File src/push-nuget.ps1 -VersionSuffix $suffix -OutDir $feed *>&1 |
              Tee-Object -FilePath $log
          $packExit = $LASTEXITCODE
          $sw.Stop()

          $count = @(Get-ChildItem $feed -Filter *.nupkg -File -ErrorAction SilentlyContinue).Count
          # The summary carries push-nuget's path guard verdict: its CLEAN step line, or the count in its refusal.
          $summary = @(
              '## Release-smoke pack (windows-latest)'
              ''
              "push-nuget.ps1 -VersionSuffix $suffix -- exit ``$packExit`` after $([int]$sw.Elapsed.TotalMinutes) min; $count merged package(s)"
              ''
              '```'
          ) + @(Get-Content -LiteralPath $log | Select-String -Pattern '==> (Layout L3|Flavor comparison|  of |Merged|Shipped shape|Packed|Pack paths|\[)|Pack paths: [0-9]+ entr' | ForEach-Object { $_.Line }) + @('```')
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          & ./.github/annotate-summary.ps1 -Title 'release-smoke pack' -Lines $summary

          if ($packExit -eq 0 -and $count -eq 0) { Write-Host '::error::the pack reported success and produced no package'; exit 1 }
          exit $packExit

      - name: Upload the feed
        uses: actions/upload-artifact@v6
        with:
          name: release-smoke-feed
          # The merged packages only; the per-flavor _flavors/ packs are inspection copies.
          path: feed/*.nupkg
          retention-days: 3
          if-no-files-found: error

      - name: Upload the pack log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: release-smoke-pack-log
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------------------
  # run — one leg per (goos, runner, rid).
  # ---------------------------------------------------------------------------------------------
  run:
    needs: [plan, pack]
    # pack runs for release-smoke only; every other stage sees it SKIPPED and must still run. A failed
    # pack leaves the smoke legs nothing to consume, so they do not start.
    if: ${{ !cancelled() && needs.plan.result == 'success' && (needs.pack.result == 'success' || needs.pack.result == 'skipped') }}
    name: ${{ needs.plan.outputs.stage }} (${{ matrix.goos }} / ${{ matrix.rid }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      # A darwin leg that walls must not cancel its sibling: the whole point is to see BOTH
      # architectures' walls in one dispatch.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    env:
      # The corpus flavor this leg binds, stated explicitly rather than inherited. Every L3 csproj
      # defaults $(GoTargetOS) to `windows` when the property is EMPTY, and MSBuild maps
      # environment variables onto properties -- so ONE variable is the entire binding for every
      # child `dotnet` invocation of every instrument (the mechanism src/_paths.ps1 documents).
      # On Windows this is the identity; on Linux it agrees with _paths.ps1's own pin; on macOS it
      # is new, and it is what makes a darwin run a DARWIN run instead of a windows-flavor one.
      GoTargetOS: ${{ matrix.goos }}
      # The flavour's ARCH, the second axis of the same binding (seat S5b). `arm64` on the linux-arm64 leg once the
      # linux/arm64 flavour exists (plan, arch); EMPTY on every other leg, because every arch-split csproj defaults an
      # empty GoTargetArch to amd64, the arch every other flavour is converted at. So the other legs bind what they did.
      GoTargetArch: ${{ matrix.arch }}
      GOOS_TARGET: ${{ matrix.goos }}
      RID: ${{ matrix.rid }}
      STAGE: ${{ needs.plan.outputs.stage }}
      # true on a linux-arm64 leg before the linux/arm64 flavour exists: it builds the linux/amd64 flavour (plan, arch).
      CALIBRATION: ${{ matrix.calibration }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Go (pinned to the corpus release)
        uses: actions/setup-go@v6
        with:
          go-version: ${{ needs.plan.outputs.go-version }}
          check-latest: false
          cache-dependency-path: src/go2cs/go.sum

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          # Channel comes from the `dotnet` input: 10.0.x, the corpus TFM's own runtime since the
          # Stage-2 hop. An SDK cannot target a framework newer than itself, so an older channel
          # could only fail here with NETSDK1045; the 1.23.1.x anchors build from their own tag.
          dotnet-version: ${{ needs.plan.outputs.dotnet }}

      - name: Environment report
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          New-Item -ItemType Directory -Force -Path 'artifacts' | Out-Null
          $report = Join-Path $PWD "artifacts/environment-$($env:GOOS_TARGET)-$($env:RID).txt"

          # A calibration record, not decoration: every budget in CLAUDE.md's table is anchored to
          # named hardware, and the first dispatches of this workflow are what anchor the runners.
          $lines = @(
              "stage           : $($env:STAGE)"
              "goos / rid      : $($env:GOOS_TARGET) / $($env:RID)"
              "GoTargetOS env  : $($env:GoTargetOS)"
              "GoTargetArch env: $(if ($env:GoTargetArch) { $env:GoTargetArch } else { '(empty: the csproj default, amd64)' })"
              "calibration     : $(if ($env:CALIBRATION -eq 'true') { 'YES -- the linux/amd64 flavour on this arm64 runner; banks nothing' } else { 'no' })"
              "runner os       : $([System.Runtime.InteropServices.RuntimeInformation]::OSDescription.Trim())"
              "runner arch     : $([System.Runtime.InteropServices.RuntimeInformation]::OSArchitecture)"
              "logical cores   : $([Environment]::ProcessorCount)"
              "pwsh            : $($PSVersionTable.PSVersion)"
              "go              : $(& go version)"
              "go env GOVERSION: $(& go env GOVERSION)"
              "go env GOROOT   : $(& go env GOROOT)"
              "dotnet sdk      : $(& dotnet --version)"
          )

          # Free space on the repo drive. The harness scripts refuse below a 25 GB floor because a
          # mid-run write failure surfaces as a corpus FAILURE (three such incidents, 2026-08-13);
          # hosted runner images sit near or below that floor, which is why the stages below pass
          # -IgnoreDiskPreflight -- and why this number is recorded before anything else runs.
          $drive = [System.IO.DriveInfo]::new([System.IO.Path]::GetPathRoot($PWD.Path))
          $lines += "free space      : $([math]::Round($drive.AvailableFreeSpace / 1GB, 1)) GB on $($drive.Name)"

          $lines | Tee-Object -FilePath $report
          $lines | ForEach-Object { "    $_" } | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      # -------------------------------------------------------------------------------------
      # The flavour this leg builds, as MSBuild evaluates it, and a refusal when it is not the one the plan gave the leg
      # (seat S5b; .github/flavour-probe.ps1 explains the witness). The expected arch is the matrix's own arch field,
      # amd64 when it has none: the binding above is what is tested, so a leg whose GoTargetArch was not bound reads amd64
      # where the plan said arm64, and stops before any stage reads it. Stages that build no corpus are not probed.
      # -------------------------------------------------------------------------------------
      - name: Flavour probe — the arch this leg compiles
        if: ${{ !contains(fromJson('["release-smoke","aot-smoke","nugetgo-behavior"]'), needs.plan.outputs.stage) }}
        shell: pwsh
        env:
          PLANNED_ARCH: ${{ matrix.arch }}
        run: |
          $expected = if ($env:PLANNED_ARCH) { $env:PLANNED_ARCH } else { 'amd64' }
          & ./.github/flavour-probe.ps1 -Expected $expected -Label "the $($env:RID) leg"

      # -------------------------------------------------------------------------------------
      # census — compile the corpus flavor and bucket the errors by CS code.
      # -------------------------------------------------------------------------------------
      - name: Census — build the corpus flavor
        if: needs.plan.outputs.stage == 'census'
        shell: pwsh
        run: |
          # 'Continue': the build's own diagnostics are the measurement, and a native command's
          # stderr under 'Stop' would abort the run before anything is bucketed.
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null
          $log = Join-Path $art "census-$goos-$rid.log"

          # --no-incremental is REQUIRED for any pass that changes target: what differs between
          # GoTargetOS values is the <Compile> ITEM SET, not any source timestamp, so an
          # incremental build silently validates the other target's assemblies (CLAUDE.md, L3 gate
          # lesson 2). A fresh checkout has no obj/ anyway; the flag makes the intent explicit.
          $buildArgs = @(
              'build', 'src/go2cs-stdlib.slnx',
              '-c', 'Debug', '-m', '--no-incremental',
              "-p:GoTargetOS=$goos",
              '-p:UseSharedCompilation=false',
              '-clp:ErrorsOnly'
          )
          # The arch axis, stated beside the OS axis when the leg binds one (seat S5b).
          if ($env:GoTargetArch) { $buildArgs += "-p:GoTargetArch=$($env:GoTargetArch)" }

          Write-Host "==> dotnet $($buildArgs -join ' ')"

          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & dotnet @buildArgs | Tee-Object -FilePath $log
          $buildExit = $LASTEXITCODE
          $sw.Stop()

          $elapsed = [int]$sw.Elapsed.TotalSeconds
          Write-Host "==> build exit $buildExit after ${elapsed}s"

          # ---- bucket by diagnostic code ------------------------------------------------------
          # MSBuild error shape: `path(l,c): error CS0246: text [project.csproj]`. The code class
          # is deliberately broad (CS, MSB, NETSDK, ...) -- a platform census must not silently
          # drop an infrastructure error just because it is not a compiler one.
          $lines = @(Get-Content -LiteralPath $log -ErrorAction SilentlyContinue)
          $errorRegex = [regex]'(?:^|\s)error\s+([A-Za-z]+[0-9]+)\s*:'
          $projectRegex = [regex]'\[([^\]]+\.(?:csproj|slnx))\]\s*$'

          $records = foreach ($line in $lines) {
              $m = $errorRegex.Match($line)

              if (-not $m.Success) { continue }

              $pm = $projectRegex.Match($line.TrimEnd())

              [pscustomobject]@{
                  Code    = $m.Groups[1].Value
                  Project = if ($pm.Success) { Split-Path -Leaf $pm.Groups[1].Value } else { '(no project)' }
                  Text    = $line.Trim()
              }
          }

          $records = @($records)
          # MSBuild reprints one error once per referencing project, so both numbers are reported:
          # the raw count is what the build emitted, the distinct count is how many defects it is.
          $distinct = @($records | Sort-Object Text -Unique)

          # ---- assemblies produced ------------------------------------------------------------
          # The census metric that matters is packages-COMPILING, not raw error count: fixing a
          # file-inclusion defect RAISES the error count by surfacing latent ones behind it.
          $projects = @(Get-ChildItem -Path 'src/core' -Recurse -File -Filter '*.csproj' |
              Where-Object { $_.Name -notmatch '\.tests\.csproj$' })

          $built = New-Object System.Collections.Generic.List[string]
          $unbuilt = New-Object System.Collections.Generic.List[string]

          foreach ($project in $projects) {
              $text = [System.IO.File]::ReadAllText($project.FullName)

              $assembly = if ($text -match '<AssemblyName>\s*([^<]+?)\s*</AssemblyName>') {
                  $Matches[1]
              }
              else {
                  [System.IO.Path]::GetFileNameWithoutExtension($project.Name)
              }

              # OutDir is bin/$(Configuration)/$(TargetFramework)/ relative to the project. The TFM
              # folder is DERIVED, never spelled (CENSUS-tfm-inventory.md Class D): a hardcoded
              # name here reported "0 assemblies produced" on a green build after a TFM hop.
              $dll = Get-ChildItem -Path (Join-Path $project.DirectoryName 'bin/Debug') -Directory -ErrorAction SilentlyContinue |
                  ForEach-Object { Join-Path $_.FullName "$assembly.dll" } |
                  Where-Object { Test-Path -LiteralPath $_ } |
                  Select-Object -First 1
              $relative = $project.FullName.Substring($PWD.Path.Length).TrimStart('\', '/').Replace('\', '/')

              if ($dll) { $built.Add($relative) } else { $unbuilt.Add($relative) }
          }

          # ---- summary ------------------------------------------------------------------------
          $summary = New-Object System.Collections.Generic.List[string]
          $summary.Add("## Compile census -- GOOS=$goos ($rid)")
          $summary.Add('')
          $summary.Add("Command: ``dotnet $($buildArgs -join ' ')``")
          $summary.Add('')
          $summary.Add('| | |')
          $summary.Add('|:--|--:|')
          $summary.Add("| Projects under ``src/core`` | $($projects.Count) |")
          $summary.Add("| **Assemblies produced** | **$($built.Count)** |")
          $summary.Add("| Projects with no assembly | $($unbuilt.Count) |")
          $summary.Add("| Error lines (raw) | $($records.Count) |")
          $summary.Add("| Error lines (distinct) | $($distinct.Count) |")
          $summary.Add("| Build exit code | $buildExit |")
          $summary.Add("| Wall time | ${elapsed}s |")
          $summary.Add('')
          $summary.Add('A platform-exclusive package legitimately produces no assembly on the other')
          $summary.Add('flavors (``crypto/x509/internal/macos`` is darwin-exclusive), so "no assembly" is')
          $summary.Add('a starting point for reading the wall, never a defect count on its own.')
          $summary.Add('')

          if ($distinct.Count -gt 0) {
              $summary.Add('### Errors by code')
              $summary.Add('')
              $summary.Add('| Code | Distinct | Raw |')
              $summary.Add('|:--|--:|--:|')

              foreach ($group in ($distinct | Group-Object Code | Sort-Object Count -Descending)) {
                  $raw = @($records | Where-Object { $_.Code -eq $group.Name }).Count
                  $summary.Add("| ``$($group.Name)`` | $($group.Count) | $raw |")
              }

              $summary.Add('')
              $summary.Add('### Errors by project')
              $summary.Add('')
              $summary.Add('| Project | Distinct errors |')
              $summary.Add('|:--|--:|')

              foreach ($group in ($distinct | Group-Object Project | Sort-Object Count -Descending)) {
                  $summary.Add("| ``$($group.Name)`` | $($group.Count) |")
              }

              $summary.Add('')
              $summary.Add('### First 40 distinct errors')
              $summary.Add('')
              $summary.Add('```')
              foreach ($record in ($distinct | Select-Object -First 40)) { $summary.Add($record.Text) }
              $summary.Add('```')
          }
          else {
              $summary.Add('### No errors reported')
          }

          $summaryPath = Join-Path $art "census-$goos-$rid-summary.md"
          Set-Content -LiteralPath $summaryPath -Value $summary -Encoding utf8
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary

          $built | Set-Content -LiteralPath (Join-Path $art "census-$goos-$rid-assemblies.txt") -Encoding utf8
          $unbuilt | Set-Content -LiteralPath (Join-Path $art "census-$goos-$rid-no-assembly.txt") -Encoding utf8
          $distinct | ForEach-Object { $_.Text } |
              Set-Content -LiteralPath (Join-Path $art "census-$goos-$rid-errors.txt") -Encoding utf8

          # The step carries the BUILD's verdict. For darwin a red run with a bucketed census IS
          # the successful outcome of the exercise -- read the summary, not the checkmark.
          # The summary is ALSO emitted as annotations. Both places a leg's evidence normally
          # lands -- the job summary and the uploaded artifact -- are served from Azure blob
          # storage, so a host whose egress allows api.github.com but denies that domain can read
          # every step's CONCLUSION and none of its content. Annotations come back from the
          # check-runs REST API itself, which keeps this leg readable from such a host (and puts
          # the headline on the run page besides). Nothing above is replaced.
          & ./.github/annotate-summary.ps1 -Title "census $goos/$rid" -Lines $summary

          exit $buildExit

      # -------------------------------------------------------------------------------------
      # behavioral-full — the NATIVE-HOST leg accumulator 180 turned into a concrete need.
      #
      # A platform-exclusive guard's golden and its MSTest entries are verified ONLY on a
      # native-host leg: a foreign host skips every phase by name (that is what the marker is
      # for), and CNR is transpile-only, so a missing golden is nobody's business there either.
      # ScmRightsSeam and SendtoSeam are linux-exclusive and RUN here; the six windows-exclusives
      # are SKIPPED by name, and that skip line is part of what this leg asserts.
      #
      # WHY SLICES. Every behavioral project copies the same 55-dll core closure into its own
      # bin, so the per-project cost is FLAT at ~29.7 MB regardless of the package's weight
      # (measured twice, agreeing: 29.8 and 29.7). At 655 measurable projects that is ~19.5 GB
      # against ~14 GB free on a hosted runner -- the enumeration does not fit as one batch, and
      # narrowing it is not an option because the guarantee is about EVERY package.
      #
      # The purge is what makes the slices cheap rather than merely possible: it takes
      # src/tests/Behavioral only, -mindepth 2, so src/core stays warm and the ~236 s fixed cost
      # is paid ONCE for the whole leg. It must never take the runner's own bin -- doing that
      # once cost a run that died `exit 127, No such file or directory`.
      # -------------------------------------------------------------------------------------
      - name: Behavioral full — every package, in slices, on its native host
        if: needs.plan.outputs.stage == 'behavioral-full'
        shell: pwsh
        env:
          # Same reasoning as behavioral-smoke: the runner's OWN budgets cannot be influenced by
          # the job timeout, so a generous job budget alone would be worthless.
          GO2CS_BUILD_TIMEOUT: '5400'
          GO2CS_BUILD_ONE_TIMEOUT: '1800'
          GO2CS_TRANSPILE_TIMEOUT: '300'
          GO2CS_RUN_TIMEOUT: ${{ needs.plan.outputs.run-timeout }}
          SLICES: '4'
        run: |
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null

          $exeName = if ($IsWindows) { 'go2cs.exe' } else { 'go2cs' }
          Push-Location 'src/go2cs'
          try { & go build -o "bin/$exeName" . ; $goExit = $LASTEXITCODE }
          finally { Pop-Location }
          if ($goExit -ne 0) { Write-Host "::error::converter go build failed with exit $goExit"; exit $goExit }

          $runner = if ($IsWindows) {
              './src/tests/Behavioral/BehavioralRunner/bin/Debug/net10.0/BehavioralRunner.exe'
          } else {
              './src/tests/Behavioral/BehavioralRunner/bin/Debug/net10.0/BehavioralRunner'
          }

          & dotnet build ./src/tests/Behavioral/BehavioralRunner/BehavioralRunner.csproj -c Debug `
              -p:go2csPath="$PWD/src/" -p:UseSharedCompilation=false

          # FALSE-GREEN route #6: an instrument that cannot find its own runner reports success
          # over a hole. Assert it exists before anything reads a verdict from it.
          if (-not (Test-Path $runner)) {
              Write-Host "::error::BehavioralRunner not found at $runner"
              exit 1
          }

          $n = [int]$env:SLICES
          $sizes = @()
          $totals = @()
          $failed = @()

          for ($i = 1; $i -le $n; $i++) {
              Write-Host "==> slice $i/$n"
              $log = Join-Path $art "behavioral-full-$goos-$rid-slice$i.log"

              & $runner --slice "$i/$n" *>&1 | Tee-Object -FilePath $log
              $rc = $LASTEXITCODE
              if ($rc -ne 0) { $failed += "slice $i/$n (exit $rc)" }

              # The header the runner prints for exactly this: both numbers, machine-readable.
              $hdr = Select-String -Path $log -Pattern '^SLICE (\d+)/(\d+): (\d+) of (\d+) measurable' |
                  Select-Object -First 1
              if (-not $hdr) {
                  Write-Host "::error::slice $i/$n printed no SLICE header -- the run did not reach the enumeration"
                  $failed += "slice $i/$n (no header)"
              }
              else {
                  $sizes += [int]$hdr.Matches[0].Groups[3].Value
                  $totals += [int]$hdr.Matches[0].Groups[4].Value
              }

              # PURGE between slices -- src/tests/Behavioral only, -mindepth 2, never the runner's
              # own bin and never src/core. Depth-UNLIMITED: a maxdepth purge misses most of the
              # output (measured elsewhere at 274 of 388 directories missed).
              Get-ChildItem -Path './src/tests/Behavioral' -Directory -Recurse -Force `
                      -Include 'bin','obj','Generated' -ErrorAction SilentlyContinue |
                  Where-Object { $_.FullName -notmatch '[\\/](BehavioralRunner|BehavioralTests)[\\/]' } |
                  Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          }

          # THE COUNT ASSERTION. A partition bug that drops packages is FALSE-GREEN route #3's
          # shape through a new door -- every slice passes and the corpus is not covered -- so the
          # sizes must SUM to the measurable total and every slice must agree on what that total
          # is. Asserted, never trusted.
          $sum = ($sizes | Measure-Object -Sum).Sum
          $distinctTotals = $totals | Sort-Object -Unique

          if ($sizes.Count -ne $n) {
              Write-Host "::error::expected $n slice headers, saw $($sizes.Count)"
              $failed += 'missing slice headers'
          }
          elseif ($distinctTotals.Count -ne 1) {
              Write-Host "::error::slices disagree on the measurable total: $($distinctTotals -join ', ')"
              $failed += 'total disagreement'
          }
          elseif ($sum -ne $distinctTotals[0]) {
              Write-Host "::error::slice sizes sum to $sum but the measurable total is $($distinctTotals[0]) -- the partition dropped packages"
              $failed += 'partition short'
          }
          else {
              Write-Host "==> partition OK: $($sizes -join ' + ') = $sum of $($distinctTotals[0]) measurable"
          }

          $summary = @(
              "## Behavioral full -- GOOS=$goos ($rid)"
              ''
              "Slices ``$n`` -- sizes ``$($sizes -join ', ')`` -- sum ``$sum`` of ``$($distinctTotals -join ',')`` measurable"
              ''
              $(if ($failed.Count -gt 0) { "FAILED: $($failed -join '; ')" } else { 'All slices green and the partition covers the enumeration.' })
          )
          $summary | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          & ./.github/annotate-summary.ps1 -Title "behavioral-full $goos/$rid" -Lines $summary

          if ($failed.Count -gt 0) { exit 1 }
          exit 0

      # -------------------------------------------------------------------------------------
      # golib-tests' cgo probe library (docs/phase4/DESIGN-cgo-phase2-pinvoke.md §11.10, increment 4d): the exit-gate
      # arms no system library gives on every OS, built from src/tests/GolibTests/cgo-probe/probe.c with the OS's DEFAULT
      # pinned C toolchain (PLAN-cgo-interop §5.1: zig on linux and darwin, llvm-mingw on windows), into a directory
      # GolibTests reads as GO2CS_CGO_PROBE_DIR. No binary is committed. Each leg REQUIRES the probe
      # (GO2CS_REQUIRE_CGO_PROBE=1): an arm that cannot load it fails here, and reads Inconclusive only where nothing
      # built it (a local run, or a runner with no pin). It loads as the resolver loads anything, never from the
      # current directory: linux through LD_LIBRARY_PATH (set to the directory alone when it was empty -- an empty
      # entry is the current directory to ld.so), darwin by its ABSOLUTE install name at a fixed path (§11.12: dyld's
      # search for a bare name reached the current directory, 42936395011), and windows from the test assembly's own
      # directory, where CgoProbeTests copies it.
      - name: GolibTests — build the cgo probe library
        if: needs.plan.outputs.stage == 'golib-tests' && contains(fromJSON('["linux-x64","osx-x64","osx-arm64","win-x64"]'), matrix.rid)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $goos = $env:GOOS_TARGET
          $cc = if ($goos -eq 'windows') { 'llvm-mingw' } else { 'zig' }
          $toolchain = & ./.github/cgo-toolchain.ps1 -Cc $cc -Rid $env:RID -Label 'golib-tests cgo probe'

          # darwin's directory is fixed, since the golden binds the probe by its absolute install name there.
          $dir = if ($goos -eq 'darwin') { '/tmp/go2cs-cgo-probe' } else { Join-Path $env:RUNNER_TEMP 'cgo-probe' }
          New-Item -ItemType Directory -Force -Path $dir | Out-Null

          # Each OS's load-time name, which the golden's probe fixture binds (src/go2cs's cgoProbeLibrary): the SONAME on
          # linux, the absolute install name on darwin, the DLL's own name on windows.
          $probe = @{
              windows = @{ name = 'go2csprobe.dll'; flags = @() }
              darwin  = @{ name = 'libgo2csprobe.dylib'; flags = @("-Wl,-install_name,$dir/libgo2csprobe.dylib") }
              linux   = @{ name = 'libgo2csprobe.so'; flags = @('-fPIC', '-Wl,-soname,libgo2csprobe.so') }
          }[$goos]
          $name = $probe.name
          $flags = $probe.flags
          $library = Join-Path $dir $name
          $source = Join-Path $PWD 'src/tests/GolibTests/cgo-probe/probe.c'

          $clock = [Diagnostics.Stopwatch]::StartNew()
          & $toolchain.Exe @($toolchain.Args) -shared -O2 @flags -o $library $source
          $buildExit = $LASTEXITCODE
          $buildSeconds = [math]::Round($clock.Elapsed.TotalSeconds, 1)
          if ($buildExit -ne 0 -or -not (Test-Path -LiteralPath $library)) { throw "golib-tests cgo probe: $($toolchain.Version) could not build $name (exit $buildExit)." }

          Add-Content -Path $env:GITHUB_ENV -Value "GO2CS_CGO_PROBE_DIR=$dir" -Encoding utf8
          Add-Content -Path $env:GITHUB_ENV -Value 'GO2CS_REQUIRE_CGO_PROBE=1' -Encoding utf8

          if ($goos -eq 'linux') {
              $path = if ([string]::IsNullOrEmpty($env:LD_LIBRARY_PATH)) { $dir } else { "${dir}:$($env:LD_LIBRARY_PATH)" }
              Add-Content -Path $env:GITHUB_ENV -Value "LD_LIBRARY_PATH=$path" -Encoding utf8
          }

          $summary = @(
              "## golib-tests cgo probe -- $($toolchain.Version) on $($env:RID)"
              ''
              "READING built $name ($((Get-Item -LiteralPath $library).Length) bytes) in $buildSeconds s, into GO2CS_CGO_PROBE_DIR"
          )
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          & ./.github/annotate-summary.ps1 -Title "golib-tests cgo probe $($env:RID)" -Lines $summary

      # -------------------------------------------------------------------------------------
      # golib-tests — GolibTests on this leg's own host. Added for guards whose subject only exists on one
      # architecture: RuntimeAesHashTests checks the runtime's AES hash bit for bit against a table taken from
      # Go, and on osx-arm64 that body runs on Arm's AESE and AESMC (runtime/hash_impl.cs) rather than on
      # x86's AESENC, a composition no x64 host can execute. Nothing else in CI runs GolibTests.
      # -------------------------------------------------------------------------------------
      - name: GolibTests — build and run for this GOOS
        if: needs.plan.outputs.stage == 'golib-tests'
        shell: pwsh
        env:
          GOLIB_FILTER: ${{ needs.plan.outputs.filter }}
          GOLIB_JIT_DISASM: ${{ needs.plan.outputs.jit-disasm }}
        run: |
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null
          $log = Join-Path $art "golib-tests-$goos-$rid.log"
          $trx = Join-Path $art "golib-tests-$goos-$rid.trx"

          Push-Location 'src/tests/GolibTests'
          try {
              # The arch axis beside the OS axis, when the leg binds one (seat S5b).
              $archArgs = @(if ($env:GoTargetArch) { "-p:GoTargetArch=$($env:GoTargetArch)" })
              & dotnet build -c Release "-p:GoTargetOS=$goos" @archArgs -nologo -v q *>&1 | Tee-Object -FilePath $log
              $runExit = $LASTEXITCODE

              if ($runExit -eq 0) {
                  $testArgs = @('test', '-c', 'Release', '--no-build', "-p:GoTargetOS=$goos") + $archArgs + @('--blame-hang-timeout', '10m',
                      '--logger', "trx;LogFileName=$trx", '--logger', 'console;verbosity=normal')

                  if (-not [string]::IsNullOrWhiteSpace($env:GOLIB_FILTER)) { $testArgs += @('--filter', $env:GOLIB_FILTER) }

                  # ;jit= (opt-in): the JIT's listing of each matching method, tiering off (FullOpts, as the corpus's
                  # Release default runs), written by the test host and printed below. Blank sets nothing.
                  $jitListing = Join-Path $art "jitdisasm-$goos-$rid.txt"
                  if (-not [string]::IsNullOrWhiteSpace($env:GOLIB_JIT_DISASM)) {
                      $env:DOTNET_JitDisasm = $env:GOLIB_JIT_DISASM
                      $env:DOTNET_JitStdOutFile = $jitListing
                      $env:DOTNET_TieredCompilation = '0'
                  }

                  & dotnet @testArgs *>&1 | Tee-Object -FilePath $log -Append
                  $runExit = $LASTEXITCODE

                  if (-not [string]::IsNullOrWhiteSpace($env:GOLIB_JIT_DISASM)) {
                      Remove-Item Env:DOTNET_JitDisasm, Env:DOTNET_JitStdOutFile, Env:DOTNET_TieredCompilation -ErrorAction SilentlyContinue
                      if (Test-Path -LiteralPath $jitListing) {
                          $listing = @(Get-Content -LiteralPath $jitListing)
                          Write-Host "==> JIT listing for '$($env:GOLIB_JIT_DISASM)': $($listing.Count) lines"
                          $listing | ForEach-Object { Write-Host "    $_" }
                      }
                      else { Write-Host "==> JIT listing for '$($env:GOLIB_JIT_DISASM)': no listing was written" }
                  }
              }
          }
          finally { Pop-Location }

          # Every test's outcome by name (Passed, Failed, NotExecuted for an Inconclusive), read from the trx, so a
          # guard that went Inconclusive on this host is visible rather than counted as a pass.
          $outcomes = @()
          if (Test-Path -LiteralPath $trx) {
              [xml]$doc = Get-Content -LiteralPath $trx -Raw
              $outcomes = @($doc.TestRun.Results.UnitTestResult | Sort-Object testName | ForEach-Object { "  $($_.outcome) $($_.testName)" })
              # A test's measured readings: the standard-output lines it starts with READING (the console logger prints
              # a passing test's output at no verbosity this stage uses), so a measurement reads in the job's summary.
              $readings = @($doc.TestRun.Results.UnitTestResult | Sort-Object testName | ForEach-Object {
                  $name = $_.testName
                  @("$($_.Output.StdOut)" -split "`r?`n" | Where-Object { $_ -like 'READING *' } |
                      ForEach-Object { "  $name -- $($_.Substring(8))" })
              })
              if ($readings.Count) { $outcomes += @('', 'Readings:') + $readings }
          }

          $summary = @(
              "## GolibTests -- GOOS=$goos ($rid)"
              ''
              "Filter ``$($env:GOLIB_FILTER)`` -- exit ``$runExit``"
              ''
              '```'
          ) + @(Get-Content -LiteralPath $log -ErrorAction SilentlyContinue | Where-Object { $_ -match '^(Passed!|Failed!|Total tests|\s+(Passed|Failed|Skipped):)' } | Select-Object -Last 8) + $outcomes + @('```')

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          & ./.github/annotate-summary.ps1 -Title "golib-tests $goos/$rid" -Lines $summary

          exit $runExit

      # -------------------------------------------------------------------------------------
      # converter-cgo -- OPT-IN: the converter's own cgo tests on this leg's host, where a C compiler lets go list run
      # cmd/cgo. No other hosted stage gives them one (licensing.yml's go test is filtered to ^TestLicensing), so the
      # compiler-gated tests -- cgo Phase 1's exit gate, TestRealLoadRefusesOnlyASelectedCgoFile -- skip everywhere
      # else. A SKIP here is a reading too: this runner had no compiler on PATH, which the summary's first line names.
      # -------------------------------------------------------------------------------------
      # converter-cgo with ;cc= -- the cgo C toolchain scout's instrument (H, 2026-11-10; the owner's direction is
      # PLAN-cgo-interop §5.1's dated amendment). ONE pinned toolchain archive for this runner is downloaded and refused
      # unless its sha256 is the pin's (or the plan's sha= replacement); only a verified archive is unpacked and handed to
      # go as CC. A refusal fails the leg HERE, so the tests step below never runs on an unverified compiler. The gate
      # tests still look for gcc, cc or clang on PATH, which every hosted image has; go itself reads CC, so cmd/cgo runs
      # the pinned compiler, and the tests step's instrument line names it.
      - name: Converter cgo tests — provision the pinned C toolchain
        if: needs.plan.outputs.stage == 'converter-cgo' && needs.plan.outputs.cgo-cc != ''
        shell: pwsh
        env:
          CGO_CC: ${{ needs.plan.outputs.cgo-cc }}
          CGO_CC_SHA: ${{ needs.plan.outputs.cgo-cc-sha }}
        run: |
          $ErrorActionPreference = 'Stop'

          # The pin table is .github/cgo-toolchain.ps1's, shared with golib-tests' cgo probe library: a refusal fails the
          # leg there, before anything is unpacked, and a verified compiler is handed to the tests step as CC.
          $sha = if ($env:CGO_CC_SHA) { $env:CGO_CC_SHA } else { $null }
          & ./.github/cgo-toolchain.ps1 -Cc $env:CGO_CC -Rid $env:RID -Sha $sha -Label 'converter-cgo' -ExportEnv | Out-Null

      - name: Converter cgo tests — go test with this host's C compiler
        if: needs.plan.outputs.stage == 'converter-cgo'
        shell: pwsh
        env:
          CGO_TEST_FILTER: ${{ needs.plan.outputs.filter }}
          # The dotnet arms (TestCgoMirrorsCompileAndHoldTheirLayoutUnderDotnet) skip where no .NET SDK is installed; here
          # one always is, so its absence must read red, not skipped.
          GO2CS_REQUIRE_DOTNET: '1'
          # The load-name capture arms (TestCgoCapture*) link with this leg's C compiler, which every hosted runner has,
          # so a missing one reads red, not skipped.
          GO2CS_REQUIRE_CC: '1'
        run: |
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null
          $log = Join-Path $art "converter-cgo-$goos-$rid.log"

          $filter = $env:CGO_TEST_FILTER
          if ([string]::IsNullOrWhiteSpace($filter)) { $filter = '^Test.*Cgo|^TestRealLoad' }

          # The instrument line: the compiler go would hand cmd/cgo, and whether go's own default turns cgo on here.
          # CC may carry arguments (a pinned zig is "zig cc"): the first field is the executable, the rest go before --version.
          $cc = "$(& go env CC)".Trim()
          $ccFields = @($cc -split '\s+' | Where-Object { $_ })
          $ccVersion = if ($ccFields.Count -and (Get-Command $ccFields[0] -ErrorAction SilentlyContinue)) { "$(& $ccFields[0] @($ccFields | Select-Object -Skip 1) --version 2>&1 | Select-Object -First 1)" } else { 'NOT FOUND on PATH' }
          $instrument = "go env CC = $cc ($ccVersion); go env CGO_ENABLED = $("$(& go env CGO_ENABLED)".Trim())"
          Write-Host "==> $instrument"

          Push-Location 'src/go2cs'
          try {
              & go test -buildvcs=false -count=1 -v -run $filter . *>&1 | Tee-Object -FilePath $log
              $runExit = $LASTEXITCODE
          }
          finally { Pop-Location }

          # Every test's outcome by name, so a SKIP is visible rather than counted as a pass, then each READING a test logs.
          $lines = @(Get-Content -LiteralPath $log -ErrorAction SilentlyContinue)
          $outcomes = @($lines | Where-Object { $_ -match '^\s*--- (PASS|FAIL|SKIP):' } | ForEach-Object { $_.Trim() })
          $readings = @($lines | Where-Object { $_ -match 'READING ' } | ForEach-Object { $_.Trim() })
          if ($readings.Count) { $outcomes += @('', 'Readings:') + $readings }

          $summary = @(
              "## Converter cgo tests -- $goos ($rid)"
              ''
              $instrument
              ''
              "Filter ``$filter`` -- exit ``$runExit``"
              ''
              '```'
          ) + $outcomes + @('```')

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          & ./.github/annotate-summary.ps1 -Title "converter-cgo $goos/$rid" -Lines $summary

          exit $runExit

      # -------------------------------------------------------------------------------------
      # stack-probe -- OPT-IN diagnostic (COORD's ruling, 2026-11-08, before the 1.26.10.3 darwin leg). The converted test
      # host abandons a test at its 900 s per-test deadline with one line and no stacks, so a hang (runtime/pprof's
      # TestGoroutineSwitch on osx-arm64) could not be rooted from a sweep's reading. This stage sweeps ONE row filtered to
      # ONE test (run-validated-sweep.ps1 -TestFilter) while .github/stack-probe.ps1 takes dotnet-stack reports of that
      # row's converted test host at the at= offsets. It never banks: a filtered row reads COUNT or FAIL by design.
      # The instrument is proven first, every run, on a deliberately hung program: a dump without the planted frame fails
      # the step as BLIND, so an empty probe can never read as a clean one.
      # -------------------------------------------------------------------------------------
      - name: Stack probe -- dotnet-stack dumps of one row's test host (diagnostic, never banks)
        if: needs.plan.outputs.stage == 'stack-probe'
        shell: pwsh
        env:
          PROBE_ROW: ${{ needs.plan.outputs.filter }}
          PROBE_TEST: ${{ needs.plan.outputs.probe-test }}
          PROBE_AT: ${{ needs.plan.outputs.probe-at }}
          SWEEP_TEST_TIMEOUT: '45m'
        run: |
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null
          $summary = [System.Collections.Generic.List[string]]::new()
          $summary.Add("## Stack probe -- GOOS=$goos ($rid)")
          $summary.Add('')

          # The row, the regex and the offsets were validated by the plan job (filter ROW;test=REGEX;at=S,S).
          $row = "$env:PROBE_ROW".Trim()
          $offsets = @("$env:PROBE_AT" -split ',' | ForEach-Object { [int]$_.Trim() } | Sort-Object)

          # The tool, pinned.
          $tools = Join-Path $env:RUNNER_TEMP 'stack-tools'
          & dotnet tool install dotnet-stack --version 10.0.731102 --tool-path $tools *>&1 | ForEach-Object { Write-Host $_ }
          $dotnetStack = Join-Path $tools 'dotnet-stack'
          $probeScript = Join-Path $PWD '.github/stack-probe.ps1'

          # 1. THE INSTRUMENT, PROVEN: a program parked in a non-inlined ProbeSelfTestHang must show that frame.
          $hang = Join-Path $env:RUNNER_TEMP 'stackprobe-selftest'
          New-Item -ItemType Directory -Force -Path $hang | Out-Null
          Set-Content -LiteralPath (Join-Path $hang 'stackprobe-selftest.csproj') -Encoding utf8 -Value @(
              '<Project Sdk="Microsoft.NET.Sdk">'
              '  <PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0</TargetFramework></PropertyGroup>'
              '</Project>')
          Set-Content -LiteralPath (Join-Path $hang 'Program.cs') -Encoding utf8 -Value @(
              'using System.Runtime.CompilerServices;'
              'static class Program'
              '{'
              '    [MethodImpl(MethodImplOptions.NoInlining)]'
              '    static void ProbeSelfTestHang() { while (true) System.Threading.Thread.Sleep(1000); }'
              '    static void Main() => ProbeSelfTestHang();'
              '}')
          & dotnet build $hang -c Release -nologo -v q *>&1 | ForEach-Object { Write-Host $_ }
          $selfExe = Join-Path $hang 'bin/Release/net10.0/stackprobe-selftest'
          $selfProc = Start-Process -FilePath $selfExe -PassThru
          $self = @(& $probeScript -Pattern '/stackprobe-selftest$' -At 5 -OutDir (Join-Path $art 'stack-selftest') -DotnetStack $dotnetStack -WaitForStartSeconds 120)
          Stop-Process -Id $selfProc.Id -Force -ErrorAction SilentlyContinue
          $selfText = if ($self.Count -gt 0 -and $self[0].Path) { Get-Content -LiteralPath $self[0].Path -Raw } else { '' }

          if ($selfText -notmatch 'ProbeSelfTestHang') {
              $why = if ($self.Count -gt 0 -and $self[0].Error) { $self[0].Error } else { 'the dump lacks the planted frame' }
              $summary.Add("**BLIND: the instrument did not capture the planted frame ($why). No probe was taken.**")
              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
              & ./.github/annotate-summary.ps1 -Title "stack-probe $goos/$rid" -Lines $summary
              exit 1
          }

          $summary.Add("Instrument proven: the self-test dump shows ``Program.ProbeSelfTestHang()``.")
          $summary.Add('')

          # 2. THE PROBE: the row swept with -TestFilter while the watcher dumps its converted test host.
          # Anchored on the EXECUTABLE (the command line's first token): the converter's own dotnet publish of the host carries
          # the publish directory in its arguments, and a pattern that matched anywhere could dump the build instead.
          $hostPattern = '^\S*' + [regex]::Escape("src/core/$row/bin/tests/publish/") + '[^/\s]+\.tests(\s|$)'
          $oracleGoarch = if ($rid -eq 'osx-arm64') { 'arm64' } else { '' }
          $watch = Start-ThreadJob -ArgumentList $probeScript, $hostPattern, $offsets, (Join-Path $art 'stack-probe'), $dotnetStack -ScriptBlock {
              param($script, $pattern, $at, $out, $ds)
              & $script -Pattern $pattern -At $at -OutDir $out -DotnetStack $ds -WaitForStartSeconds 5400
          }

          $log = Join-Path $art "stack-probe-$goos-$rid.log"
          & ./src/run-validated-sweep.ps1 -Filter $row -Exact -TestTimeout $env:SWEEP_TEST_TIMEOUT -TestOracleGoarch $oracleGoarch -TestFilter $env:PROBE_TEST -IgnoreDiskPreflight *>&1 |
              Tee-Object -FilePath $log
          $sweepExit = $LASTEXITCODE

          $dumps = @(Receive-Job -Job $watch -Wait -AutoRemoveJob)
          $summary.Add("Row ``$row``, -TestFilter ``$($env:PROBE_TEST)``, offsets $($offsets -join ', ') s; the sweep exited $sweepExit (a filtered row is never a bank).")
          $summary.Add('')

          foreach ($dump in $dumps) {
              if ($dump.Error) { $summary.Add("- at $($dump.Offset) s: $($dump.Error)") }
              if (-not $dump.Path) { continue }
              $text = @(Get-Content -LiteralPath $dump.Path)
              Write-Host "==> stack probe: pid $($dump.Pid) at $($dump.Offset) s, $($text.Count) lines"
              $text | ForEach-Object { Write-Host "    $_" }
              $summary.Add("### pid $($dump.Pid) at $($dump.Offset) s ($($text.Count) lines)")
              $summary.Add('```')
              $text | Select-Object -First 150 | ForEach-Object { $summary.Add($_) }
              $summary.Add('```')
          }

          # The probed test's own output, from the row's results record (-test.v), so the dump reads beside where it stopped.
          $resultsPath = Join-Path $PWD "src/core/$row/go2cs_test_results.json"
          if (Test-Path -LiteralPath $resultsPath) {
              try {
                  $results = Get-Content -LiteralPath $resultsPath -Raw | ConvertFrom-Json
                  $own = @($results.events | Where-Object { $_.test -and $_.test -match $env:PROBE_TEST -and $_.output } | ForEach-Object { "$($_.output)" -split "`r?`n" } | Where-Object { $_.Trim() })
                  Write-Host "==> the probed test's own output: $($own.Count) line(s)"
                  $own | ForEach-Object { Write-Host "    $_" }
                  $summary.Add('### The probed test''s output (last 40 lines)')
                  $summary.Add('```')
                  $own | Select-Object -Last 40 | ForEach-Object { $summary.Add($_) }
                  $summary.Add('```')
              }
              catch { $summary.Add("results record unreadable: $($_.Exception.Message)") }
          }

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          & ./.github/annotate-summary.ps1 -Title "stack-probe $goos/$rid" -Lines $summary
          # The step's verdict is the instrument's, not the row's: a filtered row fails its counts by design.
          exit 0

      # -------------------------------------------------------------------------------------
      # behavioral-smoke — prove the harness itself runs on this runner.
      # -------------------------------------------------------------------------------------
      - name: Behavioral smoke — converter build + filtered run
        if: needs.plan.outputs.stage == 'behavioral-smoke'
        shell: pwsh
        env:
          SMOKE_FILTER: ${{ needs.plan.outputs.filter }}
          # M:N spike (this branch never lands): the filtered program is built with generated twins (the
          # property reaches MSBuild from the environment) and every program the smoke runs is on the scheduler.
          GoTwinsFor: ${{ needs.plan.outputs.filter }}
          GO2CS_MN: '1'
          # BehavioralRunner's OWN budgets, in seconds: no timeout the caller sets can influence
          # them, so a generous job budget alone would be worthless if the runner killed its child
          # first. Sized for a cold 4-core hosted runner, where the shared core closure is built
          # from nothing and the Transpile phase rewrites every .cs immediately before Compile (so
          # warm state can never make the batch an incremental no-op).
          GO2CS_BUILD_TIMEOUT: '5400'
          GO2CS_BUILD_ONE_TIMEOUT: '1800'
          GO2CS_TRANSPILE_TIMEOUT: '300'
          GO2CS_RUN_TIMEOUT: ${{ needs.plan.outputs.run-timeout }}
        run: |
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null

          # Pure-compute projects: `Defer` is a family of ~13 behavioral packages that exercise
          # defer/panic/recover ordering and print through fmt -- no clock, no filesystem, no
          # sockets, so a failure is the HARNESS or the corpus flavor, never platform semantics.
          $filter = $env:SMOKE_FILTER

          if ([string]::IsNullOrWhiteSpace($filter)) { $filter = 'Defer' }

          Write-Host "==> behavioral smoke: filter '$filter', GoTargetOS=$($env:GoTargetOS)"

          # Build the converter explicitly. A hosted runner has no go2cs binary at all, and every
          # harness rebuild predicate keys on a converter *.go being NEWER than the binary -- which
          # a toolchain change never touches (FALSE-GREEN route #4). Building it here first also
          # separates a Go-toolchain failure from a harness failure in the log.
          $exeName = if ($IsWindows) { 'go2cs.exe' } else { 'go2cs' }

          Push-Location 'src/go2cs'
          try {
              & go build -o "bin/$exeName" .
              $goExit = $LASTEXITCODE
          }
          finally { Pop-Location }

          if ($goExit -ne 0) {
              Write-Host "::error::converter go build failed with exit $goExit"
              exit $goExit
          }

          Write-Host '==> converter built'

          # *>&1 merges the INFORMATION stream: the repo scripts report through Write-Host, so a
          # bare 2>&1 would drop every `==>` status line and the log would read as a hung run.
          # -IgnoreDiskPreflight: hosted images sit near or under the harness's 25 GB floor; the
          # free-space number is recorded in the environment report above so a genuine
          # disk-exhaustion failure can still be recognized rather than guessed at.
          $log = Join-Path $art "behavioral-smoke-$goos-$rid.log"

          & ./src/tests/Behavioral/run-behavioral.ps1 -IgnoreDiskPreflight --filter $filter *>&1 |
              Tee-Object -FilePath $log

          $runExit = $LASTEXITCODE

          $summary = @(
              "## Behavioral smoke -- GOOS=$goos ($rid)"
              ''
              "Filter ``$filter`` -- exit ``$runExit``"
              ''
              'Tail of the run:'
              ''
              '```'
          ) + @(Get-Content -LiteralPath $log -Tail 40 -ErrorAction SilentlyContinue) + @('```')

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          Set-Content -LiteralPath (Join-Path $art "behavioral-smoke-$goos-$rid-summary.md") -Value $summary -Encoding utf8

          # The summary is ALSO emitted as annotations. Both places a leg's evidence normally
          # lands -- the job summary and the uploaded artifact -- are served from Azure blob
          # storage, so a host whose egress allows api.github.com but denies that domain can read
          # every step's CONCLUSION and none of its content. Annotations come back from the
          # check-runs REST API itself, which keeps this leg readable from such a host (and puts
          # the headline on the run page besides). Nothing above is replaced.
          & ./.github/annotate-summary.ps1 -Title "behavioral-smoke $goos/$rid" -Lines $summary

          exit $runExit

      # -------------------------------------------------------------------------------------
      # M:N spike (this branch never lands). After the smoke has built MnMixedStorm with generated twins, run the
      # program directly: Go's build for the reference output, then the C# build on the thread path (the sampler's
      # control) and on the scheduler at three sizes. A sampler outside the process counts its OS threads, and the
      # scheduler prints its own reading.
      # -------------------------------------------------------------------------------------
      - name: M:N spike — direct runs of the twinned storm
        if: always() && needs.plan.outputs.stage == 'behavioral-smoke' && needs.plan.outputs.filter == 'MnMixedStorm'
        timeout-minutes: 30
        shell: bash
        run: |
          set +e
          set +o pipefail
          dir=src/tests/Behavioral/MnMixedStorm
          dll=$dir/bin/Release/net10.0/MnMixedStorm.dll
          if [ ! -f "$dll" ]; then echo "READING mn-direct no build output at $dll"; exit 0; fi
          ls "$dir/Generated/go2cs-gen/go2cs.TwinGenerator/" 2>/dev/null | sed 's/^/READING mn-direct generated: /'
          grep -E '^// (candidates|await-sites|T )' "$dir/Generated/go2cs-gen/go2cs.TwinGenerator/go2cs.twins.report.g.cs" 2>/dev/null | tr -d '\r' | sed 's/^/READING mn-direct report: /'
          (cd "$dir" && go build -o "$RUNNER_TEMP/mnstorm-go" .) || echo "READING mn-direct go build failed"
          now() { python3 -c 'import time; print(time.time())'; }
          one() {
            label=$1; n=$2; mn=$3; shift 3
            export MN_STORM_N=$n MN_STORM_HOLD_MS=3000 GO2CS_MN_READING=1
            if [ "$mn" = "1" ]; then export GO2CS_MN=1; else unset GO2CS_MN; fi
            start=$(now)
            "$@" > "$RUNNER_TEMP/mn-out.txt" 2> "$RUNNER_TEMP/mn-err.txt" &
            pid=$!
            peak=0
            while kill -0 $pid 2>/dev/null; do
              if [ -d /proc/$pid/task ]; then t=$(ls /proc/$pid/task 2>/dev/null | wc -l); else t=$(ps -M -p $pid 2>/dev/null | tail -n +2 | wc -l); fi
              t=$(echo $t)
              if [ -n "$t" ] && [ "$t" -gt "$peak" ]; then peak=$t; fi
              sleep 0.25
            done
            wait $pid
            code=$?
            wall=$(python3 -c "print(round($(now) - $start, 1))")
            out=$(tr -d '\r' < "$RUNNER_TEMP/mn-out.txt" | tr '\n' ';')
            reading=$(grep -a 'READING go-scheduler' "$RUNNER_TEMP/mn-err.txt" | tail -n 1 | tr -d '\r')
            errs=$(grep -a -c -i 'exception\|panic\|fatal' "$RUNNER_TEMP/mn-err.txt")
            echo "READING mn-direct arm=$label n=$n exit=$code wall=${wall}s sampled-peak-threads=$peak err-lines=$errs out=[$out] | $reading"
            if [ "$code" != "0" ]; then head -n 5 "$RUNNER_TEMP/mn-err.txt" | cut -c1-300 | sed 's/^/READING mn-direct stderr: /'; fi
          }
          for n in 1000 10000 100000; do
            if [ -x "$RUNNER_TEMP/mnstorm-go" ]; then one go $n 0 "$RUNNER_TEMP/mnstorm-go"; fi
          done
          one cs-threads 1000 0 dotnet "$dll"
          for n in 1000 10000 100000; do
            one cs-twins $n 1 dotnet "$dll"
          done
          exit 0

      - name: Behavioral stderr — run named projects directly and keep the WHOLE stderr
        if: needs.plan.outputs.stage == 'behavioral-stderr'
        # A STEP limit under the job's: a wedged timeout arm once held both mac runners to the job's
        # 1h30m (run 36957913093), and one runner lost communication. Forty minutes covers five
        # projects at run_timeout 300 with their builds (the slowest measured: osx-arm64, 28 min);
        # the artifact upload below still runs (if: always()).
        timeout-minutes: 40
        shell: pwsh
        env:
          STDERR_PROJECTS: ${{ needs.plan.outputs.filter }}
          GO2CS_BUILD_TIMEOUT: '5400'
          GO2CS_BUILD_ONE_TIMEOUT: '1800'
          GO2CS_TRANSPILE_TIMEOUT: '300'
          GO2CS_RUN_TIMEOUT: ${{ needs.plan.outputs.run-timeout }}
        run: |
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null

          $names = @($env:STDERR_PROJECTS -split '[,;\s]+' | Where-Object { $_ })

          if ($names.Count -eq 0) {
              Write-Host "::error::behavioral-stderr needs the filter input as comma-separated project names"
              exit 2
          }

          $behavioral = Join-Path $PWD 'src/tests/Behavioral'
          $exit = 0

          foreach ($p in $names) {
              $proj = Join-Path $behavioral $p

              if (-not (Test-Path -LiteralPath (Join-Path $proj "$p.csproj"))) {
                  Write-Host "::error::no behavioral project named '$p'"
                  $exit = 1
                  continue
              }

              # Build exactly as the runner does (converter go build, transpile, Release compile).
            # The phase list is QUOTED: a bare transpile,compile is a PowerShell ARRAY in argument
            # position and reaches the runner as two words (`Unknown phase: transpile compile`, run
            # 33804782714);
              # the filter is a substring, so a full project name matches itself and any project
              # that CONTAINS it -- harmless for the build, and the run below names the exe by path.
              Write-Host "==> ${p}: transpile + compile through the runner"
              & ./src/tests/Behavioral/run-behavioral.ps1 -IgnoreDiskPreflight --filter $p --phase 'transpile,compile' *>&1 |
                  Tee-Object -FilePath (Join-Path $art "stderr-build-$p-$goos-$rid.log")

              $exe = Join-Path $proj "bin/Release/net10.0/$p"
              if ($IsWindows) { $exe += '.exe' }

              if (-not (Test-Path -LiteralPath $exe)) {
                  Write-Host "::error::${p}: no apphost at $exe after the compile phase"
                  $exit = 1
                  continue
              }

              # The runner's launch, reproduced: the apphost, no arguments, cwd = src/tests/Behavioral
              # (Path.GetDirectoryName(projPath)), the job's own environment (GoTargetOS bound), and
              # the same 120 s budget -- so what this prints is what the Output phase saw, whole.
              $outFile = Join-Path $art "stderr-$p-$goos-$rid.stdout.txt"
              $errFile = Join-Path $art "stderr-$p-$goos-$rid.stderr.txt"
              # Stamped BEFORE the launch: a crash report is claimed only if it was written
              # after this moment, so a stale .ips from an earlier row cannot be read as this one's.
              $launched = Get-Date
              $proc = Start-Process -FilePath $exe -WorkingDirectory $behavioral -NoNewWindow -PassThru `
                  -RedirectStandardOutput $outFile -RedirectStandardError $errFile

              $finished = $proc.WaitForExit([int]$env:GO2CS_RUN_TIMEOUT * 1000)

              if (-not $finished) {
                  # Kill the TREE, never just the apphost, and never by name (CLAUDE.md floor 5). A program
                  # that spawns itself (StdoutCloseEofBarrier execs os.Args[0]) leaves its child alive past
                  # a parent-only kill: on arm64 that orphan outlived every later row of the job (run
                  # 36953433720, "Terminate orphan process: pid (6761) (StdoutCloseEofB)" at job end).
                  # The tree is collected by PARENT PID while the apphost is still alive (an orphan
                  # re-parents to launchd or init and no longer answers pgrep -P), then every descendant
                  # is killed, then the apphost.
                  #
                  # NOTHING IS STOPPED. The first version SIGSTOPped each member before reading the next
                  # level, and on BOTH mac legs the step then hung inside the walk with no further output
                  # until the job's limit: osx-x64 ran out its 1h30m with both StdoutCloseEofB processes
                  # still alive at cleanup, and osx-arm64's runner lost communication (run 36957913093).
                  # Every call here is a one-shot native command over a RUNNING process.
                  $tree = [System.Collections.Generic.List[string]]::new()

                  if ($IsWindows) {
                      & taskkill /PID $proc.Id /T /F 2>&1 | Out-Null
                  }
                  else {
                      $frontier = @($proc.Id)
                      $descendants = @()

                      while ($frontier.Count -gt 0) {
                          $next = @()

                          foreach ($parentPid in $frontier) {
                              $next += @(& pgrep -P $parentPid 2>$null | Where-Object { "$_" -match '^\s*\d+\s*$' } | ForEach-Object { [int]"$_".Trim() })
                          }

                          # Only real, new pids: never 0 or 1, never one already collected.
                          $next = @($next | Where-Object { $_ -gt 1 -and $_ -ne $proc.Id -and $descendants -notcontains $_ })
                          $descendants += $next
                          $frontier = $next
                      }

                      foreach ($child in $descendants) {
                          $tree.Add("$child ($(@(& ps -o comm= -p $child 2>$null) -join ''))")
                      }

                      foreach ($child in $descendants) { & kill -9 $child 2>$null }
                  }

                  Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
                  Start-Sleep -Seconds 2

                  if ($tree.Count -gt 0) {
                      Write-Host "==> ${p}: the timeout kill took the apphost and $($tree.Count) descendant(s): $($tree -join ', ')"
                  }

                  # A survivor is a pid that still exists and is not a zombie awaiting its reaper.
                  foreach ($id in @($proc.Id) + @($tree | ForEach-Object { [int]($_ -split ' ')[0] })) {
                      if ($IsWindows) {
                          $alive = Get-Process -Id $id -ErrorAction SilentlyContinue
                          $survivor = if ($alive) { "$($alive.ProcessName)" } else { '' }
                      }
                      else {
                          $stat = "$(@(& ps -o stat= -p $id 2>$null) -join '')".Trim()
                          $survivor = if ($stat -and $stat -notmatch '^Z') { "$(@(& ps -o comm= -p $id 2>$null) -join '') [$stat]" } else { '' }
                      }

                      if ($survivor) {
                          Write-Host "::warning::${p}: pid $id ($survivor) SURVIVED the timeout kill"
                      }
                  }

                  $code = 'TIMEOUT'
              }
              else {
                  $code = $proc.ExitCode
              }

              $err = @(Get-Content -LiteralPath $errFile -ErrorAction SilentlyContinue)
              $out = @(Get-Content -LiteralPath $outFile -ErrorAction SilentlyContinue)

              Write-Host "==> ${p}: exit $code; stderr $($err.Count) lines; stdout $($out.Count) lines"
              # A SIGNAL death writes NOTHING to stderr -- the process is gone before any managed
              # writer runs -- so the exit code is all this stage could quote (SignalPrimitives on
              # osx-arm64 at train 24: exit 138, stderr 0 lines, stdout 2 lines). macOS records the
              # rest: ReportCrash writes a .ips naming the exception type, the signal, the faulting
              # address and every thread`s backtrace. Nothing in this repository collected them, so a
              # mute darwin death could only be read as ARITHMETIC (138 = 128 + 10 = SIGBUS) rather
              # than as evidence -- which is exactly what Q41 asks for.
              #
              # Scope: this diagnostic stage alone. behavioral-full runs hundreds of projects and is
              # a census, not a reading; a mute row found there is brought HERE by name.
              #
              # Best-effort and never fatal, deliberately: a stage whose own diagnostics can fail the
              # run is worse than one that reports less. And the NULL is REPORTED -- whether GitHub`s
              # macOS images run ReportCrash at all is not something this repository has ever
              # measured, so "no report" is a finding about the runner, not a silent empty artifact.
              $signalish = ($code -eq 'TIMEOUT') -or (($code -is [int]) -and (($code -gt 128) -or (($code -ne 0) -and ($err.Count -eq 0))))

              if ($IsMacOS -and $signalish) {
                  $reportDir = Join-Path $HOME 'Library/Logs/DiagnosticReports'
                  $ips = @()

                  # ReportCrash runs AFTER the process dies, so poll rather than assume it has
                  # finished; ~20 s is the whole budget and it is only spent on a death.
                  foreach ($attempt in 1..10) {
                      $ips = @(Get-ChildItem -LiteralPath $reportDir -Filter '*.ips' -ErrorAction SilentlyContinue |
                          Where-Object { $_.LastWriteTime -ge $launched })
                      if ($ips.Count -gt 0) { break }
                      Start-Sleep -Seconds 2
                  }

                  # Prefer a report whose name carries this project`s process name; fall back to any
                  # fresh one and SAY which arm answered, so the reading is never ambiguous.
                  $named = @($ips | Where-Object { $_.Name -like "$p*" })
                  $picked = if ($named.Count -gt 0) { $named } else { $ips }
                  $arm = if ($named.Count -gt 0) { 'name-matched' } else { 'fresh-but-unnamed' }

                  if ($picked.Count -eq 0) {
                      Write-Host "==> ${p}: exit $code looks like a signal death and NO crash report was written to $reportDir within 20s -- either this runner image does not run ReportCrash, or the death did not produce one"
                  }
                  else {
                      Write-Host "==> ${p}: $($picked.Count) crash report(s) collected ($arm)"

                      foreach ($rep in $picked) {
                          $dest = Join-Path $art "crash-$p-$goos-$rid-$($rep.Name)"
                          Copy-Item -LiteralPath $rep.FullName -Destination $dest -ErrorAction SilentlyContinue

                          # The .ips body is JSON on one line; quote the fields that name the death
                          # rather than parsing a format this repository has never read before.
                          $raw = Get-Content -LiteralPath $rep.FullName -Raw -ErrorAction SilentlyContinue
                          $facts = @()

                          foreach ($pat in @('"exception":\{[^}]*\}', '"termination":\{[^}]*\}', '"faultingThread":[0-9]+', '"signal":"[^"]*"', '"type":"[^"]*"', '"subtype":"[^"]*"')) {
                              foreach ($m in [regex]::Matches($raw, $pat)) {
                                  if ($facts -notcontains $m.Value) { $facts += $m.Value }
                              }
                          }

                          # The FRAMES are what PLACE a death; the fields above only name it (Q41 at train 26:
                          # SIGBUS / EXC_BAD_ACCESS / KERN_PROTECTION_FAILURE at 0x4200000000, and the artifact
                          # unreadable from a proxied lane). A .ips is a one-line JSON header followed by the
                          # report body (pretty JSON on macOS 13+): parse the body, print the faulting thread's
                          # frames against usedImages, and its register state -- pc/lr/sp, and on arm64 far/esr,
                          # which say whether the fault was an instruction fetch AT the address or a data access
                          # to it. Best-effort like the rest: a body that does not parse prints its raw head.
                          # -AsHashtable is load-bearing, not style: a real report carries BOTH `vmRegionInfo`
                          # and `vmregioninfo`, and pwsh's case-insensitive object reader refuses keys that
                          # differ only by case -- the first collection (run 33946376666) fell back for exactly
                          # that reason. Hashtables are case-sensitive and keep both.
                          $frameLines = @()
                          try {
                              $bodyText = ($raw -split "`n", 2)[1]
                              $body = $bodyText | ConvertFrom-Json -Depth 64 -AsHashtable
                              $ft = [int]$body['faultingThread']
                              $thread = $body['threads'][$ft]
                              $images = @($body['usedImages'])
                              $frameLines += "faulting thread $ft" + $(if ($thread['name']) { " ($($thread['name']))" } elseif ($thread['queue']) { " ($($thread['queue']))" } else { '' })
                              $i = 0
                              foreach ($f in @($thread['frames'] | Select-Object -First 40)) {
                                  $img = if ($null -ne $f['imageIndex'] -and $f['imageIndex'] -lt $images.Count) { $images[$f['imageIndex']]['name'] } else { '?' }
                                  $sym = if ($f['symbol']) { " $($f['symbol'])+$($f['symbolLocation'])" } else { '' }
                                  $frameLines += ('#{0,-3} {1} + 0x{2:x}{3}' -f $i, $img, [int64]$f['imageOffset'], $sym)
                                  $i++
                              }
                              $ts = $thread['threadState']
                              if ($ts) {
                                  $regs = @()
                                  foreach ($r in 'pc','lr','sp','far','esr') { if ($ts[$r]) { $regs += ('{0}=0x{1:x}' -f $r, [int64]$ts[$r]['value']) } }
                                  if ($ts['esr'] -and $ts['esr']['description']) { $regs += "esr:'$($ts['esr']['description'])'" }
                                  if ($regs.Count -gt 0) { $frameLines += ('threadState ' + ($regs -join ' ')) }
                              }
                          }
                          catch {
                              $frameLines += "frames: the report body did not parse ($($_.Exception.Message)); raw head follows"
                              $frameLines += @(($raw -split "`n") | Select-Object -First 60)
                          }

                          $lines = @("## crash $p -- GOOS=$goos ($rid) -- exit $code -- $($rep.Name) ($arm)", '', '```') +
                              @($facts | Select-Object -First 40) + $frameLines + @('```')

                          if ($facts.Count -eq 0) {
                              $lines = @("## crash $p -- GOOS=$goos ($rid) -- exit $code -- $($rep.Name) ($arm)", '',
                                  'The report was collected but none of the expected fields matched; the frames follow if the body parsed.', '```') + $frameLines + @('```')
                          }

                          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $lines
                          & ./.github/annotate-summary.ps1 -Title "crash $p $goos/$rid" -Lines $lines
                      }
                  }
              }


              # A stdout MISMATCH is the Output phase's other verdict, and the runner's log carries no
              # text for it. Run Go's own program the way that phase does (`go run .`, cwd = the
              # project, the pinned toolchain) and, when the row exits 0 with a differing stdout,
              # annotate the DIFF -- `<=` lines are the C# side, `=>` lines are Go's -- so the reading
              # is one job-log read (ReflectArrayOf on darwin, 2026-09-03: the only signal was the
              # word "mismatch").
              if ($code -eq 0) {
                  Push-Location $proj
                  $goOut = @(& go run . 2>$null)
                  Pop-Location
                  Set-Content -LiteralPath (Join-Path $art "stderr-$p-$goos-$rid.go-stdout.txt") -Value $goOut

                  if (($out -join "`n") -ne ($goOut -join "`n")) {
                      $diff = @(Compare-Object -ReferenceObject @($out + '') -DifferenceObject @($goOut + '') -SyncWindow 0 |
                          ForEach-Object { "$($_.SideIndicator) $($_.InputObject)" })
                      $dl = @(
                          "## stdout diff $p -- GOOS=$goos ($rid) -- C# (<=) vs go run (=>): $($out.Count) vs $($goOut.Count) lines"
                          ''
                          '```'
                      ) + @($diff | Select-Object -First 120) + @('```')

                      Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $dl
                      & ./.github/annotate-summary.ps1 -Title "stdout diff $p $goos/$rid" -Lines $dl
                  }
              }

              $lines = @(
                  "## stderr $p -- GOOS=$goos ($rid) -- exit $code"
                  ''
                  '```'
              ) + $err + @('```')

              Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $lines
              & ./.github/annotate-summary.ps1 -Title "stderr $p $goos/$rid" -Lines $lines
          }

          exit $exit

      # -------------------------------------------------------------------------------------
      # Dump suppression, proven per job (S7-b; docs/phase4/DATA-la64-s7-bank-plan.md section 3). The fleet rule after
      # six aborts wrote 211 GB of dumps on a lane box: no many-thread linux run without suppression PROVEN on that
      # machine first, and a failed proof STOPS the run. A hosted job is a fresh machine whose image can change its dump
      # handler without notice, so the proof runs in every linux sweep-shard job, on both legs, before the sweep.
      # .github/dump-suppression-proof.sh does the work; these steps only sequence it and keep its records.
      # Step 1 records the settings, runs the POSITIVE control (the census must see a dump and a 128 MiB write with
      # suppression off) and applies suppression, reading each value back. Step 2 is a NEW step on purpose: it reads its
      # own inherited core limit, then crashes a 2,000-thread .NET probe twice and requires 0 new dump files and under
      # 8 MiB. Either failing fails the job before the sweep. dumpproof=red (filter option) skips the apply and runs
      # step 2 with suppression OFF: it must fail by name, at the file count, and the sweep never starts.
      # dumpproof=red-space is that arm with the file count not enforced: the free-space check must fail alone.
      # -------------------------------------------------------------------------------------
      - name: Dump suppression — record, positive control, apply
        id: dumpproof-apply
        if: needs.plan.outputs.stage == 'sweep-shard' && matrix.goos == 'linux'
        shell: bash
        env:
          DUMP_PROOF_MODE: ${{ needs.plan.outputs.dump-proof }}
        run: |
          state="$RUNNER_TEMP/dumpproof"
          proof=./.github/dump-suppression-proof.sh
          rc=0
          bash "$proof" record "$state" || rc=$?
          if [ "$rc" -eq 0 ]; then bash "$proof" control "$state" || rc=$?; fi
          if [ "$rc" -eq 0 ]; then
            if [ "$DUMP_PROOF_MODE" = red ] || [ "$DUMP_PROOF_MODE" = red-space ]; then
              echo "DUMPPROOF apply: RED ARM ($DUMP_PROOF_MODE) -- suppression is NOT applied"
            else
              bash "$proof" apply "$state" || rc=$?
            fi
          fi
          mkdir -p "artifacts/dumpproof-$RID"
          cp "$state"/*.txt "$state"/*.tsv "artifacts/dumpproof-$RID/" 2>/dev/null || true
          exit "$rc"

      - name: Dump suppression — negative proof (2,000-thread .NET probe, crashed twice)
        id: dumpproof-prove
        if: needs.plan.outputs.stage == 'sweep-shard' && matrix.goos == 'linux'
        shell: bash
        env:
          DUMP_PROOF_MODE: ${{ needs.plan.outputs.dump-proof }}
        run: |
          state="$RUNNER_TEMP/dumpproof"
          rc=0
          bash ./.github/dump-suppression-proof.sh prove "$state" "$DUMP_PROOF_MODE" || rc=$?
          mkdir -p "artifacts/dumpproof-$RID"
          cp "$state"/*.txt "$state"/*.tsv "$state"/*.out "artifacts/dumpproof-$RID/" 2>/dev/null || true
          exit "$rc"

      # -------------------------------------------------------------------------------------
      # sweep-shard's opt-in resolver (C1, 2026-11-08): net's TestLookupNoSuchHost NXDOMAIN keys fail on the hosted mac
      # runners because the image's resolver answers an invalid name late or not as NXDOMAIN. With filter option
      # dns=IP[,IP] this step times NXDOMAIN for invalid.invalid through Go's resolvers (default, netdns=go,
      # netdns=cgo), sets the job's DNS servers on every enabled network service, flushes the caches, logs the effective
      # resolver, and times the lookups again. Every line starts DNSPROBE. It never fails the job: the sweep's verdict is
      # read as usual, with the resolver in the log.
      # -------------------------------------------------------------------------------------
      - name: Sweep shard — the job's resolver (opt-in, darwin)
        if: needs.plan.outputs.stage == 'sweep-shard' && needs.plan.outputs.dns-servers != ''
        shell: bash
        env:
          DNS_SERVERS: ${{ needs.plan.outputs.dns-servers }}
        run: |
          probe_dir="$RUNNER_TEMP/dnsprobe"
          mkdir -p "$probe_dir"
          cat > "$probe_dir/main.go" <<'GO'
          package main

          import (
          	"context"
          	"errors"
          	"fmt"
          	"net"
          	"os"
          	"time"
          )

          func main() {
          	label := os.Args[1]
          	for _, kind := range []string{"MX", "NS", "TXT", "HOST"} {
          		ctx, cancel := context.WithTimeout(context.Background(), 30*time.Second)
          		started := time.Now()
          		var err error
          		switch kind {
          		case "MX":
          			_, err = net.DefaultResolver.LookupMX(ctx, "invalid.invalid")
          		case "NS":
          			_, err = net.DefaultResolver.LookupNS(ctx, "invalid.invalid")
          		case "TXT":
          			_, err = net.DefaultResolver.LookupTXT(ctx, "invalid.invalid")
          		case "HOST":
          			_, err = net.DefaultResolver.LookupHost(ctx, "invalid.invalid")
          		}
          		elapsed := time.Since(started)
          		cancel()
          		var dnsErr *net.DNSError
          		notFound, timeout, server := false, false, ""
          		if errors.As(err, &dnsErr) {
          			notFound, timeout, server = dnsErr.IsNotFound, dnsErr.IsTimeout, dnsErr.Server
          		}
          		fmt.Printf("DNSPROBE %s kind=%s ms=%d notfound=%v timeout=%v server=%q err=%v\n",
          			label, kind, elapsed.Milliseconds(), notFound, timeout, server, err)
          	}
          }
          GO
          probe() {
            for mode in default go cgo; do
              if [ "$mode" = default ]; then godebug=""; else godebug="netdns=$mode"; fi
              (cd "$probe_dir" && GODEBUG="$godebug" go run main.go "phase=$1 resolver=$mode") || echo "DNSPROBE phase=$1 resolver=$mode probe-exit=$?"
            done
          }
          resolvers() {
            echo "DNSPROBE phase=$1 resolv.conf: $(grep -E '^nameserver' /etc/resolv.conf | tr '\n' ' ')"
            echo "DNSPROBE phase=$1 scutil: $(scutil --dns | grep -E 'nameserver\[' | sort -u | tr -s ' ' | tr '\n' ' ')"
          }
          resolvers before
          probe before
          servers="${DNS_SERVERS//,/ }"
          networksetup -listallnetworkservices | tail -n +2 | grep -v '^\*' | while IFS= read -r svc; do
            sudo networksetup -setdnsservers "$svc" $servers && echo "DNSPROBE set: '$svc' -> $servers"
          done
          sudo dscacheutil -flushcache
          sudo killall -HUP mDNSResponder || true
          sleep 2
          resolvers after
          probe after
          exit 0

      # -------------------------------------------------------------------------------------
      # sweep-shard — a filtered validated sweep against `go test -json` on this platform.
      # -------------------------------------------------------------------------------------
      - name: Sweep shard — filtered validated sweep
        if: needs.plan.outputs.stage == 'sweep-shard'
        shell: pwsh
        env:
          SWEEP_FILTER: ${{ needs.plan.outputs.filter }}
          # Raises the sweep's 10m default for a 4-core hosted runner. The script's per-package
          # $longTimeouts entries are FLOORS, not overrides: a larger -TestTimeout raises them, a
          # smaller one still loses, so this value cannot under-budget the four long rows.
          SWEEP_TEST_TIMEOUT: '45m'
        run: |
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null

          # container/heap is the fleet's calibration row (LANES.md's provisioning baseline): small,
          # pure-compute, and already banked -- the right default for "does a sweep run here at all".
          $filter = $env:SWEEP_FILTER

          if ([string]::IsNullOrWhiteSpace($filter)) { $filter = 'container/heap' }

          # The filter is a comma-separated list of EXACT roster package names, each swept with
          # -Exact. The sweep's own -Filter is a substring, so "sort" alone swept internal/fmtsort
          # too and "path" swept path/filepath; and the concurrency group above holds one pending
          # run, so a row-by-row campaign could not be dispatched as separate runs either (the
          # darwin row pilot, 2026-10-03, had to group rows by shared prefix). Every name is
          # checked against the roster BEFORE anything builds: a typo refuses the run by name
          # instead of sweeping nothing.
          $names = [System.Collections.Generic.List[string]]::new()

          foreach ($part in ($filter -split ',')) {
              $name = $part.Trim()

              if ($name -and -not $names.Contains($name)) { $names.Add($name) }
          }

          . ./src/_roster.ps1
          $banked = @(Get-ValidatedRosterRows -Path ./docs/ValidatedTestPackages.md | ForEach-Object { $_.Package })
          $unknown = @($names | Where-Object { $banked -notcontains $_ })

          if ($unknown.Count -gt 0) {
              throw "sweep-shard: not a banked roster package (names are exact, not substrings): $($unknown -join ', ')"
          }

          Write-Host "==> sweep shard: $($names.Count) row(s) by exact name -- $($names -join ', ') -- GoTargetOS=$($env:GoTargetOS), timeout $($env:SWEEP_TEST_TIMEOUT)"

          # The sweep builds the converter itself and refuses a toolchain whose release differs
          # from version.props' pin -- which is exactly the version setup-go installed above. It
          # builds once: every later name reuses that converter (-SkipBuild). The step's exit is
          # the first non-zero row exit, so one failing row still reds the leg.
          $log = Join-Path $art "sweep-$goos-$rid.log"
          $sweepExit = 0
          $skipBuild = $false

          # The osx-arm64 runner converts the darwin/amd64 corpus and runs its converted host as a NATIVE arm64 process,
          # so its oracle runs at arm64 too, not as amd64 under Rosetta (COORD's osx-arm64 oracle seat, ruling (A); the
          # converter's -test-oracle-goarch). Every other leg's host runs at the target's own arch: nothing is passed.
          $oracleGoarch = if ($env:RID -eq 'osx-arm64') { 'arm64' } else { '' }
          $failedRows = [System.Collections.Generic.List[string]]::new()

          foreach ($name in $names) {
              & ./src/run-validated-sweep.ps1 -Filter $name -Exact -SkipBuild:$skipBuild -TestTimeout $env:SWEEP_TEST_TIMEOUT -TestOracleGoarch $oracleGoarch -IgnoreDiskPreflight *>&1 |
                  Tee-Object -FilePath $log -Append

              $rowExit = $LASTEXITCODE

              if ($rowExit -ne 0 -and $sweepExit -eq 0) { $sweepExit = $rowExit }
              if ($rowExit -ne 0) { $failedRows.Add($name) }

              $skipBuild = $true
          }

          # ---- per-row evidence ---------------------------------------------------------------
          # The pipeline writes each swept package's comparison record beside its converted code.
          # Those are the rows: verdict-for-verdict maps of `go test -json` against the C# host.
          # The C# host's own results sit beside it as go2cs_test_results.json and .xml (testConversion.go
          # sets GO2CS_TEST_RESULT / GO2CS_TEST_JUNIT to those names), and they are the only record that
          # carries a failing test's TEXT; the comparison record carries verdicts only. Until 2026-10-13
          # this list named 'results.json' and 'results.xml', which nothing writes, so a darwin red could
          # not be root-caused from the artifact (darwin wave 11, run 38340386426).
          $rowsRoot = Join-Path $art 'rows'
          $rowFiles = @('go2cs_test_comparison.json', 'go2cs_test_results.json', 'go2cs_test_results.xml')
          $evidence = @(Get-ChildItem -Path 'src/core' -Recurse -File -Include $rowFiles -ErrorAction SilentlyContinue)

          foreach ($file in $evidence) {
              $relative = $file.FullName.Substring($PWD.Path.Length).TrimStart('\', '/').Replace('\', '/')
              $destination = Join-Path $rowsRoot $relative

              New-Item -ItemType Directory -Force -Path (Split-Path -Parent $destination) | Out-Null
              Copy-Item -LiteralPath $file.FullName -Destination $destination -Force
          }

          Write-Host "==> collected $($evidence.Count) per-row evidence file(s)"

          # A failed row's preserved attempts (the whole console output as row-output.txt, and any oracle
          # re-run's records), which the sweep keeps under scratchpad/sweep-oracle-flake and nothing uploaded.
          $failEvidence = Join-Path $PWD 'scratchpad/sweep-oracle-flake'

          if (Test-Path -LiteralPath $failEvidence) {
              Copy-Item -LiteralPath $failEvidence -Destination (Join-Path $art 'failing-rows') -Recurse -Force
          }

          # The failing tests' text, in the step log as well: a host that can read this log but not the
          # artifact's blob storage can still root-cause a red. Every C# 'fail' event of each row whose
          # sweep exited non-zero, disclosed failures included, capped at 40 lines a test and 30 tests a row.
          # Then the last 80 lines of the row's preserved console output: a host that CRASHES writes no
          # failing event, and its exception and stack sit there (net/http/pprof on darwin, wave 12, whose
          # log carried the stack's last three frames and not the exception above them).
          foreach ($name in $failedRows) {
              $rowOutput = Get-ChildItem -Path $failEvidence -Recurse -File -Filter 'row-output.txt' -ErrorAction SilentlyContinue |
                  Where-Object { $_.Directory.Name -eq 'runfinal' -and $_.Directory.Parent.Name -eq ($name -replace '/', '.') } |
                  Sort-Object LastWriteTime | Select-Object -Last 1

              if ($rowOutput) {
                  Write-Host "==> row output: $name -- last 80 lines of $($rowOutput.FullName.Substring($PWD.Path.Length).TrimStart('\', '/'))"
                  Get-Content -LiteralPath $rowOutput.FullName -Tail 80 | ForEach-Object { Write-Host "      $_" }
              }

              $resultsFile = Join-Path $PWD "src/core/$name/go2cs_test_results.json"

              if (-not (Test-Path -LiteralPath $resultsFile)) {
                  Write-Host "==> C# results: $name wrote no go2cs_test_results.json"
                  continue
              }

              $record = $null
              try { $record = Get-Content -LiteralPath $resultsFile -Raw | ConvertFrom-Json } catch { Write-Host "==> C# results: $name unreadable: $($_.Exception.Message)" }
              if ($null -eq $record) { continue }

              $failures = @($record.events | Where-Object { $_.action -eq 'fail' -and $_.test })
              Write-Host "==> C# results: $name -- $($failures.Count) failing test(s)"

              foreach ($failure in @($failures | Select-Object -First 30)) {
                  Write-Host "  C# FAIL $name $($failure.test)"
                  @("$($failure.output)" -split "`r?`n" | Select-Object -First 40) | ForEach-Object { Write-Host "      $_" }
              }
          }

          # Each FAILING row's comparison record as lines: status, matched, disclosed, the undisclosed divergence count,
          # and the first 40 undisclosed divergences with both verdicts (Get-ComparisonDivergenceLines, src/_roster.ps1;
          # guarded by src/tests/sweep-row-divergence-selftest.ps1). The C# FAIL listing above shows one shape only; a
          # Go pass / C# skip divergence, a Go skip / C# pass one or a one-sided row was unreadable from a lane that can
          # read annotations but not the blob-served artifact (COORD ruling (a), 2026-11-06: the osx-arm64 runtime
          # row's AES trio, unread in run 42214977499). The lines go to the log and into the summary's annotations.
          . ./src/_roster.ps1
          $divergenceLines = [System.Collections.Generic.List[string]]::new()

          foreach ($name in $failedRows) {
              $comparisonPath = Join-Path $PWD "src/core/$name/go2cs_test_comparison.json"
              $comparison = $null

              if (Test-Path -LiteralPath $comparisonPath) {
                  try { $comparison = ConvertFrom-ComparisonRecord -Path $comparisonPath }
                  catch {
                      $divergenceLines.Add("${name}: comparison record unreadable: $($_.Exception.Message)")
                      continue
                  }
              }

              # The C# side's own failure text for each divergence, from the row's results record (its `fail` events):
              # the first 8 lines each, under the divergence they explain. Unreadable or absent, the lines print without.
              $failureText = @{}
              $resultsPath = Join-Path $PWD "src/core/$name/go2cs_test_results.json"

              if (Test-Path -LiteralPath $resultsPath) {
                  try {
                      $results = Get-Content -LiteralPath $resultsPath -Raw | ConvertFrom-Json
                      foreach ($event in @($results.events | Where-Object { $_.action -eq 'fail' -and $_.test })) {
                          if (-not $failureText.ContainsKey($event.test)) { $failureText[$event.test] = "$($event.output)" }
                      }
                  }
                  catch { $divergenceLines.Add("${name}: results record unreadable for failure text: $($_.Exception.Message)") }
              }

              foreach ($line in (Get-ComparisonDivergenceLines -Row $name -Comparison $comparison -First 40 -FailureText $failureText -TextLines 8)) { $divergenceLines.Add($line) }
          }

          foreach ($line in $divergenceLines) { Write-Host "==> divergences: $line" }

          # A sweep regenerates committed test artifacts in place, so the tree is dirty afterwards
          # and it is (almost always) nothing -- CRLF phantoms and the -tests-closure class. The
          # sweep itself classifies them; this records the raw state alongside for the reader.
          & git -C $PWD status --porcelain -- src/core |
              Set-Content -LiteralPath (Join-Path $art "sweep-$goos-$rid-git-status.txt") -Encoding utf8

          # The CONTENT of those rewrites, not just their names: a non-windows leg's -tests emission
          # differs from the committed (windows) record, and the runner's tree is gone when the job
          # ends. The diff lets a lane read per-GOOS emission drift without a runner of that OS
          # (COORD ruling 2026-10-02, after the first darwin row drifted 15+1 lines unread).
          # WriteAllLines always creates the file, so a clean tree uploads an empty diff rather than none.
          $trackedDiff = Join-Path $art "sweep-$goos-$rid-tracked.diff"
          $diffLines = [string[]]@(& git -C $PWD -c core.quotePath=false diff --no-ext-diff --no-color -- src/core)
          [System.IO.File]::WriteAllLines($trackedDiff, $diffLines)
          Write-Host "==> tracked-rewrite diff: $((Get-Item -LiteralPath $trackedDiff).Length) bytes -> $(Split-Path -Leaf $trackedDiff)"

          $summary = @(
              "## Validated sweep shard -- GOOS=$goos ($rid)"
              ''
              "Rows (exact) ``$($names -join ', ')`` -- -TestTimeout ``$($env:SWEEP_TEST_TIMEOUT)`` -- exit ``$sweepExit``"
              ''
              'A non-Windows leg reports rows with no per-OS annotation as'
              '**comparison-validated-at-count** and exits non-zero by design: validated, but with'
              'nothing banked for this OS to bank against. That is a reading, not a regression.'
              ''
          ) + @(if ($divergenceLines.Count -gt 0) {
              'Each failing row''s comparison record (undisclosed divergences with both verdicts):'
              ''
              '```'
              $divergenceLines
              '```'
              ''
          }) + @(
              'Tail of the run:'
              ''
              '```'
          ) + @(Get-Content -LiteralPath $log -Tail 60 -ErrorAction SilentlyContinue) + @('```')

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          Set-Content -LiteralPath (Join-Path $art "sweep-$goos-$rid-summary.md") -Value $summary -Encoding utf8

          # The summary is ALSO emitted as annotations. Both places a leg's evidence normally
          # lands -- the job summary and the uploaded artifact -- are served from Azure blob
          # storage, so a host whose egress allows api.github.com but denies that domain can read
          # every step's CONCLUSION and none of its content. Annotations come back from the
          # check-runs REST API itself, which keeps this leg readable from such a host (and puts
          # the headline on the run page besides). Nothing above is replaced.
          & ./.github/annotate-summary.ps1 -Title "sweep $goos/$rid" -Lines $summary

          exit $sweepExit

      # -------------------------------------------------------------------------------------
      # The proof's post-run twin (S7-b, plan section 3): the dump census again, against the one taken when the proof
      # passed. A new dump file HOLDS this shard's evidence: its rows do not bank and no further shard is dispatched
      # until the cause is named. It runs whatever the sweep's outcome, and only when the proof itself passed.
      # -------------------------------------------------------------------------------------
      - name: Dump suppression — recheck after the sweep
        if: always() && needs.plan.outputs.stage == 'sweep-shard' && matrix.goos == 'linux' && steps.dumpproof-prove.outcome == 'success'
        shell: bash
        run: |
          state="$RUNNER_TEMP/dumpproof"
          rc=0
          bash ./.github/dump-suppression-proof.sh recheck "$state" || rc=$?
          mkdir -p "artifacts/dumpproof-$RID"
          cp "$state"/*.txt "artifacts/dumpproof-$RID/" 2>/dev/null || true
          exit "$rc"

      # -------------------------------------------------------------------------------------
      # release-smoke — consume the pack job's feed the way a user does, on this leg's host.
      # -------------------------------------------------------------------------------------
      - name: Release smoke — download the feed
        if: (needs.plan.outputs.stage == 'release-smoke' || needs.plan.outputs.stage == 'aot-smoke') && needs.plan.outputs.published-version == ''
        uses: actions/download-artifact@v5
        with:
          name: release-smoke-feed
          path: feed

      - name: Release smoke — rid compile asset, sample, behavioral, walkthrough (measured)
        if: needs.plan.outputs.stage == 'release-smoke'
        shell: pwsh
        env:
          PUBLISHED_VERSION: ${{ needs.plan.outputs.published-version }}
        run: |
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null

          # The consumer projects are NOT corpus projects; the leg-wide GoTargetOS binding must not
          # reach their builds as a global property.
          Remove-Item Env:GoTargetOS -ErrorAction SilentlyContinue

          # The converter, built from this tree (the tree the feed was packed from).
          $exeName = if ($IsWindows) { 'go2cs.exe' } else { 'go2cs' }
          Push-Location 'src/go2cs'
          try { & go build -o "bin/$exeName" . ; $goExit = $LASTEXITCODE } finally { Pop-Location }
          if ($goExit -ne 0) { Write-Host "::error::converter go build failed with exit $goExit"; exit $goExit }

          $work = Join-Path $art "release-smoke-$goos-$rid"
          $log = Join-Path $art "release-smoke-$goos-$rid.log"
          # The README walkthrough GATES on every leg. darwin joined windows and linux once darwin-xsys-libc
          # (TRAIN O) made x/sys/unix reach libc on a Mac: release-smoke 37155599211 ran it byte-identical to
          # `go run` on both chips. A tree without that seat fails darwin's D, by design.
          $gateWalkthrough = $true
          # Pre-publish: this tree's pack. Post-publish (published_version): the version nuget.org serves.
          $published = $env:PUBLISHED_VERSION
          $feedArgs = if ($published) { @{ Feed = 'https://api.nuget.org/v3/index.json'; Version = $published } } else { @{ Feed = (Join-Path $PWD 'feed') } }
          & ./src/tests/PackageTests/release-smoke.ps1 @feedArgs -Converter (Join-Path $PWD "src/go2cs/bin/$exeName") -WorkRoot $work -GateWalkthrough:$gateWalkthrough *>&1 |
              Tee-Object -FilePath $log
          $smokeExit = $LASTEXITCODE

          $summary = @(
              "## Release smoke -- GOOS=$goos ($rid)"
              ''
              "exit ``$smokeExit`` (A, B, C and G gate; D $(if ($gateWalkthrough) { 'gates here' } else { 'is measured only here' }))"
              ''
              '```'
          ) + @(Get-Content -LiteralPath $log | Where-Object { $_ -match '^(release smoke:|PASS|FAIL|MEASURED)' }) + @('```')
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          & ./.github/annotate-summary.ps1 -Title "release-smoke $goos/$rid" -Lines $summary

          # The per-arm caches are large and say nothing the logs do not.
          Get-ChildItem $work -Recurse -Directory -Filter 'nuget-cache' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue
          Get-ChildItem $work -Recurse -Directory -Filter '.artifacts' -Force -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          exit $smokeExit

      # -------------------------------------------------------------------------------------
      # aot-smoke — ONE Native AOT publish and run of a hand-written consumer of the pack's packages.
      # A consumer with no trim mode of its own takes go.lib's TrimMode=partial, so the publish compiles
      # every referenced go.* assembly whole (COORD ruling 2026-10-06: its own stage, out of release-smoke).
      # The executable must exit 0 and print its PACKAGE-SYMBOLS line; the publish wall time is a READ line. FOUR RIDs: osx-arm64
      # since 2026-10-14 (run 38587876788, after e2move broke ILC's generic cycle; it was NOT MEASURED from 2026-10-07).
      # Non-gating on its first train; from the release after, read before a release like the census.
      # -------------------------------------------------------------------------------------
      #
      # THE BOUND (2026-10-14, T4's osx-x64 leg cancelled at 6h00m with the publish in its native link). The step stops at
      # aot-bound-minutes (330 unless dispatched otherwise). On osx-x64 that is continue-on-error and the step after this one
      # turns an expired bound into a NOT MEASURED (timeout) reading; a publish that ENDED with a non-zero exit stays red
      # there. linux-x64, win-x64 and osx-arm64 keep their gate: an expired bound fails the leg as a cancel did.
      - name: AOT smoke — Native AOT publish and run of a package consumer
        id: aot
        if: needs.plan.outputs.stage == 'aot-smoke'
        timeout-minutes: ${{ fromJSON(needs.plan.outputs.aot-bound-minutes) }}
        continue-on-error: ${{ matrix.rid == 'osx-x64' }}
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null

          # The consumer is not a corpus project; the leg-wide GoTargetOS binding must not reach it.
          Remove-Item Env:GoTargetOS -ErrorAction SilentlyContinue

          $feed = Join-Path $PWD 'feed'
          $lib = @(Get-ChildItem $feed -Filter 'go.lib.*.nupkg' | Where-Object { $_.Name -match '^go\.lib\.(\d.*)\.nupkg$' })
          if ($lib.Count -ne 1) { Write-Host "::error::expected exactly one go.lib nupkg in the feed; found $($lib.Count)"; exit 1 }
          $version = [regex]::Match($lib[0].Name, '^go\.lib\.(\d.*)\.nupkg$').Groups[1].Value

          $log = Join-Path $art "aot-smoke-$goos-$rid.log"
          & ./src/tests/PackageTests/PackageSymbols/test-package-symbols.ps1 -Version $version -Source $feed -AotOnly *>&1 |
              Tee-Object -FilePath $log
          $aotExit = $LASTEXITCODE

          $summary = @(
              "## AOT smoke -- GOOS=$goos ($rid)"
              ''
              "exit ``$aotExit`` -- go.* $version from the pack"
              ''
              '```'
          ) + @(Get-Content -LiteralPath $log | Where-Object { $_ -match '^(Package symbols gate|PASS|FAIL|READ|\s+AOT:)' }) + @('```')
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          & ./.github/annotate-summary.ps1 -Title "aot-smoke $goos/$rid" -Lines $summary

          # The publish ended on its own (pass or fail): the bounded-leg step below reads this marker's absence as a timeout.
          Set-Content -LiteralPath (Join-Path $art 'aot-smoke-ended.txt') -Value "exit $aotExit" -Encoding utf8

          exit $aotExit

      - name: AOT smoke — the bounded leg's reading
        if: always() && needs.plan.outputs.stage == 'aot-smoke' && matrix.rid == 'osx-x64' && steps.aot.outcome != 'success' && steps.aot.outcome != 'skipped'
        shell: pwsh
        env:
          AOT_BOUND_MINUTES: ${{ needs.plan.outputs.aot-bound-minutes }}
        run: |
          $ended = Join-Path $PWD 'artifacts/aot-smoke-ended.txt'

          if (Test-Path -LiteralPath $ended) {
              # The publish finished and failed: continue-on-error must not hide that.
              Write-Host "::error::aot-smoke osx-x64 ended with $(Get-Content -LiteralPath $ended -Raw) -- a real failure, not the bound"
              exit 1
          }

          $summary = @(
              "## AOT smoke -- GOOS=$env:GOOS_TARGET ($env:RID)"
              ''
              "NOT MEASURED (timeout): the osx-x64 Native AOT publish did not finish inside its $env:AOT_BOUND_MINUTES-minute bound; the step was stopped, not failed. linux-x64, win-x64 and osx-arm64 remain this stage's AOT gates."
          )
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          & ./.github/annotate-summary.ps1 -Title "aot-smoke $env:GOOS_TARGET/$env:RID" -Lines $summary
          exit 0

      # -------------------------------------------------------------------------------------
      # nugetgo-behavior — ONE sample row, on this leg's own OS, for a nugetgo package (COORD rulings 2026-10-12): the
      # proof of a module with no Go tests, or an additional row set beside a tested module's test proof. The sample
      # under src/tests/ModuleBehavior/ run with `go run`, converted
      # against the package on the feed, built for this RID and run with dotnet (src/tools/nugetgo/
      # Invoke-NugetgoBehaviorRow.ps1). The row is annotated in its own step below and kept in the artifact;
      # Get-NugetgoBehaviorRows.ps1 fetches the rows through the API, and nugetgo-pack.ps1 -BehaviorProofDir binds
      # each to the bytes it packs for that RID.
      # -------------------------------------------------------------------------------------
      - name: nugetgo behavior — sample run with go, and with dotnet against the package
        if: needs.plan.outputs.stage == 'nugetgo-behavior'
        shell: pwsh
        env:
          NUGETGO_MODULE: ${{ needs.plan.outputs.nugetgo-module }}
          NUGETGO_VERSION: ${{ needs.plan.outputs.nugetgo-version }}
          NUGETGO_PACKAGE: ${{ needs.plan.outputs.nugetgo-package }}
          NUGETGO_FEED: ${{ needs.plan.outputs.nugetgo-feed }}
          NUGETGO_FEED_SHA256: ${{ needs.plan.outputs.nugetgo-feed-sha256 }}
          # The matrix label, which the row names beside the image (ImageOS, ImageVersion) the runner reports.
          NUGETGO_RUNNER: ${{ matrix.runner }}
        run: |
          $ErrorActionPreference = 'Continue'

          $goos = $env:GOOS_TARGET
          $rid = $env:RID
          $art = Join-Path $PWD 'artifacts'
          New-Item -ItemType Directory -Force -Path $art | Out-Null

          # The sample is not a corpus project; the leg-wide GoTargetOS binding must not reach its build.
          Remove-Item Env:GoTargetOS -ErrorAction SilentlyContinue

          # The converter, built from this tree.
          $exeName = if ($IsWindows) { 'go2cs.exe' } else { 'go2cs' }
          Push-Location 'src/go2cs'
          try { & go build -o "bin/$exeName" . ; $goExit = $LASTEXITCODE } finally { Pop-Location }
          if ($goExit -ne 0) { Write-Host "::error::converter go build failed with exit $goExit"; exit $goExit }

          # A git: feed (git:COMMIT:FOLDER, resolved by the plan) is that folder of the commit, extracted outside the
          # artifacts and handed to the row as a local folder feed once its nupkg hashes as pinned.
          $feed = $env:NUGETGO_FEED
          if ($feed -match '^git:(?<commit>[0-9a-f]{40}):(?<folder>.+)$') {
              $feedCommit = $Matches['commit']; $feedFolder = $Matches['folder']
              & git fetch --no-tags --depth=1 origin $feedCommit
              if ($LASTEXITCODE -ne 0) { Write-Host "::error::nugetgo feed: git fetch of $feedCommit failed with exit $LASTEXITCODE"; exit 1 }
              $feedRoot = Join-Path $env:RUNNER_TEMP 'nugetgo-feed'
              $feedZip = Join-Path $env:RUNNER_TEMP 'nugetgo-feed.zip'
              & git archive --format=zip -o $feedZip $feedCommit -- $feedFolder
              if ($LASTEXITCODE -ne 0) { Write-Host "::error::nugetgo feed: no folder $feedFolder at $feedCommit (git archive exit $LASTEXITCODE)"; exit 1 }
              Expand-Archive -LiteralPath $feedZip -DestinationPath $feedRoot -Force
              $feed = Join-Path $feedRoot $feedFolder
              $nupkg = @(Get-ChildItem -LiteralPath $feed -File -Filter '*.nupkg' | Where-Object { $_.Name.ToLowerInvariant().EndsWith(".$($env:NUGETGO_PACKAGE.ToLowerInvariant()).nupkg") })
              if ($nupkg.Count -ne 1) { Write-Host "::error::nugetgo feed: $($nupkg.Count) nupkg(s) of version $($env:NUGETGO_PACKAGE) in $feedFolder at $feedCommit, not one"; exit 1 }
              $hash = (Get-FileHash -LiteralPath $nupkg[0].FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($hash -ne $env:NUGETGO_FEED_SHA256) { Write-Host "::error::nugetgo feed: $($nupkg[0].Name) hashes $hash, not the pinned $($env:NUGETGO_FEED_SHA256)"; exit 1 }
              Write-Host "nugetgo feed: $($nupkg[0].Name) at $feedCommit hashes $hash as pinned; folder feed $feed"
          }

          $rows = Join-Path $art 'nugetgo-behavior'
          $work = Join-Path $art "nugetgo-behavior-work-$rid"
          $log = Join-Path $art "nugetgo-behavior-$goos-$rid.log"
          # A child pwsh, so a refusal is an exit code and a log line rather than the end of this step.
          & pwsh -NoProfile -File ./src/tools/nugetgo/Invoke-NugetgoBehaviorRow.ps1 -ModulePath $env:NUGETGO_MODULE -GoVersion $env:NUGETGO_VERSION `
              -PackageVersion $env:NUGETGO_PACKAGE -Feed $feed -Rid $rid -Converter (Join-Path $PWD "src/go2cs/bin/$exeName") `
              -OutDir $rows -Work $work *>&1 | Tee-Object -FilePath $log
          $rowExit = $LASTEXITCODE

          $row = Join-Path $rows "$rid.md"
          $summary = @(
              "## nugetgo behavior -- $($env:NUGETGO_MODULE) $($env:NUGETGO_VERSION) on $rid"
              ''
              "exit ``$rowExit`` -- package $($env:NUGETGO_PACKAGE) from $($env:NUGETGO_FEED)$(if ($env:NUGETGO_FEED_SHA256) { " (nupkg SHA-256 $($env:NUGETGO_FEED_SHA256))" })"
              ''
              '```'
          ) + @(if (Test-Path -LiteralPath $row) { Get-Content -LiteralPath $row } else { Get-Content -LiteralPath $log | Select-Object -Last 15 }) + @('```')
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value $summary
          & ./.github/annotate-summary.ps1 -Title "nugetgo-behavior $goos/$rid" -Lines $summary

          # The restored packages and the build output are large and say nothing the logs and the row do not.
          Remove-Item -Recurse -Force (Join-Path $work 'packages') -ErrorAction SilentlyContinue
          Get-ChildItem $work -Recurse -Directory -Include 'bin', 'obj' -ErrorAction SilentlyContinue | Remove-Item -Recurse -Force -ErrorAction SilentlyContinue

          exit $rowExit

      # The row in its OWN step with a fixed title, so the fetch script selects it by title and it never collides with
      # the leg's summary chunks or a runner warning (C1, 2026-10-12). It is printed plainly too, for a human. A row is
      # annotated whatever its verdict: a row whose outputs differ is the evidence of that.
      - name: nugetgo behavior — the row, as an annotation
        if: always() && needs.plan.outputs.stage == 'nugetgo-behavior'
        shell: pwsh
        run: |
          $row = Join-Path $PWD "artifacts/nugetgo-behavior/$($env:RID).md"
          if (-not (Test-Path -LiteralPath $row)) { Write-Host "no row was written for $($env:RID)"; exit 0 }
          Import-Module ./src/tools/nugetgo/NugetgoBehaviorProof.psm1
          $text = [System.IO.File]::ReadAllText($row)
          Write-Host $text
          & ./.github/annotate-summary.ps1 -Title "nugetgo-row $($env:RID)" -Lines @(ConvertTo-NugetgoRowAnnotationText -Text $text)

      # -------------------------------------------------------------------------------------
      # Artifacts — always, because a failed leg is the reading this workflow exists to produce.
      # -------------------------------------------------------------------------------------
      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: os-matrix-${{ needs.plan.outputs.stage }}-${{ matrix.goos }}-${{ matrix.rid }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn
