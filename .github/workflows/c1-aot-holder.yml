# Confirms G's darwin Native AOT fix (claude/g-aot-frozen-token-holder) and closes the main-return wait leg's OPEN darwin
# AOT arms, on both hosted mac runners, when this branch is pushed. It lives on claude/c1-aot-holder only and is never
# merged: the measurement is docs/phase4/data/main-return-wait/c1-macos-aot/run-aot.sh, and each runner pushes its raw
# logs to its own branch, claude/c1-aot-holder-raw-<rid>-<run id>, because this lane's session cannot download artifacts.
name: C1 darwin AOT token-holder confirm

on:
  push:
    branches: [claude/c1-aot-holder]
    paths:
      - .github/workflows/c1-aot-holder.yml
      - docs/phase4/data/main-return-wait/c1-macos-aot/run-aot.sh

permissions:
  contents: write

jobs:
  leg:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-15, rid: osx-arm64 }
          - { runner: macos-15-intel, rid: osx-x64 }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 330
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
      # The corpus flavor this host runs: without it every build links the windows flavor (os-matrix sets the same).
      GoTargetOS: darwin
      TIP: 7f4279bd15
      BASE: 64d145b2c4
      N: '50'
    steps:
      - name: Checkout (full history, for the base)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Trees at the tip and the base
        run: |
          set -eu
          git worktree add "$RUNNER_TEMP/tip" "$TIP"
          git worktree add "$RUNNER_TEMP/base" "$BASE"

      - name: Control, fix and the open AOT arms
        run: |
          set +e
          # macOS's own bash is 3.2; the script is written for it, and runs under Homebrew's bash when there is one.
          B=/bin/bash; for c in /opt/homebrew/bin/bash /usr/local/bin/bash; do [ -x "$c" ] && B=$c && break; done
          echo "bash: $B $("$B" -c 'echo $BASH_VERSION')"
          "$B" docs/phase4/data/main-return-wait/c1-macos-aot/run-aot.sh "$RUNNER_TEMP/tip" "$RUNNER_TEMP/base" \
            "${{ matrix.rid }}" "$N" "$RUNNER_TEMP/out"
          echo "script exit $?"
          grep -E '^(==|ARM|built|BUILD|KEY|REFUSED)' "$RUNNER_TEMP/out/aot.log" > "$RUNNER_TEMP/summary.txt"
          echo "::notice title=aot-holder ${{ matrix.rid }}::$(sed 's/%/%25/g' "$RUNNER_TEMP/summary.txt" | awk '{printf "%s%%0A", $0}')"

      - name: Push the raw logs to claude/c1-aot-holder-raw-${{ matrix.rid }}-${{ github.run_id }}
        if: always()
        run: |
          set -eu
          OUT="$RUNNER_TEMP/out"
          [ -d "$OUT" ] || exit 0
          # Text logs only: no executables, no build output.
          rm -rf "$OUT"/aot-*
          D="$RUNNER_TEMP/raw"
          mkdir -p "$D"
          cp -R "$OUT" "$D/${{ matrix.rid }}"
          cd "$D"
          git init -q -b raw
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "darwin AOT token-holder confirm: raw logs, ${{ matrix.rid }}, run ${{ github.run_id }}"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            "HEAD:refs/heads/claude/c1-aot-holder-raw-${{ matrix.rid }}-${{ github.run_id }}"
